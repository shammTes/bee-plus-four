name: Build 4 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Download content pack + G10 textbooks from Drive
        run: |
          set -e
          mkdir -p assets/content/textbooks assets/content/illustrated assets/content/illustrated/g6_math_ch1_webp assets/content/illustrated_pdf
          pip install -q gdown

          # Full content pack (practice, notes, matric, unit PDFs)
          PACK_ID="10yTnb1p3fo0fpHI0OSMGZXYMvKX2mx1t"
          echo "Downloading content pack $PACK_ID …"
          gdown --fuzzy "https://drive.google.com/file/d/${PACK_ID}/view" -O /tmp/four_content.tgz || \
          gdown "https://drive.google.com/uc?id=${PACK_ID}" -O /tmp/four_content.tgz || true
          if [ -f /tmp/four_content.tgz ] && gzip -t /tmp/four_content.tgz 2>/dev/null; then
            mkdir -p /tmp/four_extract
            tar xzf /tmp/four_content.tgz -C /tmp/four_extract
            if [ -d /tmp/four_extract/assets/content ]; then
              cp -a /tmp/four_extract/assets/content/. assets/content/
            fi
            echo "Content pack extracted OK"
          else
            echo "::warning::Content pack not downloadable — share Anyone with the link"
          fi

          # G10 textbook PDFs (~54 MB). Each file must be shared Anyone with the link.
          download_pdf() {
            local id="$1" out="$2"
            echo "gdown textbook $out"
            gdown --fuzzy "https://drive.google.com/file/d/${id}/view" -O "$out" || \
            gdown "https://drive.google.com/uc?id=${id}" -O "$out" || \
            echo "::warning::Failed $id"
          }
          download_pdf 1K4NMizllBAIJWLN4pqFLJeDAAwPnO4h5 assets/content/textbooks/G10_AGRICULTURE.pdf
          download_pdf 1VRKGJzQ4zJjhpmP4mu1RmcdrGGYovIBE assets/content/textbooks/G10_BIOLOGY.pdf
          download_pdf 1XcjQx1oYauhGsLRga2obvOPADPodFt6A assets/content/textbooks/G10_BUSINESS_ECONOMICS.pdf
          download_pdf 1xJmAtAFehHqLNNh8xhDNRPvll8wrqR0S assets/content/textbooks/G10_CHEMISTRY.pdf
          download_pdf 16C8nnT_PkQ-j5HXla8Tv6eGTkHLwjIb3 assets/content/textbooks/G10_ENGLISH.pdf
          download_pdf 12SmdDj-RT89t1YiX16FVc8qwhWI9coq- assets/content/textbooks/G10_GEOGRAPHY.pdf
          download_pdf 1HbsEZFua38nBDpLpe3o1vrWhCU7LVUf2 assets/content/textbooks/G10_MATH.pdf
          download_pdf 1ATLRgNxPShRGdb7EdONBcH78gfPh_wgA assets/content/textbooks/G10_PHYSICS.pdf

          test -f assets/content/unit_notes.json || echo '[]' > assets/content/unit_notes.json
          test -f assets/content/practice_index.json || echo '{"files":["practice_lite.json"],"lite":"practice_lite.json"}' > assets/content/practice_index.json
          test -f assets/content/exam_catalog.json || echo '{"matriculation":[],"model_exam_years":[]}' > assets/content/exam_catalog.json

          echo "=== content summary ==="
          find assets/content -type f | wc -l
          du -sh assets/content assets/content/textbooks 2>/dev/null || true

      - name: Generate icons
        run: |
          python3 << 'PY'
          import struct, zlib, os
          def png(w, h, rgb=(13, 148, 136)):
              def chunk(t, d):
                  return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              raw = b''.join(b'\x00' + bytes(rgb) * w for _ in range(h))
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
          base = 'android/app/src/main/res'
          for dens, s in [('mipmap-mdpi', 48), ('mipmap-hdpi', 72), ('mipmap-xhdpi', 96), ('mipmap-xxhdpi', 144), ('mipmap-xxxhdpi', 192)]:
              d = f'{base}/{dens}'
              os.makedirs(d, exist_ok=True)
              open(f'{d}/ic_launcher.png', 'wb').write(png(s, s))
          print('icons ok')
          PY

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: four-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
