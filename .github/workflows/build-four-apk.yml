name: Build 4 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Download full offline content pack
        run: |
          set -e
          mkdir -p assets/content/textbooks assets/content/illustrated assets/content/illustrated/g6_math_ch1_webp assets/content/illustrated_pdf
          pip install -q gdown
          PACK_IDS="1zWHWp6S8R6KwZZLY1A1EwlulIe2Zx9Xa 1Bf_eqJ1BJkwOj-SSNBjmO8Om0e1TGI3B 1QrhYo3cnzTfaGuoLNEEAjrSyRAu59sZm 1J41cz00pHXvvaC1FSe_WZIHhGaCU4xUq"
          DOWNLOADED=0
          for id in $PACK_IDS; do
            echo "Trying pack $id"
            rm -f /tmp/four_content.tgz
            if python3 -m gdown "https://drive.google.com/uc?id=${id}" -O /tmp/four_content.tgz; then
              if gzip -t /tmp/four_content.tgz 2>/dev/null; then
                DOWNLOADED=1
                echo "gdown OK for $id"
                break
              fi
            fi
            rm -f /tmp/four_content.tgz
            if python3 -m gdown "https://drive.google.com/uc?id=${id}&confirm=t" -O /tmp/four_content.tgz; then
              if gzip -t /tmp/four_content.tgz 2>/dev/null; then
                DOWNLOADED=1
                echo "gdown confirm OK for $id"
                break
              fi
            fi
            curl -sSL -c /tmp/cj -b /tmp/cj -L "https://drive.google.com/uc?export=download&confirm=t&id=${id}" -o /tmp/four_content.tgz || true
            if [ -f /tmp/four_content.tgz ] && gzip -t /tmp/four_content.tgz 2>/dev/null; then
              DOWNLOADED=1
              echo "curl OK for $id"
              break
            fi
          done
          if [ "$DOWNLOADED" = "1" ]; then
            echo "Pack size: $(du -h /tmp/four_content.tgz | cut -f1)"
            mkdir -p /tmp/four_extract
            tar xzf /tmp/four_content.tgz -C /tmp/four_extract
            if [ -d /tmp/four_extract/assets/content ]; then
              cp -a /tmp/four_extract/assets/content/. assets/content/
            elif [ -d /tmp/four_extract/content ]; then
              cp -a /tmp/four_extract/content/. assets/content/
            else
              echo "::warning::Unexpected pack layout"
              find /tmp/four_extract | head -40
            fi
          else
            echo "::warning::Drive pack not downloadable. Share as Anyone with the link."
          fi
          # Overlay latest exam bank + notes packs (JSON)
          BANK_IDS="1iW_W13FvQ5t1TgWDOoXFHkY_Yuu86-x2 1vPElVBoHpAbwGtamCfV4VdQIQ8luxPId 1NT-WewVM8MLhTrUCZ_hmKPoOullU2fZR"
          for id in $BANK_IDS; do
            rm -f /tmp/four_bank.tgz
            python3 -m gdown "https://drive.google.com/uc?id=${id}&confirm=t" -O /tmp/four_bank.tgz 2>/dev/null || \
              curl -sSL -L "https://drive.google.com/uc?export=download&confirm=t&id=${id}" -o /tmp/four_bank.tgz || true
            if [ -f /tmp/four_bank.tgz ] && gzip -t /tmp/four_bank.tgz 2>/dev/null; then
              echo "Bank overlay OK $id ($(du -h /tmp/four_bank.tgz | cut -f1))"
              mkdir -p /tmp/bank_extract
              tar xzf /tmp/four_bank.tgz -C /tmp/bank_extract
              # files may be at root or under content/
              find /tmp/bank_extract -type f -name '*.json' -exec cp -f {} assets/content/ \;
              break
            fi
          done
          test -f assets/content/unit_notes.json || echo '[]' > assets/content/unit_notes.json
          test -f assets/content/practice_index.json || echo '{"files":["practice_lite.json"],"lite":"practice_lite.json"}' > assets/content/practice_index.json
          test -f assets/content/practice_lite.json || echo '[]' > assets/content/practice_lite.json
          test -f assets/content/practice_questions.json || echo '[]' > assets/content/practice_questions.json
          test -f assets/content/illustrated_slides.json || echo '{}' > assets/content/illustrated_slides.json
          test -f assets/content/exam_catalog.json || echo '{"matriculation":[],"model_exam_years":[]}' > assets/content/exam_catalog.json
          test -f assets/content/matric_questions.json || echo '[]' > assets/content/matric_questions.json
          test -f assets/content/flashcards.json || echo '[]' > assets/content/flashcards.json
          test -f assets/content/textbooks_catalog.json || echo '{"book_count":0,"books":[]}' > assets/content/textbooks_catalog.json
          test -f assets/content/illustrated_catalog_hs.json || echo '{"deck_count":0,"decks":[]}' > assets/content/illustrated_catalog_hs.json
          for g in g9 g10 g11 g12; do
            test -f assets/content/illustrated_catalog_${g}.json || echo '{"decks":[],"deck_count":0}' > assets/content/illustrated_catalog_${g}.json
          done
          echo "Content bytes: $(du -sb assets/content | cut -f1)"
          find assets/content -type f | wc -l
          du -sh assets/content || true
          ls -la assets/content/*.json 2>/dev/null | head -30

      - name: Generate launcher icons
        run: |
          python3 << 'ICON'
          import struct, zlib, os
          def chunk(tag, data):
              return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
          def png(w, h, rgb=(13, 148, 136)):
              raw = b''.join(b'\x00' + bytes(rgb) * w for _ in range(h))
              return (
                  b'\x89PNG\r\n\x1a\n'
                  + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                  + chunk(b'IDAT', zlib.compress(raw, 9))
                  + chunk(b'IEND', b'')
              )
          base = 'android/app/src/main/res'
          for dens, size in [
              ('mipmap-mdpi', 48),
              ('mipmap-hdpi', 72),
              ('mipmap-xhdpi', 96),
              ('mipmap-xxhdpi', 144),
              ('mipmap-xxxhdpi', 192),
          ]:
              d = os.path.join(base, dens)
              os.makedirs(d, exist_ok=True)
              with open(os.path.join(d, 'ic_launcher.png'), 'wb') as f:
                  f.write(png(size, size))
          print('icons ok')
          ICON

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: four-release-apk
          path: build/app/outputs/flutter-apk/*.apk
