name: Build 4 APKs (student / seller / master)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Ensure content asset dirs exist
        run: |
          mkdir -p assets/content/textbooks assets/content/illustrated_pdf assets/fonts
          # placeholder so empty dirs are valid if needed
          touch assets/content/textbooks/.gitkeep assets/content/illustrated_pdf/.gitkeep

      - name: Download textbook-derived notes + practice (public Drive)
        continue-on-error: true
        run: |
          set +e
          pip install -q 'gdown>=5.0' || pip install -q gdown
          gdown "https://drive.google.com/uc?id=1gv_l5Vay2WWt-NybgA8bb3DwPseMAu0q&export=download" -O assets/content/unit_notes_rich.json || true
          gdown "https://drive.google.com/uc?id=1BPqrDcoC63zyQ1A16VKGtIssBKT1Tcqf&export=download" -O assets/content/notes_ALL_BOOKS_v2_polished.json || true
          gdown "https://drive.google.com/uc?id=1Le6xHfpnvpRJ7oGiF70_SFzTkIWTJZSY&export=download" -O assets/content/practice_from_notes.json || true
          ls -lh assets/content/*.json 2>/dev/null | head -20

      - name: Download illustrated PDFs from Drive catalog
        continue-on-error: true
        run: |
          set +e
          python3 tools/download_illustrated_from_drive.py || true
          find assets/content/illustrated_pdf -type f 2>/dev/null | wc -l

      - name: Polish textbook notes
        run: |
          python3 tools/polish_notes_from_textbook.py || true
          python3 tools/generate_curriculum_notes.py || true
          python3 << 'PY'
import json
from pathlib import Path

def load(p):
    try:
        d=json.loads(Path(p).read_text(encoding='utf-8'))
        return d if isinstance(d, list) else []
    except Exception:
        return []

def key(n):
    return (str(n.get('grade','')).upper(), str(n.get('subject','')).upper(), int(n.get('unit_number') or 0))

def score(n):
    return (len(n.get('summary') or '')
            + sum(len(x.get('explanation') or '') for x in (n.get('sections') or []))
            + 20*len(n.get('examples') or [])
            + 10*len(n.get('exercises') or []))

base={}
for path in ['assets/content/unit_notes_rich.json','assets/content/unit_notes.json']:
    for n in load(path):
        if not isinstance(n, dict): continue
        k=key(n)
        if k not in base or score(n) > score(base[k]):
            base[k]=n
if not base:
    Path('assets/content/unit_notes.json').write_text('[]', encoding='utf-8')
else:
    notes=sorted(base.values(), key=key)
    Path('assets/content/unit_notes.json').write_text(json.dumps(notes, ensure_ascii=False), encoding='utf-8')
    print('FINAL notes', len(notes))
PY
          test -f assets/content/exam_catalog.json || echo '{"matriculation":[],"model_exam_years":[]}' > assets/content/exam_catalog.json
          test -f assets/content/practice_questions.json || echo '[]' > assets/content/practice_questions.json
          test -f assets/content/practice_index.json || echo '{"files":["practice_from_notes.json","practice_questions.json"],"lite":"practice_lite.json"}' > assets/content/practice_index.json
          test -f assets/content/unit_notes.json || echo '[]' > assets/content/unit_notes.json
          du -sh assets/content || true

      - name: Generate icons
        run: |
          python3 << 'PY'
          try:
              from PIL import Image, ImageDraw, ImageFont
          except ImportError:
              import subprocess, sys
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-q', 'pillow'])
              from PIL import Image, ImageDraw, ImageFont
          import os
          def make_icon(path, label, bg=(13, 148, 136), size=192):
              img = Image.new('RGB', (size, size), bg)
              d = ImageDraw.Draw(img)
              try:
                  font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', size // 3)
              except Exception:
                  font = ImageFont.load_default()
              bbox = d.textbbox((0, 0), label, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              d.text(((size - tw) / 2, (size - th) / 2 - 4), label, fill=(255, 255, 255), font=font)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              img.save(path, 'PNG')
          base = 'android/app/src/main/res'
          for dens, s in [('mipmap-mdpi', 48), ('mipmap-hdpi', 72), ('mipmap-xhdpi', 96),
                          ('mipmap-xxhdpi', 144), ('mipmap-xxxhdpi', 192)]:
              make_icon(f'{base}/{dens}/ic_launcher.png', '4', size=s)
          print('icons ok')
          PY

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-fatal)
        continue-on-error: true
        run: flutter analyze || true

      - name: Build student APK
        run: |
          set -e
          flutter build apk --release --flavor student --target lib/main.dart \
            --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Build seller APK
        continue-on-error: true
        run: |
          flutter build apk --release --flavor seller --target lib/seller_main.dart \
            --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Build master APK
        continue-on-error: true
        run: |
          flutter build apk --release --flavor master --target lib/master_main.dart \
            --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Collect APKs
        run: |
          mkdir -p dist
          find build/app/outputs/flutter-apk -name '*.apk' -exec cp -v {} dist/ \; || true
          ls -lh dist/ || true
          test -n "$(ls -A dist 2>/dev/null)"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: four-three-apks
          path: |
            dist/
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
