name: Build 4 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Download full content pack (Drive — share as Anyone with the link)
        run: |
          set -e
          mkdir -p assets/content
          PACK_ID="1Pp6n2ENxbvgNQMV_u0n8hDFhXKhJfMQG"
          pip install -q gdown
          echo "Downloading content pack $PACK_ID …"
          gdown --fuzzy "https://drive.google.com/file/d/${PACK_ID}/view" -O /tmp/four_content.tgz || \
          gdown "https://drive.google.com/uc?id=${PACK_ID}" -O /tmp/four_content.tgz || true

          if [ -f /tmp/four_content.tgz ] && gzip -t /tmp/four_content.tgz 2>/dev/null; then
            mkdir -p /tmp/four_extract
            tar xzf /tmp/four_content.tgz -C /tmp/four_extract
            if [ -d /tmp/four_extract/assets/content ]; then
              cp -a /tmp/four_extract/assets/content/. assets/content/
            elif [ -d /tmp/four_extract/bee-plus-four/assets/content ]; then
              cp -a /tmp/four_extract/bee-plus-four/assets/content/. assets/content/
            elif [ -d /tmp/four_extract/content ]; then
              cp -a /tmp/four_extract/content/. assets/content/
            else
              find /tmp/four_extract -type f \( -name '*.json' -o -name '*.webp' \) -exec cp -n {} assets/content/ \; || true
            fi
            echo "Content pack extracted OK"
          else
            echo "::warning::Drive pack not downloadable. Open this file in Drive → Share → Anyone with the link → Viewer"
            echo "https://drive.google.com/file/d/${PACK_ID}/view"
          fi

          test -f assets/content/unit_notes.json || echo '[]' > assets/content/unit_notes.json
          test -f assets/content/practice_questions.json || echo '[]' > assets/content/practice_questions.json
          test -f assets/content/illustrated_slides.json || echo '{}' > assets/content/illustrated_slides.json
          test -f assets/content/practice_index.json || echo '{"files":[],"lite":"practice_lite.json"}' > assets/content/practice_index.json
          test -f assets/content/exam_catalog.json || echo '{"matriculation":[],"model_exam_years":[]}' > assets/content/exam_catalog.json

          echo "=== assets/content summary ==="
          find assets/content -type f | wc -l
          du -sh assets/content
          find assets/content -type f | head -80
          BYTES=$(du -sb assets/content | cut -f1)
          echo "Content bytes: $BYTES"
          if [ "$BYTES" -lt 50000 ]; then
            echo "::warning::Content still thin ($BYTES bytes). Share the Drive pack and re-run workflow."
          fi

      - name: Generate icons
        run: |
          python3 << 'PY'
          import struct, zlib, os
          def png(w, h, rgb=(13, 148, 136)):
              def chunk(t, d):
                  return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              raw = b''.join(b'\x00' + bytes(rgb) * w for _ in range(h))
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
          base = 'android/app/src/main/res'
          for dens, s in [('mipmap-mdpi', 48), ('mipmap-hdpi', 72), ('mipmap-xhdpi', 96), ('mipmap-xxhdpi', 144), ('mipmap-xxxhdpi', 192)]:
              d = f'{base}/{dens}'
              os.makedirs(d, exist_ok=True)
              open(f'{d}/ic_launcher.png', 'wb').write(png(s, s))
          print('icons ok')
          PY

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: four-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
