name: Build 4 APKs (student / seller / master)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Noto Sans Ethiopic (Tigrinya / Ge'ez — fixes □ glyphs)
        run: |
          mkdir -p assets/fonts
          curl -sL -o assets/fonts/NotoSansEthiopic-Regular.ttf \
            "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansEthiopic/NotoSansEthiopic-Regular.ttf"
          ls -lh assets/fonts/
          test -s assets/fonts/NotoSansEthiopic-Regular.ttf

      - name: Optional Drive content overlay (rich notes / packs)
        continue-on-error: true
        run: |
          set +e
          mkdir -p assets/content
          pip install -q 'gdown>=5.0' || pip install -q gdown
          # Prefer rich textbook-derived notes when available
          gdown "https://drive.google.com/uc?id=1gv_l5Vay2WWt-NybgA8bb3DwPseMAu0q&export=download" -O assets/content/unit_notes_rich.json || true
          PACK_ID="1Pp6n2ENxbvgNQMV_u0n8hDFhXKhJfMQG"
          gdown "https://drive.google.com/uc?id=${PACK_ID}&export=download" -O /tmp/four_content.tgz || true
          if [ -f /tmp/four_content.tgz ] && gzip -t /tmp/four_content.tgz 2>/dev/null; then
            mkdir -p /tmp/four_extract
            tar xzf /tmp/four_content.tgz -C /tmp/four_extract
            if [ -d /tmp/four_extract/assets/content ]; then
              cp -an /tmp/four_extract/assets/content/. assets/content/ || true
            fi
          fi

      - name: Download illustrated PDFs from Drive catalog
        continue-on-error: true
        run: |
          set +e
          pip install -q 'gdown>=5.0' || true
          python3 tools/download_illustrated_from_drive.py || true
          find assets/content/illustrated_pdf -type f -name '*.pdf' 2>/dev/null | wc -l

      - name: Generate curriculum notes (fills gaps only — does not wipe rich notes)
        run: |
          mkdir -p assets/content
          # Snapshot rich notes if present
          if [ -f assets/content/unit_notes_rich.json ]; then
            cp assets/content/unit_notes_rich.json /tmp/unit_notes_rich.json
          fi
          if [ -f assets/content/unit_notes.json ]; then
            cp assets/content/unit_notes.json /tmp/unit_notes_before.json
          fi
          python3 tools/generate_curriculum_notes.py
          # Merge: keep longer textbook-derived notes over generator stubs
          python3 << 'PY'
import json
from pathlib import Path

def load(p):
    try:
        return json.loads(Path(p).read_text(encoding='utf-8'))
    except Exception:
        return []

def key(n):
    return (n.get('grade'), n.get('subject'), int(n.get('unit_number') or 0))

def score(n):
    s = len(n.get('summary') or '')
    s += sum(len(x.get('explanation') or '') for x in (n.get('sections') or []))
    s += sum(len(x.get('solution') or '') for x in (n.get('examples') or []))
    s += 50 * len(n.get('key_ideas') or [])
    return s

base = {}
for path in ['/tmp/unit_notes_before.json', '/tmp/unit_notes_rich.json', 'assets/content/unit_notes.json']:
    for n in load(path):
        if not isinstance(n, dict): continue
        k = key(n)
        if k not in base or score(n) > score(base[k]):
            base[k] = n
notes = sorted(base.values(), key=lambda n: (n.get('grade'), n.get('subject'), int(n.get('unit_number') or 0)))
Path('assets/content/unit_notes.json').write_text(json.dumps(notes, ensure_ascii=False), encoding='utf-8')
for g in ['G9','G10','G11','G12']:
    sub = [n for n in notes if n.get('grade')==g]
    Path(f'assets/content/unit_notes_{g.lower()}.json').write_text(json.dumps(sub, ensure_ascii=False), encoding='utf-8')
print('merged notes', len(notes))
PY
          test -f assets/content/exam_catalog.json || echo '{"matriculation":[],"model_exam_years":[]}' > assets/content/exam_catalog.json
          test -f assets/content/practice_questions.json || echo '[]' > assets/content/practice_questions.json
          python3 -c "import json; print('notes', len(json.load(open('assets/content/unit_notes.json')))); print('slides', len(json.load(open('assets/content/illustrated_slides.json'))))"
          find assets/content -type f | wc -l
          du -sh assets/content assets/fonts

      - name: Generate icons
        run: |
          python3 << 'PY'
          try:
              from PIL import Image, ImageDraw, ImageFont
          except ImportError:
              import subprocess, sys
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-q', 'pillow'])
              from PIL import Image, ImageDraw, ImageFont
          import os
          def make_icon(path, label, bg=(13, 148, 136), size=192):
              img = Image.new('RGB', (size, size), bg)
              d = ImageDraw.Draw(img)
              try:
                  font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', size // 3)
              except Exception:
                  font = ImageFont.load_default()
              bbox = d.textbbox((0, 0), label, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              d.text(((size - tw) / 2, (size - th) / 2 - 4), label, fill=(255, 255, 255), font=font)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              img.save(path, 'PNG')
          base = 'android/app/src/main/res'
          for dens, s in [('mipmap-mdpi', 48), ('mipmap-hdpi', 72), ('mipmap-xhdpi', 96),
                          ('mipmap-xxhdpi', 144), ('mipmap-xxxhdpi', 192)]:
              make_icon(f'{base}/{dens}/ic_launcher.png', '4', size=s)
          print('icons ok')
          PY

      - name: Pub get
        run: flutter pub get

      - name: Build student APK
        run: |
          flutter build apk --release --flavor student --target lib/main.dart \
            --no-tree-shake-icons --android-skip-build-dependency-validation || \
          flutter build apk --release --target lib/main.dart --no-tree-shake-icons

      - name: Build seller APK
        run: |
          flutter build apk --release --flavor seller --target lib/seller_main.dart \
            --no-tree-shake-icons --android-skip-build-dependency-validation || true

      - name: Build master APK
        run: |
          flutter build apk --release --flavor master --target lib/master_main.dart \
            --no-tree-shake-icons --android-skip-build-dependency-validation || true

      - name: Collect APKs
        run: |
          mkdir -p dist
          find build/app/outputs/flutter-apk -name '*.apk' -exec cp -v {} dist/ \; || true
          ls -lh dist/ || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: four-three-apks
          path: |
            dist/
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
