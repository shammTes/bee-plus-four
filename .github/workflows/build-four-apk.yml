name: Build 4 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Download full offline content pack
        run: |
          set -e
          mkdir -p assets/content/textbooks assets/content/illustrated assets/content/illustrated/g6_math_ch1_webp assets/content/illustrated_pdf
          pip install -q gdown

          PACK_IDS="1Bf_eqJ1BJkwOj-SSNBjmO8Om0e1TGI3B 1QrhYo3cnzTfaGuoLNEEAjrSyRAu59sZm 1J41cz00pHXvvaC1FSe_WZIHhGaCU4xUq 10yTnb1p3fo0fpHI0OSMGZXYMvKX2mx1t"
          DOWNLOADED=0

          download_pack() {
            local id="$1"
            echo "Trying pack $id …"
            rm -f /tmp/four_content.tgz
            python3 -m gdown "https://drive.google.com/uc?id=${id}" -O /tmp/four_content.tgz 2>/tmp/gdown.err && return 0
            cat /tmp/gdown.err || true
            python3 -m gdown "https://drive.google.com/uc?id=${id}&confirm=t" -O /tmp/four_content.tgz 2>/tmp/gdown.err && return 0
            rm -f /tmp/cj /tmp/four_content.tgz /tmp/drive_landing.html
            curl -sSL -c /tmp/cj -b /tmp/cj \
              "https://drive.google.com/uc?export=download&id=${id}" -o /tmp/drive_landing.html || true
            CONFIRM=$(python3 - <<'PY'
import re
try:
 html=open('/tmp/drive_landing.html','r',errors='ignore').read()
except Exception:
 html=''
m=re.search(r'confirm=([0-9A-Za-z_]+)', html)
print(m.group(1) if m else 't')
PY
)
            curl -sSL -c /tmp/cj -b /tmp/cj -L \
              "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${id}" \
              -o /tmp/four_content.tgz || true
            if [ -f /tmp/four_content.tgz ] && gzip -t /tmp/four_content.tgz 2>/dev/null; then
              return 0
            fi
            return 1
          }

          for id in $PACK_IDS; do
            if download_pack "$id"; then
              if [ -f /tmp/four_content.tgz ] && gzip -t /tmp/four_content.tgz 2>/dev/null; then
                DOWNLOADED=1
                echo "Downloaded pack $id OK ($(du -h /tmp/four_content.tgz | cut -f1))"
                break
              fi
            fi
          done

          if [ "$DOWNLOADED" = "1" ]; then
            mkdir -p /tmp/four_extract
            tar xzf /tmp/four_content.tgz -C /tmp/four_extract
            if [ -d /tmp/four_extract/assets/content ]; then
              cp -a /tmp/four_extract/assets/content/. assets/content/
            elif [ -d /tmp/four_extract/content ]; then
              cp -a /tmp/four_extract/content/. assets/content/
            else
              echo "::warning::Unexpected pack layout"
              find /tmp/four_extract | head -40
            fi
          else
            echo "::warning::Drive pack not downloadable from Actions. Share as Anyone with the link → Viewer."
            echo "https://drive.google.com/file/d/1Bf_eqJ1BJkwOj-SSNBjmO8Om0e1TGI3B/view"
          fi

          test -f assets/content/unit_notes.json || echo '[]' > assets/content/unit_notes.json
          test -f assets/content/practice_index.json || echo '{"files":["practice_lite.json"],"lite":"practice_lite.json"}' > assets/content/practice_index.json
          test -f assets/content/practice_lite.json || echo '[]' > assets/content/practice_lite.json
          test -f assets/content/practice_questions.json || echo '[]' > assets/content/practice_questions.json
          test -f assets/content/illustrated_slides.json || echo '{}' > assets/content/illustrated_slides.json
          test -f assets/content/exam_catalog.json || echo '{"matriculation":[],"model_exam_years":[]}' > assets/content/exam_catalog.json
          test -f assets/content/textbooks_catalog.json || echo '{"book_count":0,"books":[]}' > assets/content/textbooks_catalog.json
          test -f assets/content/illustrated_catalog_hs.json || echo '{"deck_count":0,"decks":[]}' > assets/content/illustrated_catalog_hs.json
          for g in g9 g10 g11 g12; do
            test -f assets/content/illustrated_catalog_${g}.json || echo '{"decks":[],"deck_count":0}' > assets/content/illustrated_catalog_${g}.json
          done

          BYTES=$(du -sb assets/content | cut -f1)
          echo "Content bytes: $BYTES"
          find assets/content -type f | wc -l
          du -sh assets/content || true

      - name: Generate icons
        run: |
          python3 << 'PY'
          import struct, zlib, os
          def png(w, h, rgb=(13, 148, 136)):
              def chunk(t, d):
                  return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              raw = b''.join(b'\x00' + bytes(rgb) * w for _ in range(h))
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
          base = 'android/app/src/main/res'
          for dens, s in [('mipmap-mdpi', 48), ('mipmap-hdpi', 72), ('mipmap-xhdpi', 96), ('mipmap-xxhdpi', 144), ('mipmap-xxxhdpi', 192)]:
              d = f'{base}/{dens}'
              os.makedirs(d, exist_ok=True)
              open(f'{d}/ic_launcher.png', 'wb').write(png(s, s))
          print('icons ok')
          PY

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: four-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
