name: Build 4 APKs (student / seller / master)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Download full content pack (Drive — must be shared Anyone with link)
        run: |
          set -e
          mkdir -p assets/content
          PACK_ID="1Pp6n2ENxbvgNQMV_u0n8hDFhXKhJfMQG"
          pip install -q gdown
          echo "Downloading content pack $PACK_ID …"
          gdown --fuzzy "https://drive.google.com/file/d/${PACK_ID}/view" -O /tmp/four_content.tgz || \
          gdown "https://drive.google.com/uc?id=${PACK_ID}" -O /tmp/four_content.tgz || true

          if [ -f /tmp/four_content.tgz ] && gzip -t /tmp/four_content.tgz 2>/dev/null; then
            mkdir -p /tmp/four_extract
            tar xzf /tmp/four_content.tgz -C /tmp/four_extract
            if [ -d /tmp/four_extract/assets/content ]; then
              cp -a /tmp/four_extract/assets/content/. assets/content/
            elif [ -d /tmp/four_extract/bee-plus-four/assets/content ]; then
              cp -a /tmp/four_extract/bee-plus-four/assets/content/. assets/content/
            elif [ -d /tmp/four_extract/content ]; then
              cp -a /tmp/four_extract/content/. assets/content/
            else
              find /tmp/four_extract -type f \( -name '*.json' -o -name '*.webp' -o -name '*.pdf' \) -exec cp -n {} assets/content/ \; || true
            fi
            echo "Content pack extracted OK"
          else
            echo "::warning::Drive pack not downloadable (set sharing to Anyone with the link)."
          fi

          test -f assets/content/unit_notes.json || echo '[]' > assets/content/unit_notes.json
          test -f assets/content/practice_questions.json || echo '[]' > assets/content/practice_questions.json
          test -f assets/content/illustrated_slides.json || echo '{}' > assets/content/illustrated_slides.json
          test -f assets/content/practice_index.json || echo '{"files":[],"lite":"practice_lite.json"}' > assets/content/practice_index.json
          test -f assets/content/exam_catalog.json || echo '{"matriculation":[],"model_exam_years":[]}' > assets/content/exam_catalog.json
          test -f assets/content/textbooks_catalog.json || echo '{"book_count":0,"books":[]}' > assets/content/textbooks_catalog.json

          echo "=== assets/content summary ==="
          find assets/content -type f | wc -l
          du -sh assets/content
          BYTES=$(du -sb assets/content | cut -f1)
          if [ "$BYTES" -lt 50000 ]; then
            echo "::error::Content pack too small ($BYTES bytes)."
            exit 1
          fi
          echo "Content size OK: $BYTES bytes"

      - name: Generate branded icons
        run: |
          python3 << 'PY'
          try:
              from PIL import Image, ImageDraw, ImageFont
          except ImportError:
              import subprocess, sys
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-q', 'pillow'])
              from PIL import Image, ImageDraw, ImageFont
          import os

          def make_icon(path, label, bg=(13, 148, 136), size=192):
              img = Image.new('RGB', (size, size), bg)
              d = ImageDraw.Draw(img)
              r = size // 6
              d.rounded_rectangle([0, 0, size-1, size-1], radius=r, fill=bg)
              try:
                  font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', size // 3)
              except Exception:
                  font = ImageFont.load_default()
              bbox = d.textbbox((0, 0), label, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              d.text(((size - tw) / 2, (size - th) / 2 - 4), label, fill=(255, 255, 255), font=font)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              img.save(path, 'PNG')

          base = 'android/app/src/main/res'
          for dens, s in [('mipmap-mdpi', 48), ('mipmap-hdpi', 72), ('mipmap-xhdpi', 96),
                          ('mipmap-xxhdpi', 144), ('mipmap-xxxhdpi', 192)]:
              make_icon(f'{base}/{dens}/ic_launcher.png', '4', size=s)
          print('icons ok')
          PY

      - name: Pub get
        run: flutter pub get

      - name: Build student APK (4)
        run: |
          flutter build apk --release --flavor student --target lib/main.dart \
            --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Build seller APK (Bee Seller)
        run: |
          flutter build apk --release --flavor seller --target lib/seller_main.dart \
            --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Build master APK (Shamm Master)
        run: |
          flutter build apk --release --flavor master --target lib/master_main.dart \
            --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-student-release.apk dist/4-student.apk || true
          cp build/app/outputs/flutter-apk/app-seller-release.apk dist/Bee-Seller.apk || true
          cp build/app/outputs/flutter-apk/app-master-release.apk dist/Shamm-Master.apk || true
          ls -lh dist/ || true
          ls -lh build/app/outputs/flutter-apk/ || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: four-three-apks
          path: |
            dist/
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
