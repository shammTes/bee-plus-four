name: Build 4 APKs (student / seller / master)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Overlay full ready source from Drive
        run: |
          set -e
          pip install -q gdown
          READY_ID="1lQ4tpfxGmJ88M8BxQPBxFORDmK1d-jjg"
          echo "Downloading ready source $READY_ID …"
          gdown --fuzzy "https://drive.google.com/file/d/${READY_ID}/view" -O /tmp/ready.tgz || \
          gdown "https://drive.google.com/uc?id=${READY_ID}" -O /tmp/ready.tgz
          if [ -f /tmp/ready.tgz ] && gzip -t /tmp/ready.tgz 2>/dev/null; then
            mkdir -p /tmp/ready_extract
            tar xzf /tmp/ready.tgz -C /tmp/ready_extract
            # Merge into workspace root
            if [ -d /tmp/ready_extract/lib ]; then
              cp -a /tmp/ready_extract/. .
            else
              # tarball may contain top-level lib pubspec android assets
              cp -a /tmp/ready_extract/* . 2>/dev/null || true
            fi
            echo "Ready source overlaid"
            ls -la lib/seller_main.dart pubspec.yaml assets/content/ | head -20
          else
            echo "::warning::Ready tarball not downloaded; using repo checkout only"
          fi

      - name: Download notes + practice packs from Drive
        run: |
          set -e
          mkdir -p assets/content
          pip install -q gdown
          # unit_notes_rich
          gdown --fuzzy "https://drive.google.com/file/d/1gv_l5Vay2WWt-NybgA8bb3DwPseMAu0q/view" -O assets/content/unit_notes_rich.json || true
          # flat notes
          gdown --fuzzy "https://drive.google.com/file/d/1-lrX7DJp7vMjtEac74F9lJ-bWkKFQA_9/view" -O assets/content/unit_notes.json || true
          # note MCQs
          gdown --fuzzy "https://drive.google.com/file/d/1Le6xHfpnvpRJ7oGiF70_SFzTkIWTJZSY/view" -O assets/content/practice_from_notes.json || true
          # legacy content pack (optional)
          PACK_ID="1Pp6n2ENxbvgNQMV_u0n8hDFhXKhJfMQG"
          gdown --fuzzy "https://drive.google.com/file/d/${PACK_ID}/view" -O /tmp/four_content.tgz || true
          if [ -f /tmp/four_content.tgz ] && gzip -t /tmp/four_content.tgz 2>/dev/null; then
            mkdir -p /tmp/four_extract
            tar xzf /tmp/four_content.tgz -C /tmp/four_extract
            if [ -d /tmp/four_extract/assets/content ]; then
              cp -an /tmp/four_extract/assets/content/. assets/content/ || true
            fi
          fi
          # Safety defaults
          test -f assets/content/unit_notes.json || echo '[]' > assets/content/unit_notes.json
          test -f assets/content/practice_index.json || echo '{"files":["practice_from_notes.json","practice_questions.json"],"lite":"practice_lite.json"}' > assets/content/practice_index.json
          test -f assets/content/practice_questions.json || echo '[]' > assets/content/practice_questions.json
          test -f assets/content/exam_catalog.json || echo '{"matriculation":[],"model_exam_years":[]}' > assets/content/exam_catalog.json
          echo "=== content summary ==="
          find assets/content -type f | wc -l
          du -sh assets/content
          ls -lh assets/content/unit_notes*.json assets/content/practice_from_notes.json 2>/dev/null || true

      - name: Generate icons
        run: |
          python3 << 'PY'
          try:
              from PIL import Image, ImageDraw, ImageFont
          except ImportError:
              import subprocess, sys
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-q', 'pillow'])
              from PIL import Image, ImageDraw, ImageFont
          import os
          def make_icon(path, label, bg=(13, 148, 136), size=192):
              img = Image.new('RGB', (size, size), bg)
              d = ImageDraw.Draw(img)
              try:
                  font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', size // 3)
              except Exception:
                  font = ImageFont.load_default()
              bbox = d.textbbox((0, 0), label, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              d.text(((size - tw) / 2, (size - th) / 2 - 4), label, fill=(255, 255, 255), font=font)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              img.save(path, 'PNG')
          base = 'android/app/src/main/res'
          for dens, s in [('mipmap-mdpi', 48), ('mipmap-hdpi', 72), ('mipmap-xhdpi', 96),
                          ('mipmap-xxhdpi', 144), ('mipmap-xxxhdpi', 192)]:
              make_icon(f'{base}/{dens}/ic_launcher.png', '4', size=s)
          print('icons ok')
          PY

      - name: Pub get
        run: flutter pub get

      - name: Build student APK
        run: |
          flutter build apk --release --flavor student --target lib/main.dart \
            --no-tree-shake-icons --android-skip-build-dependency-validation || \
          flutter build apk --release --target lib/main.dart --no-tree-shake-icons

      - name: Build seller APK
        run: |
          flutter build apk --release --flavor seller --target lib/seller_main.dart \
            --no-tree-shake-icons --android-skip-build-dependency-validation || true

      - name: Build master APK
        run: |
          flutter build apk --release --flavor master --target lib/master_main.dart \
            --no-tree-shake-icons --android-skip-build-dependency-validation || true

      - name: Collect APKs
        run: |
          mkdir -p dist
          find build/app/outputs/flutter-apk -name '*.apk' -exec cp -v {} dist/ \; || true
          ls -lh dist/ build/app/outputs/flutter-apk/ || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: four-three-apks
          path: |
            dist/
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
