name: Build 4 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Download full content pack (notes, practice, matric, illustrated)
        run: |
          set -e
          mkdir -p assets/content
          # Full app/content snapshot (includes assets/content JSON packs)
          curl -L --fail -o /tmp/four_content.tgz \
            "https://drive.google.com/uc?export=download&id=1H3BNzAlp0rXS3IwgaMJLbgmq3T_7VN3d" || true
          if file /tmp/four_content.tgz | grep -qi 'gzip\|tar'; then
            mkdir -p /tmp/four_extract
            tar xzf /tmp/four_content.tgz -C /tmp/four_extract || true
            # Merge any assets/content found into project
            if [ -d /tmp/four_extract/bee-plus-four/assets/content ]; then
              cp -a /tmp/four_extract/bee-plus-four/assets/content/. assets/content/
            elif [ -d /tmp/four_extract/assets/content ]; then
              cp -a /tmp/four_extract/assets/content/. assets/content/
            elif [ -d /tmp/four_extract/content ]; then
              cp -a /tmp/four_extract/content/. assets/content/
            fi
            echo "Content pack merged"
          else
            echo "Drive pack not a tar (may need confirm link); using repo assets only"
          fi
          # Illustrated release as fallback
          curl -L --fail -o /tmp/illustrated.tgz \
            "https://drive.google.com/uc?export=download&id=1zhFgJmQNDVhhtlo2oX6RBdqdPtBU7xM0" || true
          if file /tmp/illustrated.tgz | grep -qi 'gzip\|tar'; then
            mkdir -p /tmp/ill
            tar xzf /tmp/illustrated.tgz -C /tmp/ill || true
            if [ -d /tmp/ill/assets/content ]; then cp -a /tmp/ill/assets/content/. assets/content/; fi
            if [ -d /tmp/ill/content ]; then cp -a /tmp/ill/content/. assets/content/; fi
          fi
          # Placeholders so pubspec never breaks
          test -f assets/content/unit_notes.json || echo '[]' > assets/content/unit_notes.json
          test -f assets/content/practice_questions.json || echo '[]' > assets/content/practice_questions.json
          test -f assets/content/illustrated_slides.json || echo '{}' > assets/content/illustrated_slides.json
          test -f assets/content/practice_index.json || echo '{"files":[]}' > assets/content/practice_index.json
          test -f assets/content/exam_catalog.json || echo '{"matriculation":[],"model_exam_years":[]}' > assets/content/exam_catalog.json
          echo "=== assets/content listing ==="
          find assets/content -type f | head -80
          du -sh assets/content

      - name: Generate icons
        run: |
          python3 << 'PY'
          import struct, zlib, os
          def png(w, h, rgb=(13, 148, 136)):
              def chunk(t, d):
                  return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              raw = b''.join(b'\x00' + bytes(rgb) * w for _ in range(h))
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
          base = 'android/app/src/main/res'
          for dens, s in [('mipmap-mdpi', 48), ('mipmap-hdpi', 72), ('mipmap-xhdpi', 96), ('mipmap-xxhdpi', 144), ('mipmap-xxxhdpi', 192)]:
              d = f'{base}/{dens}'
              os.makedirs(d, exist_ok=True)
              open(f'{d}/ic_launcher.png', 'wb').write(png(s, s))
          print('icons ok')
          PY

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: four-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
