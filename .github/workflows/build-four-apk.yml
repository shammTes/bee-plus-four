name: Build 4 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Download full offline content pack v3
        run: |
          set -e
          mkdir -p assets/content/textbooks assets/content/illustrated assets/content/illustrated/g6_math_ch1_webp assets/content/illustrated_pdf
          pip install -q gdown
          PACK_ID="1QrhYo3cnzTfaGuoLNEEAjrSyRAu59sZm"
          echo "Downloading pack $PACK_ID"
          python3 -m gdown "https://drive.google.com/uc?id=${PACK_ID}" -O /tmp/four_content.tgz
          gzip -t /tmp/four_content.tgz
          mkdir -p /tmp/four_extract
          tar xzf /tmp/four_content.tgz -C /tmp/four_extract
          if [ -d /tmp/four_extract/assets/content ]; then
            cp -a /tmp/four_extract/assets/content/. assets/content/
          else
            echo "Pack structure unexpected" && find /tmp/four_extract | head -40 && exit 1
          fi
          BYTES=$(du -sb assets/content | cut -f1)
          echo "Content bytes: $BYTES"
          find assets/content -type f | wc -l
          if [ "$BYTES" -lt 50000000 ]; then
            echo "Content too thin ($BYTES). Share pack Anyone with the link."
            exit 1
          fi

      - name: Generate icons
        run: |
          python3 << 'PY'
          import struct, zlib, os
          def png(w, h, rgb=(13, 148, 136)):
              def chunk(t, d):
                  return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              raw = b''.join(b'\x00' + bytes(rgb) * w for _ in range(h))
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
          base = 'android/app/src/main/res'
          for dens, s in [('mipmap-mdpi', 48), ('mipmap-hdpi', 72), ('mipmap-xhdpi', 96), ('mipmap-xxhdpi', 144), ('mipmap-xxxhdpi', 192)]:
              d = f'{base}/{dens}'
              os.makedirs(d, exist_ok=True)
              open(f'{d}/ic_launcher.png', 'wb').write(png(s, s))
          print('icons ok')
          PY

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: four-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
