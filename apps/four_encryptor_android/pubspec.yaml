name: four_encryptor
description: "Encrypts PDFs, videos, reels and offline web pages into .4pdf/.4vid/.4reel/.4web for the 4 app (Android)."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  # native AES-GCM (javax.crypto, hardware AES on ARMv8) instead of pure Dart: ~10-30x faster on phones
  cryptography_flutter: ^2.3.4
  four_format:
    path: ../../packages/four_format

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
