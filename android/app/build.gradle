plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.four.student"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.four.student"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    flavorDimensions "app"
    productFlavors {
        student {
            dimension "app"
            applicationId "com.four.student"
            resValue "string", "app_name", "4"
        }
        seller {
            dimension "app"
            applicationId "com.bee.seller"
            resValue "string", "app_name", "Bee Seller"
        }
        master {
            dimension "app"
            applicationId "com.shamm.master"
            resValue "string", "app_name", "Shamm Master"
        }
    }

    buildTypes {
        release {
            // Debug signing for CI beta; turn off minify for reliable builds
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}
