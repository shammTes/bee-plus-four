<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" font-family="HighNunito"><rect x="30" y="40" width="280" height="46" rx="4" fill="#FFFFFF" stroke="#3E3129" stroke-width="1.2"/><rect x="30" y="40" width="78.4" height="46" fill="#9CC3E6"/><text x="69.2" y="60.4" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="800">Gravitational</text><text x="69.2" y="72.6" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="800">drains away</text><rect x="108.4" y="40" width="123.2" height="46" fill="#5B9BD5"/><text x="170" y="60.4" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="800">Available water</text><text x="170" y="72.6" font-size="10" text-anchor="middle" fill="#FFFFFF" font-weight="800">plants use it</text><rect x="231.6" y="40" width="78.4" height="46" fill="#C9B9A6"/><text x="270.8" y="60.4" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="800">Unavailable</text><text x="270.8" y="72.6" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="800">held too tightly</text><line x1="30" y1="30" x2="30" y2="96" stroke="#C24E32" stroke-width="1.8" stroke-linecap="round"/><text x="30" y="24" font-size="11" fill="#C24E32" font-weight="800">Saturation</text><line x1="108.4" y1="30" x2="108.4" y2="96" stroke="#C24E32" stroke-width="1.8" stroke-linecap="round"/><text x="108.4" y="110" font-size="11" text-anchor="middle" fill="#C24E32" font-weight="800">Field capacity</text><line x1="231.6" y1="30" x2="231.6" y2="96" stroke="#C24E32" stroke-width="1.8" stroke-linecap="round"/><text x="231.6" y="24" font-size="11" text-anchor="middle" fill="#C24E32" font-weight="800">Wilting point</text><line x1="310" y1="30" x2="310" y2="96" stroke="#C24E32" stroke-width="1.8" stroke-linecap="round"/><text x="310" y="110" font-size="11" text-anchor="end" fill="#C24E32" font-weight="800">Oven dry</text><line x1="310" y1="126" x2="30" y2="126" stroke="#8A7F76" stroke-width="1.6" stroke-linecap="round"/><path d="M30 126 L36.4 123.3 L36.4 128.7 Z" fill="#8A7F76" stroke="#8A7F76" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="170" y="142" font-size="11" text-anchor="middle" fill="#8A7F76" font-weight="600">more water in the soil  ←</text><text x="170" y="168" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="600">Saturation: every pore full of water</text><text x="170" y="186" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="600">Field capacity: after free water has drained (1–3 days)</text><text x="170" y="204" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="600">Wilting point: roots can no longer take water</text><text x="170" y="222" font-size="11" text-anchor="middle" fill="#2A7A6B" font-weight="800">Clay holds more water than sand at the same potential</text></svg>
