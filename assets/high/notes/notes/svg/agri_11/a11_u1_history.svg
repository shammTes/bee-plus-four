<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">From hunting to modern farming</text><g data-s="k1 k2 k3 k4 k5"><circle cx="30" cy="50" r="15" fill="#F1EEEA" stroke="#8A7F76" stroke-width="2"/><text x="30" y="55" font-size="14" text-anchor="middle" fill="#8A7F76" font-weight="800">1</text><rect x="54" y="32" width="276" height="38" rx="8" fill="#F1EEEA" stroke="#8A7F76" stroke-width="1.8"/><text x="192" y="55.2" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800"></text><text x="64" y="47" font-size="12.5" fill="#3E3129" font-weight="800">Hunting, fishing, gathering</text><text x="64" y="63" font-size="11" fill="#8A7F76" font-weight="600">people move with the food</text></g><g data-s="k2 k3 k4 k5"><circle cx="30" cy="103" r="15" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="2"/><text x="30" y="108" font-size="14" text-anchor="middle" fill="#2A7A6B" font-weight="800">2</text><rect x="54" y="85" width="276" height="38" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.8"/><text x="192" y="108.2" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800"></text><text x="64" y="100" font-size="12.5" fill="#3E3129" font-weight="800">Domestication</text><text x="64" y="116" font-size="11" fill="#8A7F76" font-weight="600">dog first, then goat; seeds sown</text><line x1="30" y1="65" x2="30" y2="88" stroke="#8A7F76" stroke-width="2" stroke-linecap="round"/></g><g data-s="k3 k4 k5"><circle cx="30" cy="156" r="15" fill="#FCEFD9" stroke="#B86E12" stroke-width="2"/><text x="30" y="161" font-size="14" text-anchor="middle" fill="#B86E12" font-weight="800">3</text><rect x="54" y="138" width="276" height="38" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.8"/><text x="192" y="161.2" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800"></text><text x="64" y="153" font-size="12.5" fill="#3E3129" font-weight="800">Settled farming</text><text x="64" y="169" font-size="11" fill="#8A7F76" font-weight="600">villages, storage of surplus</text><line x1="30" y1="118" x2="30" y2="141" stroke="#8A7F76" stroke-width="2" stroke-linecap="round"/></g><g data-s="k4 k5"><circle cx="30" cy="209" r="15" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="2"/><text x="30" y="214" font-size="14" text-anchor="middle" fill="#2F5F8F" font-weight="800">4</text><rect x="54" y="191" width="276" height="38" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.8"/><text x="192" y="214.2" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800"></text><text x="64" y="206" font-size="12.5" fill="#3E3129" font-weight="800">Improved farming</text><text x="64" y="222" font-size="11" fill="#8A7F76" font-weight="600">better seed, breeds, irrigation</text><line x1="30" y1="171" x2="30" y2="194" stroke="#8A7F76" stroke-width="2" stroke-linecap="round"/></g><g data-s="k5"><circle cx="30" cy="262" r="15" fill="#ECE6F5" stroke="#6A4C9C" stroke-width="2"/><text x="30" y="267" font-size="14" text-anchor="middle" fill="#6A4C9C" font-weight="800">5</text><rect x="54" y="244" width="276" height="38" rx="8" fill="#ECE6F5" stroke="#6A4C9C" stroke-width="1.8"/><text x="192" y="267.2" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800"></text><text x="64" y="259" font-size="12.5" fill="#3E3129" font-weight="800">Mechanisation + science</text><text x="64" y="275" font-size="11" fill="#8A7F76" font-weight="600">tractors, harvesters, information</text><line x1="30" y1="224" x2="30" y2="247" stroke="#8A7F76" stroke-width="2" stroke-linecap="round"/></g><text x="170" y="296" font-size="11.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">Eritrea: farming began about 4000 years ago</text></svg>
