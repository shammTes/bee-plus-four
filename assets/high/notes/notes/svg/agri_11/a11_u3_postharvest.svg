<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 158" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Post-harvest handling of fruit and vegetables</text><rect x="6" y="26" width="101.3" height="52" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.8"/><text x="56.7" y="42.9" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Harvest at the</text><text x="56.7" y="55.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">right stage,</text><text x="56.7" y="68.5" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">cool hours</text><rect x="119.3" y="26" width="101.3" height="52" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.8"/><text x="170" y="55.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Clean</text><line x1="108.3" y1="52" x2="118.3" y2="52" stroke="#3E3129" stroke-width="1.7" stroke-linecap="round"/><path d="M118.3 52 L112.8 54.3 L112.8 49.7 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="232.7" y="26" width="101.3" height="52" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.8"/><text x="283.3" y="49.3" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Sort: remove</text><text x="283.3" y="62.1" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">damaged</text><line x1="221.7" y1="52" x2="231.7" y2="52" stroke="#3E3129" stroke-width="1.7" stroke-linecap="round"/><path d="M231.7 52 L226.1 54.3 L226.1 49.7 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="232.7" y="100" width="101.3" height="52" rx="8" fill="#ECE6F5" stroke="#6A4C9C" stroke-width="1.8"/><text x="283.3" y="129.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Grade by size</text><line x1="283.3" y1="79" x2="283.3" y2="99" stroke="#3E312