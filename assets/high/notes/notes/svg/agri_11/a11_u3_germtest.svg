<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" font-family="HighNunito"><rect x="20" y="6" width="300" height="38" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.8"/><text x="170" y="22.1" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Count 100 seeds at random (do not pick out the</text><text x="170" y="35.6" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">bad ones)</text><rect x="20" y="56" width="300" height="38" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.8"/><text x="170" y="72.1" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Lay them on a damp paper towel, cover with a</text><text x="170" y="85.6" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">second towel</text><line x1="170" y1="45" x2="170" y2="54" stroke="#3E3129" stroke-width="1.8" stroke-linecap="round"/><path d="M170 54 L167.3 47.6 L172.7 47.6 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="20" y="106" width="300" height="38" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.8"/><text x="170" y="122.1" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Roll up, put in a closed plastic bag, keep at</text><text x="170" y="135.6" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">an even temperature</text><line x1="170" y1="95" x2="170" y2="104" stroke="#3E3129" stroke-width="1.8" stroke-linecap="round"/><path d="M170 104 L167.3 97.6 L172.7 97.6 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="20" y="156" width="300" height="38" rx="8" fill="#ECE6F5" stroke="#6A4C9C" stroke-width="1.8"/><text x="170" y="172.1" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">After the test period count seedlings with</text><text x="170" y="185.6" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">shoot &gt; 4 cm and a strong root</text><line x1="170" y1="145" x2="170" y2="154" stroke="#3E3129" stroke-width="1.8" stroke-linecap="round"/><path d="M170 154 L167.3 147.6 L172.7 147.6 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="20" y="206" width="300" height="38" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="170" y="228.8" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Germination % = germinated ÷ total × 100</text><line x1="170" y1="195" x2="170" y2="204" stroke="#3E3129" stroke-width="1.8" stroke-linecap="round"/><path d="M170 204 L167.3 197.6 L172.7 197.6 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></svg>
