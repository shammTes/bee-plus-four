<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 270" font-family="HighNunito"><text x="170" y="16" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">Safe moisture for storing grain (Table 3.9)</text><text x="70" y="45" font-size="11" text-anchor="end" fill="#3E3129" font-weight="800">Wheat</text><rect x="76" y="33" width="168" height="16" rx="3" fill="#D9B65F"/><text x="248" y="45" font-size="11" fill="#3E3129" font-weight="800">12 %</text><text x="70" y="71" font-size="11" text-anchor="end" fill="#3E3129" font-weight="800">Barley</text><rect x="76" y="59" width="182" height="16" rx="3" fill="#D9B65F"/><text x="262" y="71" font-size="11" fill="#3E3129" font-weight="800">13 %</text><text x="70" y="97" font-size="11" text-anchor="end" fill="#3E3129" font-weight="800">Sorghum</text><rect x="76" y="85" width="168" height="16" rx="3" fill="#D9B65F"/><text x="248" y="97" font-size="11" fill="#3E3129" font-weight="800">12 %</text><text x="70" y="123" font-size="11" text-anchor="end" fill="#3E3129" font-weight="800">Maize</text><rect x="76" y="111" width="182" height="16" rx="3" fill="#D9B65F"/><text x="262" y="123" font-size="11" fill="#3E3129" font-weight="800">13 %</text><text x="70" y="149" font-size="11" text-anchor="end" fill="#3E3129" font-weight="800">Soybean</text><rect x="76" y="137" width="154" height="16" rx="3" fill="#D9B65F"/><text x="234" y="149" font-size="11" fill="#3E3129" font-weight="800">11 %</text><text x="70" y="175" font-size="11" text-anchor="end" fill="#3E3129" font-weight="800">Rice</text><rect x="76" y="163" width="168" height="16" rx="3" fill="#D9B65F"/><text x="248" y="175" font-size="11" fill="#3E3129" font-weight="800">12 %</text><text x="170" y="200" font-size="9.5" text-anchor="middle" fill="#C24E32" font-weight="600">maximum moisture for safe storage; wetter grain moulds and heats</text><rect x="6" y="214" width="328" height="50" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.8"/><text x="170" y="236.3" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Store pests multiply fastest at 28–33 °C and 60–80 %</text><text x="170" y="249.1" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">relative humidity: keep grain dry, cool and sealed.</text></svg>
