<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 236" font-family="HighNunito"><text x="170" y="16" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Share of the farming population (Table 1.1)</text><text x="10" y="44" font-size="12" fill="#3E3129" font-weight="800">Nomadic pastoralism</text><rect x="10" y="51" width="300" height="20" rx="4" fill="#F7F3EE" stroke="#8A7F76" stroke-width="1"/><rect x="10" y="51" width="33" height="20" rx="4" fill="#B86E12"/><text x="49" y="66" font-size="13" fill="#3E3129" font-weight="800">11%</text><text x="10" y="86" font-size="11" fill="#8A7F76" font-weight="600">whole family moves with the herd</text><text x="10" y="108" font-size="12" fill="#3E3129" font-weight="800">Semi-nomadic pastoralism</text><rect x="10" y="115" width="300" height="20" rx="4" fill="#F7F3EE" stroke="#8A7F76" stroke-width="1"/><rect x="10" y="115" width="66" height="20" rx="4" fill="#2F5F8F"/><text x="82" y="130" font-size="13" fill="#3E3129" font-weight="800">22%</text><text x="10" y="150" font-size="11" fill="#8A7F76" font-weight="600">village base + seasonal grazing</text><text x="10" y="172" font-size="12" fill="#3E3129" font-weight="800">Sedentary agro-pastoralism</text><rect x="10" y="179" width="300" height="20" rx="4" fill="#F7F3EE" stroke="#8A7F76" stroke-width="1"/><rect x="10" y="179" width="201" height="20" rx="4" fill="#2A7A6B"/><text x="217" y="194" font-size="13" fill="#3E3129" font-weight="800">67%</text><text x="10" y="214" font-size="11" fill="#8A7F76" font-weight="600">permanent village, crops + animals</text><text x="170" y="230" font-size="11" text-anchor="middle" fill="#2A7A6B" font-weight="800">Smallholders farm about 95% of the cultivated land</text></svg>
