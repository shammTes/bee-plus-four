<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" font-family="HighNunito"><text x="170" y="16" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">How Eritrea's land is covered (Table 2.14)</text><text x="118" y="46" font-size="11" text-anchor="end" fill="#3E3129" font-weight="800">Bush land</text><rect x="124" y="35" width="179.3" height="16" rx="3" fill="#B5A06A"/><text x="307.3" y="47" font-size="11" fill="#3E3129" font-weight="800">42.7%</text><text x="118" y="73" font-size="11" text-anchor="end" fill="#3E3129" font-weight="800">Wooded grassland</text><rect x="124" y="62" width="85.3" height="16" rx="3" fill="#9CCB7A"/><text x="213.3" y="74" font-size="11" fill="#3E3129" font-weight="800">20.3%</text><text x="118" y="100" font-size="11" text-anchor="end" fill="#3E3129" font-weight="800">Barren land</text><rect x="124" y="89" width="60.5" height="16" rx="3" fill="#A39C93"/><text x="188.5" y="101" font-size="11" fill="#3E3129" font-weight="800">14.4%</text><text x="118" y="127" font-size="11" text-anchor="end" fill="#3E3129" font-weight="800">Open woodland</text><rect x="124" y="116" width="31.9" height="16" rx="3" fill="#6FAF6A"/><text x="159.9" y="128" font-size="11" fill="#3E3129" font-weight="800">7.6%</text><text x="118" y="154" font-size="11" text-anchor="end" fill="#3E3129" font-weight="800">Cultivated land</text><rect x="124" y="143" width="28.6" height="16" rx="3" fill="#B86E12"/><text x="156.6" y="155" font-size="11" fill="#3E3129" font-weight="800">6.8%</text><text x="118" y="181" font-size="11" text-anchor="end" fill="#3E3129" font-weight="800">Closed woodland</text><rect x="124" y="170" width="15.1" height="16" rx="3" fill="#3E8E6E"/><text x="143.1" y="182" font-size="11" fill="#3E3129" font-weight="800">3.6%</text><text x="118" y="208" font-size="11" text-anchor="end" fill="#3E3129" font-weight="800">All forests</text><rect x="124" y="197" width="10.1" height="16" rx="3" fill="#2A6A4A"/><text x="138.1" y="209" font-size="11" fill="#3E3129" font-weight="800">2.4%</text><text x="170" y="226" font-size="11" text-anchor="middle" fill="#B86E12" font-weight="800">Only about 7% of the land is cultivated</text></svg>
