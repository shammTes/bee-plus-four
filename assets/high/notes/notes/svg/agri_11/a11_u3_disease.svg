<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" font-family="HighNunito"><path d="M170 30 L40 220 L300 220 Z" fill="#EAF2DF" stroke="#2A7A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="170" y="141.1" font-size="12.5" text-anchor="middle" fill="#C24E32" font-weight="800">DISEASE</text><text x="170" y="156.4" font-size="12.5" text-anchor="middle" fill="#C24E32" font-weight="800">only where</text><text x="170" y="171.6" font-size="12.5" text-anchor="middle" fill="#C24E32" font-weight="800">all three meet</text><rect x="110" y="6" width="120" height="34" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="170" y="20.3" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Pathogen (fungus,</text><text x="170" y="33.1" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">bacterium, virus)</text><rect x="4" y="208" width="130" height="40" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.8"/><text x="69" y="225.3" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Susceptible host</text><text x="69" y="238.1" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">plant</text><rect x="196" y="208" width="140" height="40" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.8"/><text x="266" y="225.3" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Favourable environment</text><text x="266" y="238.1" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">(e.g. warm, humid)</text><text x="70" y="116" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">clean seed,</text><text x="70" y="129" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">rotation</text><text x="272" y="116" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">sowing date,</text><text x="272" y="129" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">drainage</text><text x="170" y="202" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">resistant variety</text></svg>
