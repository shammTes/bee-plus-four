<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" font-family="HighNunito"><text x="170" y="16" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Shield (T) budding, step by step</text><g data-s="k1 k2 k3 k4"><rect x="35" y="40" width="18" height="120" rx="6" fill="#B98A5E" stroke="#6B4A2B" stroke-width="1.4"/><line x1="44" y1="72" x2="44" y2="106" stroke="#3E3129" stroke-width="1.8" stroke-linecap="round"/><line x1="38" y1="72" x2="50" y2="72" stroke="#3E3129" stroke-width="1.8" stroke-linecap="round"/></g><text x="44" y="182.1" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">1 Cut a T in</text><text x="44" y="193.6" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">the stock bark:</text><text x="44" y="205.1" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">3–4 cm down,</text><text x="44" y="216.6" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">1–2 cm across</text><g data-s="k2 k3 k4"><rect x="122" y="36" width="12" height="128" rx="5" fill="#B98A5E" stroke="#6B4A2B" stroke-width="1.4"/><path d="M134 76 C142 86 142 104 134 114" fill="#C9DBA4" stroke="#3E3129" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M134 92 L140 88 L138 96Z" fill="#4E8B3A" stroke="#3B6E2C" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><line x1="144" y1="96" x2="162" y2="96" stroke="#8A7F76" stroke-width="1.4" stroke-linecap="round"/><path d="M162 96 L156.5 98.3 L156.5 93.7 Z" fill="#8A7F76" stroke="#8A7F76" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g><text x="128" y="187.8" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">2 Slice a bud</text><text x="128" y="199.3" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">shield from the</text><text x="128" y="210.8" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">scion wood</text><g data-s="k3 k4"><rect x="203" y="40" width="18" height="120" rx="6" fill="#B98A5E" stroke="#6B4A2B" stroke-width="1.4"/><path d="M212 72 L204 82 L204 106 L212 106Z M212 72 L220 82 L220 106 L212 106Z" fill="#D9B88E" stroke="#6B4A2B" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M208 80 L216 80 L216 104 L208 104Z" fill="#C9DBA4" stroke="#3B6E2C" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="212" cy="90" r="2.4" fill="#3B6E2C"/><line x1="206" y1="72" x2="218" y2="72" stroke="#3E3129" stroke-width="1.6" stroke-linecap="round"/></g><text x="212" y="187.8" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">3 Lift the bark</text><text x="212" y="199.3" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">flaps and slide</text><text x="212" y="210.8" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">the shield in</text><g data-s="k4"><rect x="287" y="40" width="18" height="120" rx="6" fill="#B98A5E" stroke="#6B4A2B" stroke-width="1.4"/><line x1="286" y1="70" x2="306" y2="73" stroke="#3E8E5E" stroke-width="2.4" stroke-linecap="round"/><line x1="286" y1="76" x2="306" y2="79" stroke="#3E8E5E" stroke-width="2.4" stroke-linecap="round"/><line x1="286" y1="82" x2="306" y2="85" stroke="#3E8E5E" stroke-width="2.4" stroke-linecap="round"/><line x1="286" y1="100" x2="306" y2="103" stroke="#3E8E5E" stroke-width="2.4" stroke-linecap="round"/><line x1="286" y1="106" x2="306" y2="109" stroke="#3E8E5E" stroke-width="2.4" stroke-linecap="round"/><circle cx="296" cy="90" r="3" fill="#3B6E2C"/><path d="M296 90 Q302.3 91 305.2 82.3 Q296.1 83.6 296 90Z" fill="#4E8B3A" stroke="#3B6E2C" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/></g><text x="296" y="187.8" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">4 Wrap with</text><text x="296" y="199.3" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">tape, bud left</text><text x="296" y="210.8" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">uncovered</text><text x="170" y="228" font-size="10" text-anchor="middle" fill="#2A7A6B" font-weight="800">Used for citrus and many tropical fruit trees</text></svg>
