<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" font-family="HighNunito"><text x="170" y="16" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">Double digging: the bed is loosened 45–60 cm deep</text><rect x="0" y="50" width="340" height="160" fill="#7D5233"/><rect x="0" y="50" width="340" height="50" fill="#B98A5E"/><line x1="0" y1="50" x2="340" y2="50" stroke="#5A3A20" stroke-width="1.6" stroke-linecap="round"/><rect x="20" y="50" width="70" height="100" fill="#C9A27A"/><text x="55" y="97.5" font-size="9.5" text-anchor="middle" fill="#FFFFFF" font-weight="800">finished:</text><text x="55" y="109.1" font-size="9.5" text-anchor="middle" fill="#FFFFFF" font-weight="800">loose, manured</text><rect x="96" y="50" width="70" height="100" fill="#FFFFFF"/><rect x="96" y="100" width="70" height="50" fill="#C9A27A"/><path d="M102 110 l4 -6 l4 6" fill="none" stroke="#5A3A20" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M113 110 l4 -6 l4 6" fill="none" stroke="#5A3A20" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M124 110 l4 -6 l4 6" fill="none" stroke="#5A3A20" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M135 110 l4 -6 l4 6" fill="none" stroke="#5A3A20" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M146 110 l4 -6 l4 6" fill="none" stroke="#5A3A20" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M157 110 l4 -6 l4 6" fill="none" stroke="#5A3A20" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="96" y="94" width="70" height="6" fill="#6E4B2A"/><text x="131" y="67.4" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="800">open</text><text x="131" y="79.6" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="800">trench</text><path d="M225 70 Q182.5 52 140 70" fill="none" stroke="#3E3129" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M140 70 L144.9 65 L147 70 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="232" y="76" font-size="9.5" fill="#3E3129" font-weight="600">next topsoil</text><line x1="131" y1="97" x2="96" y2="168" stroke="#8A7F76" stroke-width="1.2" stroke-linecap="round"/><text x="96" y="171.3" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="800">manure/compost on subsoil</text><line x1="160" y1="130" x2="250" y2="168" stroke="#8A7F76" stroke-width="1.2" stroke-linecap="round"/><text x="250" y="171.3" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="800">subsoil loosened 15–30 cm</text><line x1="334" y1="50" x2="334" y2="100" stroke="#3E3129" stroke-width="1" stroke-linecap="round"/><text x="330" y="80" font-size="9" text-anchor="end" fill="#FFFFFF" font-weight="600">28–30 cm</text><text x="170" y="190" font-size="9.5" text-anchor="middle" fill="#FFFFFF" font-weight="800">Topsoil of trench 1 fills the last trench.</text><text x="170" y="204" font-size="9.5" text-anchor="middle" fill="#FFFFFF" font-weight="800">Repeat every 2–4 years (medium and clay soils).</text></svg>
