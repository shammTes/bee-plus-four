<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" font-family="HighNunito"><text x="170" y="16" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Soil lost to erosion (tons per hectare per year)</text><text x="118" y="52" font-size="11.5" text-anchor="end" fill="#3E3129" font-weight="800">Highlands</text><rect x="124" y="39" width="90" height="20" fill="#C24E32"/><rect x="214" y="39" width="90" height="20" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.2" stroke-dasharray="6 4"/><text x="210" y="54" font-size="12" text-anchor="end" fill="#FFFFFF" font-weight="800">50–100</text><text x="118" y="96" font-size="11.5" text-anchor="end" fill="#3E3129" font-weight="800">Moist lowlands</text><rect x="124" y="83" width="84.6" height="20" fill="#B86E12"/><text x="212.6" y="98" font-size="12" fill="#3E3129" font-weight="800">47</text><text x="118" y="140" font-size="11.5" text-anchor="end" fill="#3E3129" font-weight="800">Eastern escarpment</text><rect x="124" y="127" width="66.6" height="20" fill="#B86E12"/><text x="194.6" y="142" font-size="12" fill="#3E3129" font-weight="800">37</text><text x="118" y="184" font-size="11.5" text-anchor="end" fill="#3E3129" font-weight="800">Dry lowlands</text><rect x="124" y="171" width="10.8" height="20" fill="#2A7A6B"/><text x="138.8" y="186" font-size="12" fill="#3E3129" font-weight="800">6</text><text x="170" y="212" font-size="11" text-anchor="middle" fill="#8A7F76" font-weight="600">Steep slopes + heavy storms + bare soil = the highest losses</text></svg>
