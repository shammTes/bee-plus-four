<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 270" font-family="HighNunito"><text x="170" y="16" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">The 16 essential elements and where plants get them</text><rect x="6" y="30" width="160" height="52" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.8"/><text x="86" y="53.1" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">From AIR: carbon (C),</text><text x="86" y="66.6" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">oxygen (O)</text><rect x="174" y="30" width="160" height="52" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.8"/><text x="254" y="53.1" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">From WATER: hydrogen</text><text x="254" y="66.6" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">(H), oxygen (O)</text><rect x="6" y="92" width="328" height="172" rx="8" fill="#F6EEE3" stroke="#7A4E2D" stroke-width="1.6"/><text x="170" y="110" font-size="12" text-anchor="middle" fill="#7A4E2D" font-weight="800">From the SOIL (13 mineral elements)</text><rect x="14" y="120" width="150" height="56" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="89" y="138.4" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Primary: N, P, K</text><text x="89" y="151.8" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">(needed most; in</text><text x="89" y="165.3" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">fertiliser)</text><rect x="176" y="120" width="150" height="56" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.8"/><text x="251" y="151.8" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Secondary: Ca, Mg, S</text><rect x="14" y="186" width="312" height="50" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.8"/><text x="170" y="214.8" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Micronutrients (trace): Fe, Mn, Zn, Cu, B, Mo, Cl</text><text x="170" y="254" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Macro = C, H, O + N, P, K + Ca, Mg, S (9)   Micro = 7</text></svg>
