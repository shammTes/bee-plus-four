<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 170" font-family="HighNunito"><circle cx="44" cy="48" r="20" fill="#E8CF96" stroke="#3E3129" stroke-width="1.2"/><text x="96" y="42" font-size="13" fill="#3E3129" font-weight="800">Sand</text><text x="96" y="58" font-size="11" fill="#8A7F76" font-weight="600">0.05–2 mm</text><text x="190" y="45.3" font-size="10.5" fill="#3E3129" font-weight="600">gritty; drains fast;</text><text x="190" y="58.1" font-size="10.5" fill="#3E3129" font-weight="600">holds little</text><circle cx="44" cy="92" r="12" fill="#E6DCC4" stroke="#3E3129" stroke-width="1.2"/><text x="96" y="86" font-size="13" fill="#3E3129" font-weight="800">Silt</text><text x="96" y="102" font-size="11" fill="#8A7F76" font-weight="600">0.002–0.05 mm</text><text x="190" y="95.7" font-size="10.5" fill="#3E3129" font-weight="600">smooth like flour</text><circle cx="44" cy="136" r="2.5" fill="#B58D6B" stroke="#3E3129" stroke-width="1.2"/><text x="96" y="130" font-size="13" fill="#3E3129" font-weight="800">Clay</text><text x="96" y="146" font-size="11" fill="#8A7F76" font-weight="600">&lt; 0.002 mm</text><text x="190" y="133.3" font-size="10.5" fill="#3E3129" font-weight="600">sticky; holds water</text><text x="190" y="146.1" font-size="10.5" fill="#3E3129" font-weight="600">and nutrients</text><text x="170" y="18" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">Particle sizes of the soil separates (Table 2.4)</text><text x="170" y="166" font-size="10.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">If a clay particle were a grain of teff, sand would be a football</text></svg>
