<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 158" font-family="sans-serif">
<text x="170" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25">London (dispersion) forces between two non-polar atoms</text>
<text x="100" y="112" text-anchor="middle" font-size="10" fill="#55665f">atom 1</text><text x="240" y="112" text-anchor="middle" font-size="10" fill="#55665f">atom 2</text>
<g data-s="a"><path d="M66 70 a34 24 0 1 0 68 0 a34 24 0 1 0 -68 0" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1.4"/><circle cx="100" cy="70" r="6" fill="#c0392b"/><text x="100" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">+</text>
<path d="M206 70 a34 24 0 1 0 68 0 a34 24 0 1 0 -68 0" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1.4"/><circle cx="240" cy="70" r="6" fill="#c0392b"/><text x="240" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">+</text>
<text x="170" y="136" text-anchor="middle" font-size="10" fill="#55665f">electrons spread evenly: no dipole</text></g>
<g data-s="b"><path d="M56 70 a34 24 0 1 0 68 0 a34 24 0 1 0 -68 0" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1.4"/><circle cx="100" cy="70" r="6" fill="#c0392b"/><text x="100" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">+</text><text x="70" y="42" text-anchor="middle" font-size="12" fill="#2f6fa5">δ−</text><text x="130" y="42" text-anchor="middle" font-size="12" fill="#c0392b">δ+</text>
<path d="M206 70 a34 24 0 1 0 68 0 a34 24 0 1 0 -68 0" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1.4"/><circle cx="240" cy="70" r="6" fill="#c0392b"/><text x="240" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">+</text>
<text x="170" y="136" text-anchor="middle" font-size="10" fill="#55665f">for an instant atom 1’s electrons crowd to one side</text>
<text x="170" y="150" text-anchor="middle" font-size="10" fill="#55665f">→ temporary (instantaneous) dipole</text></g>
<g data-s="c"><path d="M56 70 a34 24 0 1 0 68 0 a34 24 0 1 0 -68 0" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1.4"/><circle cx="100" cy="70" r="6" fill="#c0392b"/><text x="100" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">+</text><text x="70" y="42" text-anchor="middle" font-size="12" fill="#2f6fa5">δ−</text><text x="130" y="42" text-anchor="middle" font-size="12" fill="#c0392b">δ+</text>
<path d="M196 70 a34 24 0 1 0 68 0 a34 24 0 1 0 -68 0" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1.4"/><circle cx="240" cy="70" r="6" fill="#c0392b"/><text x="240" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">+</text><text x="210" y="42" text-anchor="middle" font-size="12" fill="#2f6fa5">δ−</text><text x="270" y="42" text-anchor="middle" font-size="12" fill="#c0392b">δ+</text>
<line x1="140" y1="60" x2="200" y2="60" stroke="#e67e22" stroke-width="2" stroke-dasharray="5 3"/>
<text x="170" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67e22">attraction</text>
<text x="170" y="136" text-anchor="middle" font-size="10" fill="#55665f">atom 1 induces a dipole in atom 2: δ+ attracts δ−</text>
<text x="170" y="150" text-anchor="middle" font-size="10" fill="#55665f">weak, short-lived, but always present</text></g>
</svg>
