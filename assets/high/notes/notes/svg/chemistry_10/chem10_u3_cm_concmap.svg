<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 234" font-family="sans-serif">
<text x="180" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25">Concentration map: every unit goes through moles</text>
<g data-hl="n"><rect x="10" y="40" width="108" height="42" rx="8" fill="#fff4d6" stroke="#7a8a84" stroke-width="1.2"/>
<text x="64" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">mass of solute</text>
<text x="64" y="72" text-anchor="middle" font-size="9" fill="#55665f">grams (g)</text></g>
<g data-hl="n"><rect x="140" y="40" width="90" height="42" rx="8" fill="#dff0e4" stroke="#7a8a84" stroke-width="1.2"/>
<text x="185" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">moles, n</text>
<text x="185" y="72" text-anchor="middle" font-size="9" fill="#55665f">mol</text></g>
<line x1="118" y1="61" x2="133.8" y2="61" stroke="#1b2b25" stroke-width="1.4"/><polygon points="138,61 132.5,63.4 132.5,58.6" fill="#1b2b25"/><text x="64" y="96" text-anchor="middle" font-size="9" fill="#55665f">÷ molar mass → moles</text>
<g data-hl="M"><rect x="250" y="30" width="104" height="42" rx="8" fill="#e3f1f8" stroke="#7a8a84" stroke-width="1.2"/>
<text x="302" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Molarity M</text>
<text x="302" y="62" text-anchor="middle" font-size="9" fill="#55665f">n ÷ V solution (L)</text></g>
<line x1="230" y1="56" x2="243.9" y2="52.9" stroke="#1b2b25" stroke-width="1.4"/><polygon points="248,52 243.2,55.6 242.1,50.8" fill="#1b2b25"/>
<g data-hl="N"><rect x="250" y="98" width="104" height="42" rx="8" fill="#fde6df" stroke="#7a8a84" stroke-width="1.2"/>
<text x="302" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Normality N</text>
<text x="302" y="130" text-anchor="middle" font-size="9" fill="#55665f">M × n-factor</text></g>
<line x1="302" y1="72" x2="302" y2="91.8" stroke="#1b2b25" stroke-width="1.4"/><polygon points="302,96 299.6,90.5 304.4,90.5" fill="#1b2b25"/><text x="296" y="88" text-anchor="end" font-size="9" fill="#55665f">× n</text>
<g data-hl="m"><rect x="250" y="166" width="104" height="42" rx="8" fill="#efe4f7" stroke="#7a8a84" stroke-width="1.2"/>
<text x="302" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Molality m</text>
<text x="302" y="198" text-anchor="middle" font-size="9" fill="#55665f">n ÷ kg of solvent</text></g>
<line x1="196" y1="82" x2="246" y2="174.3" stroke="#1b2b25" stroke-width="1.4"/><polygon points="248,178 243.2,174.3 247.5,172" fill="#1b2b25"/>
<g data-hl="p"><rect x="10" y="166" width="140" height="42" rx="8" fill="#f3f3f3" stroke="#7a8a84" stroke-width="1.2"/>
<text x="80" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">mass % / volume %</text>
<text x="80" y="198" text-anchor="middle" font-size="9" fill="#55665f">part ÷ whole × 100</text></g>
<g data-hl="M m p"><rect x="10" y="112" width="176" height="40" rx="6" fill="#ffffff" stroke="#c98a14" stroke-width="1"/>
<text x="98" y="128" text-anchor="middle" font-size="9.5" fill="#7a4b12">bridge: solution mass =</text>
<text x="98" y="142" text-anchor="middle" font-size="9.5" fill="#7a4b12">density × volume</text></g>
<text x="180" y="226" text-anchor="middle" font-size="10" fill="#7a4b12">solvent mass = solution mass − solute mass</text>
</svg>
