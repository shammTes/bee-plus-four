<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" font-family="sans-serif">
<text x="170" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25">Universal indicator colours (textbook Table 4.7)</text>
<rect x="10" y="30" width="64" height="34" fill="#d7263d"/><text x="42" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">1–4</text>
<rect x="74" y="30" width="36" height="34" fill="#f28c28"/><text x="92" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">5</text>
<rect x="110" y="30" width="36" height="34" fill="#f4d03f"/><text x="128" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">6</text>
<rect x="146" y="30" width="36" height="34" fill="#3fa34d"/><text x="164" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">7</text>
<rect x="182" y="30" width="36" height="34" fill="#2a9d8f"/><text x="200" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">8</text>
<rect x="218" y="30" width="36" height="34" fill="#2e6fd8"/><text x="236" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">9</text>
<rect x="254" y="30" width="36" height="34" fill="#5b4bb7"/><text x="272" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">10</text>
<rect x="290" y="30" width="40" height="34" fill="#7b2d8e"/><text x="310" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">11–14</text>
<g data-hl="col"><text x="42" y="78" text-anchor="middle" font-size="8.5" fill="#55665f">red</text>
<text x="92" y="78" text-anchor="middle" font-size="8.5" fill="#55665f">orange</text>
<text x="128" y="78" text-anchor="middle" font-size="8.5" fill="#55665f">yellow</text>
<text x="164" y="78" text-anchor="middle" font-size="8.5" fill="#2f6f4e">green</text>
<text x="200" y="78" text-anchor="middle" font-size="8.5" fill="#55665f">b-green</text>
<text x="236" y="78" text-anchor="middle" font-size="8.5" fill="#55665f">blue</text>
<text x="272" y="78" text-anchor="middle" font-size="8.5" fill="#55665f">b-purple</text>
<text x="310" y="78" text-anchor="middle" font-size="8.5" fill="#55665f">purple</text></g>
<line x1="14" y1="96" x2="145.1" y2="96" stroke="#c0392b" stroke-width="1.6"/><polygon points="150,96 143.6,98.9 143.6,93.1" fill="#c0392b"/><text x="82" y="110" text-anchor="middle" font-size="9" fill="#c0392b">more acidic (more H⁺)</text><line x1="326" y1="96" x2="190.9" y2="96" stroke="#2f6fa5" stroke-width="1.6"/><polygon points="186,96 192.4,93.1 192.4,98.9" fill="#2f6fa5"/><text x="256" y="110" text-anchor="middle" font-size="9" fill="#2f6fa5">more alkaline (more OH⁻)</text><text x="168" y="100" text-anchor="middle" font-size="8.5" fill="#2f6f4e">neutral</text>
<g data-hl="ex"><text x="14" y="132" font-size="9.5" fill="#1b2b25">battery acid ≈ 0–1</text>
<text x="14" y="145" font-size="9.5" fill="#1b2b25">lemon / orange juice ≈ 2–3</text>
<text x="14" y="158" font-size="9.5" fill="#1b2b25">acid rain 2–5, coffee ≈ 5</text>
<text x="14" y="171" font-size="9.5" fill="#1b2b25">milk ≈ 6.5</text>
<text x="14" y="184" font-size="9.5" fill="#1b2b25">pure water 7, blood 7.4</text>
<text x="14" y="197" font-size="9.5" fill="#1b2b25">baking soda ≈ 8–9</text>
<text x="14" y="210" font-size="9.5" fill="#1b2b25">ammonia solution ≈ 11</text>
<text x="14" y="223" font-size="9.5" fill="#1b2b25">bleach ≈ 12–13</text></g>
<text x="230" y="150" text-anchor="middle" font-size="9.5" fill="#55665f">A colour gives a range;</text><text x="230" y="163" text-anchor="middle" font-size="9.5" fill="#55665f">a pH meter gives a number</text><text x="230" y="176" text-anchor="middle" font-size="9.5" fill="#55665f">(e.g. 6.84).</text>
</svg>
