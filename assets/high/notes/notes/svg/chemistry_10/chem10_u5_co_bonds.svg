<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 254">
<text font-family="HighNunito" x="170" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25">H₂ + Cl₂<tspan dx="2.6" font-family="HighSymbols2">→</tspan> 2HCl: break bonds, then make bonds</text>
<line x1="30" y1="40" x2="30" y2="196" stroke="#1b2b25" stroke-width="1.4"/><text font-family="HighNunito" x="18" y="120" text-anchor="middle" font-size="10" fill="#1b2b25" transform="rotate(-90 18 120)">enthalpy H</text>
<line x1="44" y1="150" x2="120" y2="150" stroke="#1b2b25" stroke-width="2.4"/><text font-family="HighNunito" x="82" y="166" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">H₂ + Cl₂</text>
<line x1="150" y1="56" x2="226" y2="56" stroke="#1b2b25" stroke-width="2.4"/><text font-family="HighNunito" x="188" y="50" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">2H + 2Cl (atoms)</text>
<line x1="250" y1="178" x2="326" y2="178" stroke="#1b2b25" stroke-width="2.4"/><text font-family="HighNunito" x="288" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">2HCl</text>
<g data-hl="break"><line x1="100" y1="148" x2="165" y2="63.9" stroke="#c0392b" stroke-width="1.8"/><polygon points="168,60 166.4,66.8 161.8,63.3" fill="#c0392b"/>
<text font-family="HighNunito" x="126" y="90" text-anchor="end" font-size="9.5" fill="#c0392b">break: +436 +243</text>
<text font-family="HighNunito" x="126" y="102" text-anchor="end" font-size="9.5" fill="#c0392b">= +679 kJ (in)</text></g>
<g data-hl="make"><line x1="214" y1="60" x2="265.9" y2="169.6" stroke="#2f6fa5" stroke-width="1.8"/><polygon points="268,174 262.7,169.4 267.8,167" fill="#2f6fa5"/>
<text font-family="HighNunito" x="256" y="120" font-size="9.5" fill="#2f6fa5">make 2 H–Cl:</text>
<text font-family="HighNunito" x="256" y="132" font-size="9.5" fill="#2f6fa5">2 × 432 = 864 kJ</text>
<text font-family="HighNunito" x="256" y="144" font-size="9.5" fill="#2f6fa5">(out)</text></g>
<g data-hl="net"><line x1="120" y1="150" x2="326" y2="150" stroke="#7a8a84" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="314" y1="151" x2="314" y2="172.8" stroke="#2f6f4e" stroke-width="2"/><polygon points="314,177 311.6,171.5 316.4,171.5" fill="#2f6f4e"/>
<text font-family="HighNunito" x="196" y="214" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f6f4e">ΔH = 679 − 864 = −185 kJ</text>
<text font-family="HighNunito" x="196" y="228" text-anchor="middle" font-size="9" fill="#2f6f4e">products lower than reactants<tspan dx="2.6" font-family="HighSymbols2">→</tspan> exothermic</text></g>
<text font-family="HighNunito" x="196" y="246" text-anchor="middle" font-size="8.5" fill="#55665f">(levels drawn to scale)</text>
</svg>
