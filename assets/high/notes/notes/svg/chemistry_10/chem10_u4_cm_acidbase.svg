<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 278" font-family="sans-serif">
<text x="180" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25">Three ways to define acids and bases</text>
<g data-hl="ar"><rect x="6" y="26" width="348" height="56" rx="8" fill="#fff8f0" stroke="#ead8c4" stroke-width="1"/>
<text x="14" y="44" font-size="11" font-weight="bold" fill="#c0392b">Arrhenius (in water)</text>
<text x="95" y="62" text-anchor="middle" font-size="11" fill="#1b2b25">acid: HCl → H⁺ + Cl⁻</text>
<text x="260" y="62" text-anchor="middle" font-size="11" fill="#1b2b25">base: NaOH → Na⁺ + OH⁻</text>
<text x="180" y="76" text-anchor="middle" font-size="9" fill="#55665f">acid gives H⁺, base gives OH⁻ in water</text></g>
<g data-hl="bl"><rect x="6" y="88" width="348" height="108" rx="8" fill="#f3f8fd" stroke="#cfdce8" stroke-width="1"/>
<text x="14" y="106" font-size="11" font-weight="bold" fill="#2f6fa5">Brønsted–Lowry (proton transfer)</text>
<text x="46" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25">HCl</text>
<text x="84" y="140" text-anchor="middle" font-size="13" fill="#1b2b25">+</text>
<text x="120" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25">H₂O</text>
<text x="166" y="140" text-anchor="middle" font-size="14" fill="#1b2b25">⇌</text>
<text x="206" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25">Cl⁻</text>
<text x="244" y="140" text-anchor="middle" font-size="13" fill="#1b2b25">+</text>
<text x="286" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25">H₃O⁺</text>
<text x="46" y="124" text-anchor="middle" font-size="9" fill="#c0392b">acid</text>
<text x="120" y="124" text-anchor="middle" font-size="9" fill="#2f6fa5">base</text>
<text x="206" y="124" text-anchor="middle" font-size="9" fill="#2f6fa5">conj. base</text>
<text x="286" y="124" text-anchor="middle" font-size="9" fill="#c0392b">conj. acid</text>
<path d="M46 146 L46 154 L206 154 L206 146" fill="none" stroke="#c0392b" stroke-width="1.4"/>
<text x="163" y="166" text-anchor="middle" font-size="9" fill="#c0392b">pair 1: HCl / Cl⁻</text>
<path d="M120 146 L120 174 L286 174 L286 146" fill="none" stroke="#2f6fa5" stroke-width="1.4"/>
<text x="203" y="188" text-anchor="middle" font-size="9" fill="#2f6fa5">pair 2: H₂O / H₃O⁺</text>
<line x1="58" y1="130" x2="102.5" y2="130" stroke="#e67e22" stroke-width="1.2"/><polygon points="106,130 101.4,132 101.4,128" fill="#e67e22"/>
<text x="82" y="122" text-anchor="middle" font-size="9" font-weight="bold" fill="#e67e22">H⁺</text></g>
<g data-hl="lw"><rect x="6" y="202" width="348" height="70" rx="8" fill="#f7f3fb" stroke="#ddd0ea" stroke-width="1"/>
<text x="14" y="220" font-size="11" font-weight="bold" fill="#7d3c98">Lewis (electron pair)</text>
<text x="70" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25">H₃N:</text>
<text x="116" y="250" text-anchor="middle" font-size="13" fill="#1b2b25">+</text>
<text x="156" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25">BF₃</text>
<text x="196" y="250" text-anchor="middle" font-size="13" fill="#1b2b25">→</text>
<text x="268" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25">H₃N→BF₃</text>
<path d="M78 238 Q110 218 150 236" fill="none" stroke="#7d3c98" stroke-width="1.4"/>
<polygon points="150,236 142,234 146,228" fill="#7d3c98"/>
<text x="70" y="266" text-anchor="middle" font-size="9" fill="#2f6fa5">base: gives a pair</text>
<text x="156" y="266" text-anchor="middle" font-size="9" fill="#c0392b">acid: accepts it</text>
<text x="268" y="266" text-anchor="middle" font-size="9" fill="#55665f">coordinate bond</text></g>
</svg>
