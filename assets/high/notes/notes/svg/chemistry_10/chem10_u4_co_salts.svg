<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 212" font-family="sans-serif">
<text x="170" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25">Which method makes this salt?</text>
<g data-hl="q1"><rect x="95" y="28" width="150" height="36" rx="6" fill="#fff7e6" stroke="#e0b860" stroke-width="1.4"/><text x="170" y="44" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">Is the salt soluble</text><text x="170" y="57" text-anchor="middle" font-size="8.5" fill="#55665f">in water? (solubility table)</text></g>
<line x1="140" y1="64" x2="83.8" y2="90.2" stroke="#1b2b25" stroke-width="1.4"/><polygon points="80,92 83.9,87.5 86,91.9" fill="#1b2b25"/><text x="96" y="80" text-anchor="end" font-size="9" fill="#2f6f4e">yes</text><line x1="200" y1="64" x2="258.2" y2="90.3" stroke="#1b2b25" stroke-width="1.4"/><polygon points="262,92 256,92 258,87.5" fill="#1b2b25"/><text x="246" y="80" font-size="9" fill="#c0392b">no</text>
<g data-hl="sol"><rect x="8" y="94" width="156" height="36" rx="6" fill="#eef8f1" stroke="#8fc4a2" stroke-width="1.4"/><text x="86" y="110" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">Acid + metal / base /</text><text x="86" y="123" text-anchor="middle" font-size="8.5" fill="#55665f">oxide / carbonate</text>
<text x="86" y="146" text-anchor="middle" font-size="9" fill="#55665f">1 excess solid into warm acid</text>
<text x="86" y="159" text-anchor="middle" font-size="9" fill="#55665f">2 filter off the excess</text>
<text x="86" y="172" text-anchor="middle" font-size="9" fill="#55665f">3 evaporate, crystallise</text>
<text x="86" y="192" text-anchor="middle" font-size="9" fill="#2f6fa5">Na, K, NH₄ salts: titrate</text>
<text x="86" y="204" text-anchor="middle" font-size="9" fill="#2f6fa5">alkali + acid (no excess solid)</text></g>
<g data-hl="insol"><rect x="178" y="94" width="156" height="36" rx="6" fill="#fdecec" stroke="#e09a9a" stroke-width="1.4"/><text x="256" y="110" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">Precipitation</text><text x="256" y="123" text-anchor="middle" font-size="8.5" fill="#55665f">(double decomposition)</text>
<text x="256" y="146" text-anchor="middle" font-size="9" fill="#55665f">1 mix two soluble salts</text>
<text x="256" y="159" text-anchor="middle" font-size="9" fill="#55665f">2 filter off the precipitate</text>
<text x="256" y="172" text-anchor="middle" font-size="9" fill="#55665f">3 wash with water, dry</text>
<text x="256" y="192" text-anchor="middle" font-size="9" fill="#2f6fa5">e.g. BaCl₂ + Na₂SO₄ →</text>
<text x="256" y="204" text-anchor="middle" font-size="9" fill="#2f6fa5">BaSO₄↓ + 2NaCl</text></g>
</svg>
