<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 208">
<text font-family="HighNunito" x="170" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25">Metallic bonding: cations in a “sea” of electrons</text>
<rect x="30" y="30" width="280" height="136" rx="6" fill="#fdf6e3" stroke="#d8c79a" stroke-width="1.2"/>
<g fill="#f0b27a" stroke="#b9770e" stroke-width="1"><circle cx="64" cy="114" r="11"/><circle cx="108" cy="114" r="11"/><circle cx="152" cy="114" r="11"/><circle cx="196" cy="114" r="11"/><circle cx="240" cy="114" r="11"/><circle cx="284" cy="114" r="11"/><circle cx="64" cy="146" r="11"/><circle cx="108" cy="146" r="11"/><circle cx="152" cy="146" r="11"/><circle cx="196" cy="146" r="11"/><circle cx="240" cy="146" r="11"/><circle cx="284" cy="146" r="11"/></g>
<g font-size="11" font-weight="bold" text-anchor="middle" fill="#7e5109"><text font-family="HighNunito" x="64" y="118">+</text><text font-family="HighNunito" x="108" y="118">+</text><text font-family="HighNunito" x="152" y="118">+</text><text font-family="HighNunito" x="196" y="118">+</text><text font-family="HighNunito" x="240" y="118">+</text><text font-family="HighNunito" x="284" y="118">+</text><text font-family="HighNunito" x="64" y="150">+</text><text font-family="HighNunito" x="108" y="150">+</text><text font-family="HighNunito" x="152" y="150">+</text><text font-family="HighNunito" x="196" y="150">+</text><text font-family="HighNunito" x="240" y="150">+</text><text font-family="HighNunito" x="284" y="150">+</text></g>
<g fill="#2f6fa5"><circle cx="44" cy="40" r="2.6"/><circle cx="90" cy="66" r="2.6"/><circle cx="132" cy="38" r="2.6"/><circle cx="176" cy="70" r="2.6"/><circle cx="220" cy="42" r="2.6"/><circle cx="262" cy="64" r="2.6"/><circle cx="300" cy="40" r="2.6"/><circle cx="62" cy="98" r="2.6"/><circle cx="110" cy="128" r="2.6"/><circle cx="154" cy="100" r="2.6"/><circle cx="196" cy="130" r="2.6"/><circle cx="240" cy="98" r="2.6"/><circle cx="284" cy="126" r="2.6"/><circle cx="44" cy="150" r="2.6"/><circle cx="88" cy="158" r="2.6"/><circle cx="140" cy="156" r="2.6"/><circle cx="186" cy="162" r="2.6"/><circle cx="232" cy="154" r="2.6"/><circle cx="276" cy="160" r="2.6"/><circle cx="300" cy="96" r="2.6"/><circle cx="86" cy="130" r="2.6"/><circle cx="250" cy="128" r="2.6"/></g>
<g data-s="sea"><g fill="#f0b27a" stroke="#b9770e" stroke-width="1"><circle cx="64" cy="50" r="11"/><circle cx="108" cy="50" r="11"/><circle cx="152" cy="50" r="11"/><circle cx="196" cy="50" r="11"/><circle cx="240" cy="50" r="11"/><circle cx="284" cy="50" r="11"/><circle cx="64" cy="82" r="11"/><circle cx="108" cy="82" r="11"/><circle cx="152" cy="82" r="11"/><circle cx="196" cy="82" r="11"/><circle cx="240" cy="82" r="11"/><circle cx="284" cy="82" r="11"/></g>
<g font-size="11" font-weight="bold" text-anchor="middle" fill="#7e5109"><text font-family="HighNunito" x="64" y="54">+</text><text font-family="HighNunito" x="108" y="54">+</text><text font-family="HighNunito" x="152" y="54">+</text><text font-family="HighNunito" x="196" y="54">+</text><text font-family="HighNunito" x="240" y="54">+</text><text font-family="HighNunito" x="284" y="54">+</text><text font-family="HighNunito" x="64" y="86">+</text><text font-family="HighNunito" x="108" y="86">+</text><text font-family="HighNunito" x="152" y="86">+</text><text font-family="HighNunito" x="196" y="86">+</text><text font-family="HighNunito" x="240" y="86">+</text><text font-family="HighNunito" x="284" y="86">+</text></g>
<text font-family="HighNunito" x="170" y="186" text-anchor="middle" font-size="9.5" fill="#55665f">positive metal ions (cations) fixed in layers;</text>
<text font-family="HighNunito" x="170" y="200" text-anchor="middle" font-size="9.5" fill="#2f6fa5">valence electrons delocalised — free to move anywhere</text></g>
<g data-s="slide"><g fill="#f0b27a" stroke="#b9770e" stroke-width="1"><circle cx="86" cy="50" r="11"/><circle cx="130" cy="50" r="11"/><circle cx="174" cy="50" r="11"/><circle cx="218" cy="50" r="11"/><circle cx="262" cy="50" r="11"/><circle cx="306" cy="50" r="11"/><circle cx="86" cy="82" r="11"/><circle cx="130" cy="82" r="11"/><circle cx="174" cy="82" r="11"/><circle cx="218" cy="82" r="11"/><circle cx="262" cy="82" r="11"/><circle cx="306" cy="82" r="11"/></g>
<g font-size="11" font-weight="bold" text-anchor="middle" fill="#7e5109"><text font-family="HighNunito" x="86" y="54">+</text><text font-family="HighNunito" x="130" y="54">+</text><text font-family="HighNunito" x="174" y="54">+</text><text font-family="HighNunito" x="218" y="54">+</text><text font-family="HighNunito" x="262" y="54">+</text><text font-family="HighNunito" x="306" y="54">+</text><text font-family="HighNunito" x="86" y="86">+</text><text font-family="HighNunito" x="130" y="86">+</text><text font-family="HighNunito" x="174" y="86">+</text><text font-family="HighNunito" x="218" y="86">+</text><text font-family="HighNunito" x="262" y="86">+</text><text font-family="HighNunito" x="306" y="86">+</text></g>
<line x1="4" y1="66" x2="27.1" y2="66" stroke="#c0392b" stroke-width="2"/><polygon points="32,66 25.6,68.9 25.6,63.1" fill="#c0392b"/>
<text font-family="HighNunito" x="4" y="58" font-size="9" fill="#c0392b">force</text>
<text font-family="HighNunito" x="170" y="186" text-anchor="middle" font-size="9.5" fill="#55665f">hammering slides the top layers along;</text>
<text font-family="HighNunito" x="170" y="200" text-anchor="middle" font-size="9.5" fill="#2f6f4e">the electron sea still holds them<tspan dx="2.6" font-family="HighSymbols2">→</tspan> malleable, not brittle</text></g>
</svg>
