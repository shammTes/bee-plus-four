<text x="316" y="134" text-anchor="middle" font-size="11" fill="#c0392b">δ+</text>
<text x="269" y="116" text-anchor="middle" font-size="9" fill="#55665f">104.5°</text>
<line x1="331" y1="110" x2="331" y2="68.2" stroke="#e67e22" stroke-width="1.8"/><polygon points="331,64 333.4,69.5 328.6,69.5" fill="#e67e22"/><line x1="327" y1="105" x2="335" y2="105" stroke="#e67e22" stroke-width="1.8"/>
<text x="331" y="124" text-anchor="middle" font-size="9" fill="#e67e22">net</text>
<text x="269" y="142" text-anchor="middle" font-size="9" fill="#55665f">bent: bond dipoles add up</text></g>
