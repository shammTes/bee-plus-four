<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" font-family="HighNunito"><text x="170" y="16" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Fixed and working capital</text><rect x="6" y="28" width="160" height="166" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.5"/><rect x="174" y="28" width="160" height="166" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.5"/><text x="86" y="48" font-size="12.5" text-anchor="middle" fill="#B86E12" font-weight="800">FIXED</text><text x="86" y="62" font-size="9.5" text-anchor="middle" fill="#8A7F76" font-weight="600">used for many years</text><text x="254" y="48" font-size="12.5" text-anchor="middle" fill="#2F5F8F" font-weight="800">WORKING</text><text x="254" y="62" font-size="9.5" text-anchor="middle" fill="#8A7F76" font-weight="600">used up in one season</text><text x="86" y="86" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">tractor, pump</text><text x="86" y="104" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">buildings, stores</text><text x="86" y="122" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">milking machine</text><text x="86" y="140" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">irrigation works</text><text x="86" y="158" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">breeding stock</text><text x="86" y="176" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">→ depreciated</text><text x="254" y="86" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">seed</text><text x="254" y="104" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">fertiliser, pesticide</text><text x="254" y="122" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">fuel, feed</text><text x="254" y="140" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">wages</text><text x="254" y="158" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">cash for daily costs</text><text x="254" y="176" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">→ in variable costs</text></svg>
