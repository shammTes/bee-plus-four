<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 270" font-family="HighNunito"><rect x="6" y="6" width="160" height="258" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.6"/><rect x="174" y="6" width="160" height="258" rx="8" fill="#F3E9DC" stroke="#7A4E2D" stroke-width="1.6"/><text x="86" y="26" font-size="12.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">CONCENTRATES</text><text x="86" y="42" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">fibre &lt; 18 %, dense</text><text x="254" y="26" font-size="12.5" text-anchor="middle" fill="#7A4E2D" font-weight="800">ROUGHAGES</text><text x="254" y="42" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">fibre &gt; 18 %, bulky</text><text x="16" y="70" font-size="11.5" fill="#3E3129" font-weight="800">Energy-rich</text><text x="16" y="85.3" font-size="10.5" fill="#8A7F76" font-weight="600">grains: sorghum, maize,</text><text x="16" y="98.1" font-size="10.5" fill="#8A7F76" font-weight="600">barley</text><text x="16" y="120" font-size="11.5" fill="#3E3129" font-weight="800">Protein-rich</text><text x="16" y="135.3" font-size="10.5" fill="#8A7F76" font-weight="600">oil-seed cakes: sesame,</text><text x="16" y="148.1" font-size="10.5" fill="#8A7F76" font-weight="600">noug, cotton</text><text x="16" y="170" font-size="11.5" fill="#3E3129" font-weight="800">Intermediate</text><text x="16" y="191.7" font-size="10.5" fill="#8A7F76" font-weight="600">wheat bran, middlings</text><text x="16" y="220" font-size="11.5" fill="#3E3129" font-weight="800">Supplements</text><text x="16" y="235.3" font-size="10.5" fill="#8A7F76" font-weight="600">salt, limestone, bone</text><text x="16" y="248.1" font-size="10.5" fill="#8A7F76" font-weight="600">meal, fishmeal</text><text x="184" y="70" font-size="11.5" fill="#3E3129" font-weight="800">Dry</text><text x="184" y="78.9" font-size="10.5" fill="#8A7F76" font-weight="600">straw (barley, wheat),</text><text x="184" y="91.7" font-size="10.5" fill="#8A7F76" font-weight="600">stover (sorghum, millet),</text><text x="184" y="104.5" font-size="10.5" fill="#8A7F76" font-weight="600">hay</text><text x="184" y="120" font-size="11.5" fill="#3E3129" font-weight="800">Succulent (fresh)</text><text x="184" y="135.3" font-size="10.5" fill="#8A7F76" font-weight="600">alfalfa, elephant grass,</text><text x="184" y="148.1" font-size="10.5" fill="#8A7F76" font-weight="600">pasture</text><text x="184" y="170" font-size="11.5" fill="#3E3129" font-weight="800">Browse</text><text x="184" y="185.3" font-size="10.5" fill="#8A7F76" font-weight="600">acacia, sesbania, leucaena</text><text x="184" y="198.1" font-size="10.5" fill="#8A7F76" font-weight="600">leaves</text><text x="184" y="220" font-size="11.5" fill="#3E3129" font-weight="800">Used well only by</text><text x="184" y="241.7" font-size="10.5" fill="#8A7F76" font-weight="600">ruminants (rumen microbes)</text></svg>
