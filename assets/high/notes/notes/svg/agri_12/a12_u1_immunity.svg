<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" font-family="HighNunito"><rect x="6" y="6" width="160" height="208" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.6"/><rect x="174" y="6" width="160" height="208" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.6"/><text x="86" y="26" font-size="13" text-anchor="middle" fill="#2F5F8F" font-weight="800">VACCINE</text><text x="86" y="42" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">gives ACTIVE immunity</text><text x="254" y="26" font-size="13" text-anchor="middle" fill="#B86E12" font-weight="800">ANTISERUM</text><text x="254" y="42" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">gives PASSIVE immunity</text><text x="86" y="69.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">contains antigen</text><text x="254" y="63.3" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">contains ready</text><text x="254" y="76.1" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">antibodies</text><text x="86" y="93.3" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">body makes its own</text><text x="86" y="106.1" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">antibodies</text><text x="254" y="99.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">borrowed antibodies</text><text x="86" y="129.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">works after 10–14 days</text><text x="254" y="129.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">works at once</text><text x="86" y="153.3" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">lasts long (months,</text><text x="86" y="166.1" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">years)</text><text x="254" y="159.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">lasts a few weeks</text><text x="86" y="189.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">before an outbreak</text><text x="254" y="189.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">during an outbreak</text><text x="170" y="210" font-size="10.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">Colostrum = natural passive immunity</text></svg>
