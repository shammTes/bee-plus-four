<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190" font-family="HighNunito"><rect x="100" y="6" width="140" height="30" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="170" y="25.4" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Land degradation</text><rect x="6" y="70" width="78" height="30" rx="8" fill="#fff" stroke="#7A4E2D" stroke-width="1.8"/><text x="45" y="89" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Soil</text><line x1="170" y1="36" x2="45" y2="69" stroke="#8A7F76" stroke-width="1.1" stroke-linecap="round"/><text x="45" y="111.1" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">erosion;</text><text x="45" y="123.3" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">physical,</text><text x="45" y="135.5" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">chemical,</text><text x="45" y="147.7" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">biological</text><text x="45" y="159.9" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">decline</text><rect x="89" y="70" width="78" height="30" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.8"/><text x="128" y="89" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Vegetation</text><line x1="170" y1="36" x2="128" y2="69" stroke="#8A7F76" stroke-width="1.1" stroke-linecap="round"/><text x="128" y="123.3" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">less biomass</text><text x="128" y="135.5" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">and ground</text><text x="128" y="147.7" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">cover</text><rect x="172" y="70" width="78" height="30" rx="8" fill="#ECE6F5" stroke="#6A4C9C" stroke-width="1.8"/><text x="211" y="89" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Biodiversity</text><line x1="170" y1="36" x2="211" y2="69" stroke="#8A7F76" stroke-width="1.1" stroke-linecap="round"/><text x="211" y="123.3" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">fewer genes,</text><text x="211" y="135.5" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">species,</text><text x="211" y="147.7" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">ecosystems</text><rect x="255" y="70" width="78" height="30" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.8"/><text x="294" y="89" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Water</text><line x1="170" y1="36" x2="294" y2="69" stroke="#8A7F76" stroke-width="1.1" stroke-linecap="round"/><text x="294" y="117.2" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">less, dirtier</text><text x="294" y="129.4" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">water;</text><text x="294" y="141.6" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">downstream</text><text x="294" y="153.8" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">floods</text><text x="170" y="184" font-size="10.5" text-anchor="middle" fill="#C24E32" font-weight="600">Immediate causes: over-cultivation, overgrazing, deforestation</text></svg>
