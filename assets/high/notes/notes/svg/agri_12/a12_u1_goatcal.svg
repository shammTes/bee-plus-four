<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 236" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Goat breeding calendar</text><rect x="6" y="26" width="100" height="28" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="56" y="43.9" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Heat cycle</text><text x="114" y="37.3" font-size="10.5" fill="#3E3129" font-weight="600">every 17–21 days; she accepts the</text><text x="114" y="50.1" font-size="10.5" fill="#3E3129" font-weight="600">buck for 24–36 h</text><rect x="6" y="60" width="100" height="28" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.8"/><text x="56" y="77.8" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">First mating</text><text x="114" y="77.7" font-size="10.5" fill="#3E3129" font-weight="600">at 3/4 of adult weight (19–23 kg)</text><rect x="6" y="94" width="100" height="28" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.8"/><text x="56" y="111.8" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Gestation</text><text x="114" y="111.7" font-size="10.5" fill="#3E3129" font-weight="600">145–150 days (about 5 months)</text><rect x="6" y="128" width="100" height="28" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.8"/><text x="56" y="145.8" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Last 2 months</text><text x="114" y="145.7" font-size="10.5" fill="#3E3129" font-weight="600">stop milking; wean any suckling kids</text><rect x="6" y="162" width="100" height="28" rx="8" fill="#ECE6F5" stroke="#6A4C9C" stroke-width="1.8"/><text x="56" y="179.8" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Last 6 weeks</text><text x="114" y="179.7" font-size="10.5" fill="#3E3129" font-weight="600">extra protein and minerals</text><rect x="6" y="196" width="100" height="28" rx="8" fill="#fff" stroke="#7A4E2D" stroke-width="1.8"/><text x="56" y="213.8" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Weaning</text><text x="114" y="213.7" font-size="10.5" fill="#3E3129" font-weight="600">kids leave the dam at 3 months</text></svg>
