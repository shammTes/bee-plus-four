<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" font-family="HighNunito"><text x="170" y="16" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Traditional and Adhanet improved stove</text><text x="130" y="62" font-size="11" text-anchor="end" fill="#3E3129" font-weight="800">Traditional (3 stones)</text><rect x="136" y="44" width="55" height="28" rx="4" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.4"/><text x="195" y="63" font-size="11" fill="#B86E12" font-weight="800">10 % efficient</text><text x="130" y="112" font-size="11" text-anchor="end" fill="#3E3129" font-weight="800">Improved (Adhanet)</text><rect x="136" y="94" width="115.5" height="28" rx="4" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.4"/><text x="255.5" y="113" font-size="11" fill="#2A7A6B" font-weight="800">21 % efficient</text><text x="170" y="160" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Same cooking with about half the wood</text><text x="170" y="180" font-size="10.5" text-anchor="middle" fill="#8A7F76" font-weight="600">Saves about 0.6 t of CO₂ per stove each year</text></svg>
