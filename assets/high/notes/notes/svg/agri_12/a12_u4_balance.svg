<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" font-family="HighNunito"><text x="170" y="16" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Balance sheet: Assets = Liabilities + Net worth</text><rect x="10" y="34" width="150" height="156" rx="6" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.5"/><text x="85" y="52" font-size="12" text-anchor="middle" fill="#2F5F8F" font-weight="800">ASSETS</text><text x="85" y="66" font-size="9.5" text-anchor="middle" fill="#8A7F76" font-weight="600">(what the farm owns)</text><rect x="20" y="76" width="130" height="40" rx="4" fill="#FFFFFF" stroke="#2F5F8F" stroke-width="1"/><text x="85" y="92" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Current</text><text x="85" y="106" font-size="9" text-anchor="middle" fill="#8A7F76" font-weight="600">cash, eggs, fertiliser</text><rect x="20" y="124" width="130" height="56" rx="4" fill="#FFFFFF" stroke="#2F5F8F" stroke-width="1"/><text x="85" y="146" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Fixed (long-term)</text><text x="85" y="160" font-size="9" text-anchor="middle" fill="#8A7F76" font-weight="600">land, buildings,</text><text x="85" y="171" font-size="9" text-anchor="middle" fill="#8A7F76" font-weight="600">machinery</text><rect x="180" y="34" width="150" height="156" rx="6" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.5"/><text x="255" y="52" font-size="12" text-anchor="middle" fill="#C24E32" font-weight="800">LIABILITIES</text><text x="255" y="66" font-size="10.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">+ NET WORTH</text><rect x="190" y="76" width="130" height="40" rx="4" fill="#FFFFFF" stroke="#C24E32" stroke-width="1"/><text x="255" y="92" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="800">Current liabilities</text><text x="255" y="106" font-size="9" text-anchor="middle" fill="#8A7F76" font-weight="600">due within 1 year</text><rect x="190" y="124" width="130" height="26" rx="4" fill="#FFFFFF" stroke="#C24E32" stroke-width="1"/><text x="255" y="141" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="800">Long-term loans</text><rect x="190" y="154" width="130" height="26" rx="4" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1"/><text x="255" y="171" font-size="10" text-anchor="middle" fill="#2A7A6B" font-weight="800">Net worth (owner)</text><text x="170" y="118" font-size="20" text-anchor="middle" fill="#3E3129" font-weight="800">=</text><text x="170" y="212" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">Net worth = assets − liabilities; negative = insolvent</text></svg>
