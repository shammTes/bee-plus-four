<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 270" font-family="HighNunito"><text x="170" y="16" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Six IUCN categories of protected area</text><rect x="10" y="28" width="320" height="34" rx="5" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.2"/><text x="26" y="50" font-size="12" text-anchor="middle" fill="#2A7A6B" font-weight="800">I</text><text x="48" y="43" font-size="11" fill="#3E3129" font-weight="800">Strict nature reserve / wilderness</text><text x="48" y="56" font-size="9.5" fill="#8A7F76" font-weight="600">least human use</text><rect x="10" y="68" width="298" height="34" rx="5" fill="#F3F8EE" stroke="#2A7A6B" stroke-width="1.2"/><text x="26" y="90" font-size="12" text-anchor="middle" fill="#2A7A6B" font-weight="800">II</text><text x="48" y="83" font-size="11" fill="#3E3129" font-weight="800">National park</text><text x="48" y="96" font-size="9.5" fill="#8A7F76" font-weight="600">large ecosystems, visitors</text><rect x="10" y="108" width="276" height="34" rx="5" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.2"/><text x="26" y="130" font-size="12" text-anchor="middle" fill="#2A7A6B" font-weight="800">III</text><text x="48" y="123" font-size="11" fill="#3E3129" font-weight="800">Natural monument</text><text x="48" y="136" font-size="9.5" fill="#8A7F76" font-weight="600">a cave, an ancient grove</text><rect x="10" y="148" width="254" height="34" rx="5" fill="#F3F8EE" stroke="#2A7A6B" stroke-width="1.2"/><text x="26" y="170" font-size="12" text-anchor="middle" fill="#2A7A6B" font-weight="800">IV</text><text x="48" y="163" font-size="11" fill="#3E3129" font-weight="800">Habitat / species management</text><text x="48" y="176" font-size="9.5" fill="#8A7F76" font-weight="600">active care of a species</text><rect x="10" y="188" width="232" height="34" rx="5" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.2"/><text x="26" y="210" font-size="12" text-anchor="middle" fill="#2A7A6B" font-weight="800">V</text><text x="48" y="203" font-size="11" fill="#3E3129" font-weight="800">Protected landscape</text><text x="48" y="216" font-size="9.5" fill="#8A7F76" font-weight="600">people + nature over time</text><rect x="10" y="228" width="210" height="34" rx="5" fill="#F3F8EE" stroke="#2A7A6B" stroke-width="1.2"/><text x="26" y="250" font-size="12" text-anchor="middle" fill="#2A7A6B" font-weight="800">VI</text><text x="48" y="243" font-size="11" fill="#3E3129" font-weight="800">Sustainable-use area</text><text x="48" y="256" font-size="9.5" fill="#8A7F76" font-weight="600">resources used wisely</text><text x="330" y="266" font-size="10" text-anchor="end" fill="#8A7F76" font-weight="600">more use allowed ↓</text></svg>
