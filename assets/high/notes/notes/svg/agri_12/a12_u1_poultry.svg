<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Hen: digestive tract (no teeth)</text><rect x="16" y="26" width="120" height="23" rx="6" fill="#F2D49B" stroke="#7A4E2D" stroke-width="1.2"/><text x="76" y="42" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Beak</text><text x="144" y="42" font-size="10.5" fill="#3E3129" font-weight="600">picks food; no chewing</text><rect x="16" y="54" width="120" height="23" rx="6" fill="#F3D1C2" stroke="#7A4E2D" stroke-width="1.2"/><text x="76" y="70" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Crop</text><text x="144" y="70" font-size="10.5" fill="#3E3129" font-weight="600">stores food</text><line x1="76" y1="49" x2="76" y2="53" stroke="#3E3129" stroke-width="1.3" stroke-linecap="round"/><path d="M76 53 L74.4 49.3 L77.6 49.3 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="16" y="82" width="120" height="23" rx="6" fill="#E9B8A3" stroke="#7A4E2D" stroke-width="1.2"/><text x="76" y="98" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Proventriculus</text><text x="144" y="98" font-size="10.5" fill="#3E3129" font-weight="600">acid + pepsinogen</text><line x1="76" y1="77" x2="76" y2="81" stroke="#3E3129" stroke-width="1.3" stroke-linecap="round"/><path d="M76 81 L74.4 77.3 L77.6 77.3 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="16" y="110" width="120" height="23" rx="6" fill="#C9876E" stroke="#7A4E2D" stroke-width="1.2"/><text x="76" y="126" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Gizzard</text><text x="144" y="126" font-size="10.5" fill="#3E3129" font-weight="600">muscle + grit grind grain</text><line x1="76" y1="105" x2="76" y2="109" stroke="#3E3129" stroke-width="1.3" stroke-linecap="round"/><path d="M76 109 L74.4 105.3 L77.6 105.3 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="16" y="138" width="120" height="23" rx="6" fill="#E39C86" stroke="#7A4E2D" stroke-width="1.2"/><text x="76" y="154" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Small intestine</text><text x="144" y="154" font-size="10.5" fill="#3E3129" font-weight="600">bile, pancreatic juice; absorption</text><line x1="76" y1="133" x2="76" y2="137" stroke="#3E3129" stroke-width="1.3" stroke-linecap="round"/><path d="M76 137 L74.4 133.3 L77.6 133.3 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="16" y="166" width="120" height="23" rx="6" fill="#D9C3A0" stroke="#7A4E2D" stroke-width="1.2"/><text x="76" y="182" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Two caeca</text><text x="144" y="182" font-size="10.5" fill="#3E3129" font-weight="600">bacteria ferment leftovers</text><line x1="76" y1="161" x2="76" y2="165" stroke="#3E3129" stroke-width="1.3" stroke-linecap="round"/><path d="M76 165 L74.4 161.3 L77.6 161.3 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="16" y="194" width="120" height="23" rx="6" fill="#CDB794" stroke="#7A4E2D" stroke-width="1.2"/><text x="76" y="210" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Short colon</text><text x="144" y="210" font-size="10.5" fill="#3E3129" font-weight="600">water re-absorbed</text><line x1="76" y1="189" x2="76" y2="193" stroke="#3E3129" stroke-width="1.3" stroke-linecap="round"/><path d="M76 193 L74.4 189.3 L77.6 189.3 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="16" y="222" width="120" height="23" rx="6" fill="#BFAF95" stroke="#7A4E2D" stroke-width="1.2"/><text x="76" y="238" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Cloaca</text><text x="144" y="238" font-size="10.5" fill="#3E3129" font-weight="600">faeces + urine leave together</text><line x1="76" y1="217" x2="76" y2="221" stroke="#3E3129" stroke-width="1.3" stroke-linecap="round"/><path d="M76 221 L74.4 217.3 L77.6 217.3 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M295.6 51.4 C292 37 301 33.4 306.4 40.6 C311.8 44.2 317.2 42.4 319 35.2 C320.8 28 329.8 28 329.8 35.2 L334.3 37 L329.8 38.8 C329.8 49.6 322.6 56.8 311.8 56.8 C302.8 56.8 297.4 55 295.6 51.4Z" fill="#FFFFFF" stroke="#6A5B50" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M322.6 28 C322.6 22.6 328 22.6 328 28" fill="none" stroke="#C24E32" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M310 56.8 L309.1 64 M315.4 56.8 L316.3 64" fill="none" stroke="#B86E12" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="326.2" cy="33.4" r="1.1" fill="#222"/></svg>
