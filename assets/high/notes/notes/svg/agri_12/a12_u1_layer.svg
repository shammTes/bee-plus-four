<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 214" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Life of a layer hen (White Leghorn)</text><line x1="26" y1="104" x2="314" y2="104" stroke="#3E3129" stroke-width="2" stroke-linecap="round"/><rect x="242" y="100" width="72" height="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="0"/><circle cx="26" cy="104" r="5" fill="#fff" stroke="#B86E12" stroke-width="2"/><text x="26" y="88" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">day 1</text><text x="26" y="126" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">chick from</text><text x="26" y="138" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">hatchery</text><circle cx="98" cy="104" r="5" fill="#fff" stroke="#B86E12" stroke-width="2"/><text x="98" y="88" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">16 wk</text><text x="98" y="126" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">light up</text><text x="98" y="138" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">to 14 h</text><circle cx="170" cy="104" r="5" fill="#fff" stroke="#B86E12" stroke-width="2"/><text x="170" y="88" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">20 wk</text><text x="170" y="126" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">move into</text><text x="170" y="138" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">cages</text><circle cx="242" cy="104" r="5" fill="#fff" stroke="#B86E12" stroke-width="2"/><text x="242" y="88" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">22–24 wk</text><text x="242" y="126" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">first</text><text x="242" y="138" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">eggs</text><circle cx="314" cy="104" r="5" fill="#fff" stroke="#B86E12" stroke-width="2"/><text x="314" y="88" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">~80 wk</text><text x="314" y="126" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">end of lay,</text><text x="314" y="138" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">sold</text><text x="278" y="64" font-size="10.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">lays 12–14 months</text><text x="170" y="172" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="600">250–270 eggs a year, about one egg per 24 h</text><text x="170" y="192" font-size="11" text-anchor="middle" fill="#7A4E2D" font-weight="600">Local hen: about 40 eggs a year, then broods</text></svg>
