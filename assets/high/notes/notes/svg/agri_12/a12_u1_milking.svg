<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 262" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Hygienic milking, step by step</text><g data-s="k1 k2 k3 k4 k5"><rect x="20" y="28" width="300" height="36" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.8"/><text x="170" y="43" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Wash the udder with warm water (starts milk</text><text x="170" y="57" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">let-down)</text></g><g data-s="k2 k3 k4 k5"><rect x="20" y="76" width="300" height="36" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.8"/><text x="170" y="98" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Dry each teat; one towel per cow</text><line x1="170" y1="65" x2="170" y2="74" stroke="#3E3129" stroke-width="1.8" stroke-linecap="round"/><path d="M170 74 L167.3 67.6 L172.7 67.6 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g><g data-s="k3 k4 k5"><rect x="20" y="124" width="300" height="36" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.8"/><text x="170" y="139" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Strip the first milk into a strip cup: clots</text><text x="170" y="153" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">= mastitis</text><line x1="170" y1="113" x2="170" y2="122" stroke="#3E3129" stroke-width="1.8" stroke-linecap="round"/><path d="M170 122 L167.3 115.6 L172.7 115.6 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g><g data-s="k4 k5"><rect x="20" y="172" width="300" height="36" rx="8" fill="#ECE6F5" stroke="#6A4C9C" stroke-width="1.8"/><text x="170" y="194" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Milk quickly by hand or machine (12 h apart)</text><line x1="170" y1="161" x2="170" y2="170" stroke="#3E3129" stroke-width="1.8" stroke-linecap="round"/><path d="M170 170 L167.3 163.6 L172.7 163.6 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g><g data-s="k5"><rect x="20" y="220" width="300" height="36" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="170" y="235" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Dip the teats in disinfectant, then release</text><text x="170" y="249" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">the cow</text><line x1="170" y1="209" x2="170" y2="218" stroke="#3E3129" stroke-width="1.8" stroke-linecap="round"/><path d="M170 218 L167.3 211.6 L172.7 211.6 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g></svg>
