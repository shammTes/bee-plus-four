<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" font-family="HighNunito"><text x="170" y="16" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">Agronomic (biological) measures on cropland</text><rect x="6" y="30" width="160" height="62" rx="6" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.2"/><text x="86" y="48" font-size="11.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">Mulch</text><text x="86" y="65.4" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">straw on the surface: less</text><text x="86" y="77.6" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">splash and evaporation</text><rect x="174" y="30" width="160" height="62" rx="6" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.2"/><text x="254" y="48" font-size="11.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">Cover crop</text><text x="254" y="71.5" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">legume covers bare soil</text><rect x="6" y="100" width="160" height="62" rx="6" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.2"/><text x="86" y="118" font-size="11.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">Contour strips</text><text x="86" y="135.4" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">grass strip, then crop,</text><text x="86" y="147.6" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">along contour</text><rect x="174" y="100" width="160" height="62" rx="6" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.2"/><text x="254" y="118" font-size="11.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">Trash lines</text><text x="254" y="135.4" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">crop residue lines on the</text><text x="254" y="147.6" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">contour</text><rect x="6" y="170" width="160" height="62" rx="6" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.2"/><text x="86" y="188" font-size="11.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">Rotation / intercropping</text><text x="86" y="211.5" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">cover and fertility</text><rect x="174" y="170" width="160" height="62" rx="6" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.2"/><text x="254" y="188" font-size="11.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">Manure + fertiliser</text><text x="254" y="205.4" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">more organic matter and</text><text x="254" y="217.6" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">growth</text></svg>
