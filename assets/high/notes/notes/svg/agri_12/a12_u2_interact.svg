<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 262" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">How two species affect each other</text><text x="124" y="40" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">A</text><text x="152" y="40" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">B</text><rect x="6" y="50" width="328" height="28" rx="5" fill="#FBF7F0" stroke="#8A7F76" stroke-width="0.8"/><text x="12" y="68" font-size="11.5" fill="#3E3129" font-weight="800">Mutualism</text><circle cx="124" cy="64" r="10" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.6"/><text x="124" y="69" font-size="14" text-anchor="middle" fill="#2A7A6B" font-weight="800">+</text><circle cx="152" cy="64" r="10" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.6"/><text x="152" y="69" font-size="14" text-anchor="middle" fill="#2A7A6B" font-weight="800">+</text><text x="170" y="61.4" font-size="10" fill="#3E3129" font-weight="600">sagla fig and its wasp</text><text x="170" y="73.6" font-size="10" fill="#3E3129" font-weight="600">pollinator</text><rect x="6" y="84" width="328" height="28" rx="5" fill="#FBF7F0" stroke="#8A7F76" stroke-width="0.8"/><text x="12" y="102" font-size="11.5" fill="#3E3129" font-weight="800">Commensalism</text><circle cx="124" cy="98" r="10" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.6"/><text x="124" y="103" font-size="14" text-anchor="middle" fill="#2A7A6B" font-weight="800">+</text><circle cx="152" cy="98" r="10" fill="#F1EEEA" stroke="#8A7F76" stroke-width="1.6"/><text x="152" y="103" font-size="14" text-anchor="middle" fill="#8A7F76" font-weight="800">0</text><text x="170" y="101.5" font-size="10" fill="#3E3129" font-weight="600">a bird nesting in a tree</text><rect x="6" y="118" width="328" height="28" rx="5" fill="#FBF7F0" stroke="#8A7F76" stroke-width="0.8"/><text x="12" y="136" font-size="11.5" fill="#3E3129" font-weight="800">Antagonism</text><circle cx="124" cy="132" r="10" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.6"/><text x="124" y="137" font-size="14" text-anchor="middle" fill="#2A7A6B" font-weight="800">+</text><circle cx="152" cy="132" r="10" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.6"/><text x="152" y="137" font-size="14" text-anchor="middle" fill="#C24E32" font-weight="800">−</text><text x="170" y="129.4" font-size="10" fill="#3E3129" font-weight="600">tick on a cow; fox eating a</text><text x="170" y="141.6" font-size="10" fill="#3E3129" font-weight="600">lamb</text><rect x="6" y="152" width="328" height="28" rx="5" fill="#FBF7F0" stroke="#8A7F76" stroke-width="0.8"/><text x="12" y="170" font-size="11.5" fill="#3E3129" font-weight="800">Neutralism</text><circle cx="124" cy="166" r="10" fill="#F1EEEA" stroke="#8A7F76" stroke-width="1.6"/><text x="124" y="171" font-size="14" text-anchor="middle" fill="#8A7F76" font-weight="800">0</text><circle cx="152" cy="166" r="10" fill="#F1EEEA" stroke="#8A7F76" stroke-width="1.6"/><text x="152" y="171" font-size="14" text-anchor="middle" fill="#8A7F76" font-weight="800">0</text><text x="170" y="169.5" font-size="10" fill="#3E3129" font-weight="600">neither is affected</text><rect x="6" y="186" width="328" height="28" rx="5" fill="#FBF7F0" stroke="#8A7F76" stroke-width="0.8"/><text x="12" y="204" font-size="11.5" fill="#3E3129" font-weight="800">Amensalism</text><circle cx="124" cy="200" r="10" fill="#F1EEEA" stroke="#8A7F76" stroke-width="1.6"/><text x="124" y="205" font-size="14" text-anchor="middle" fill="#8A7F76" font-weight="800">0</text><circle cx="152" cy="200" r="10" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.6"/><text x="152" y="205" font-size="14" text-anchor="middle" fill="#C24E32" font-weight="800">−</text><text x="170" y="197.4" font-size="10" fill="#3E3129" font-weight="600">one is harmed, the other</text><text x="170" y="209.6" font-size="10" fill="#3E3129" font-weight="600">unaffected</text><rect x="6" y="220" width="328" height="28" rx="5" fill="#FBF7F0" stroke="#8A7F76" stroke-width="0.8"/><text x="12" y="238" font-size="11.5" fill="#3E3129" font-weight="800">Competition</text><circle cx="124" cy="234" r="10" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.6"/><text x="124" y="239" font-size="14" text-anchor="middle" fill="#C24E32" font-weight="800">−</text><circle cx="152" cy="234" r="10" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.6"/><text x="152" y="239" font-size="14" text-anchor="middle" fill="#C24E32" font-weight="800">−</text><text x="170" y="231.4" font-size="10" fill="#3E3129" font-weight="600">weeds and crops for light,</text><text x="170" y="243.6" font-size="10" fill="#3E3129" font-weight="600">water</text></svg>
