<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Four kinds of drainage</text><rect x="6" y="28" width="160" height="108" rx="6" fill="#F7FAFD" stroke="#8A7F76" stroke-width="1"/><text x="86" y="44" font-size="12" text-anchor="middle" fill="#2F5F8F" font-weight="800">Surface</text><text x="86" y="130" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">open ditches; land shaped to slope</text><rect x="12" y="78" width="148" height="40" fill="#B98A5E"/><rect x="12" y="102" width="148" height="16" fill="#9CC3E6"/><path d="M36 78 L42 92 L50 92 L56 78" fill="#9CC3E6" stroke="#5A3A1E" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M116 78 L122 92 L130 92 L136 78" fill="#9CC3E6" stroke="#5A3A1E" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><rect x="174" y="28" width="160" height="108" rx="6" fill="#F7FAFD" stroke="#8A7F76" stroke-width="1"/><text x="254" y="44" font-size="12" text-anchor="middle" fill="#2F5F8F" font-weight="800">Sub-surface</text><text x="254" y="130" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">buried perforated pipes</text><rect x="180" y="78" width="148" height="40" fill="#B98A5E"/><rect x="180" y="102" width="148" height="16" fill="#9CC3E6"/><circle cx="214" cy="100" r="5" fill="#FFF" stroke="#333" stroke-width="1.4"/><circle cx="254" cy="100" r="5" fill="#FFF" stroke="#333" stroke-width="1.4"/><circle cx="294" cy="100" r="5" fill="#FFF" stroke="#333" stroke-width="1.4"/><rect x="6" y="144" width="160" height="108" rx="6" fill="#F7FAFD" stroke="#8A7F76" stroke-width="1"/><text x="86" y="160" font-size="12" text-anchor="middle" fill="#2F5F8F" font-weight="800">Vertical</text><text x="86" y="246" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">pump from dug or tube wells</text><rect x="12" y="194" width="148" height="40" fill="#B98A5E"/><rect x="12" y="218" width="148" height="16" fill="#9CC3E6"/><rect x="80" y="174" width="12" height="60" fill="#C9C9C9" stroke="#555" stroke-width="1.2"/><line x1="86" y1="180" x2="86" y2="168" stroke="#2F5F8F" stroke-width="1.6" stroke-linecap="round"/><path d="M86 168 L87.9 172.6 L84.1 172.6 Z" fill="#2F5F8F" stroke="#2F5F8F" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="174" y="144" width="160" height="108" rx="6" fill="#F7FAFD" stroke="#8A7F76" stroke-width="1"/><text x="254" y="160" font-size="12" text-anchor="middle" fill="#2F5F8F" font-weight="800">Bio-drainage</text><text x="254" y="246" font-size="9.5" text-anchor="middle" fill="#3E3129" font-weight="600">thirsty trees, e.g. eucalyptus</text><rect x="180" y="194" width="148" height="40" fill="#B98A5E"/><rect x="180" y="218" width="148" height="16" fill="#9CC3E6"/><path d="M221 194 L222 177.5 L226 177.5 L227 194Z" fill="#6B4A2B"/><circle cx="224" cy="172.4" r="9" fill="#4E8B3A" stroke="#3B6E2C" stroke-width="1"/><path d="M224 194 L218 222 M224 194 L230 224" fill="none" stroke="#7A4E2D" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M281 194 L282 177.5 L286 177.5 L287 194Z" fill="#6B4A2B"/><circle cx="284" cy="172.4" r="9" fill="#4E8B3A" stroke="#3B6E2C" stroke-width="1"/><path d="M284 194 L278 222 M284 194 L290 224" fill="none" stroke="#7A4E2D" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
