<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 270" font-family="HighNunito"><rect x="110" y="6" width="120" height="28" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.8"/><text x="170" y="24.6" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Breeding</text><rect x="6" y="54" width="156" height="44" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.8"/><text x="84" y="73" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Selection: keep the</text><text x="84" y="87" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">best, CULL the poor</text><rect x="178" y="54" width="156" height="44" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.8"/><text x="256" y="73" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Cross-breeding: bring</text><text x="256" y="87" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">in better genes</text><line x1="170" y1="34" x2="84" y2="53" stroke="#3E3129" stroke-width="1.4" stroke-linecap="round"/><line x1="170" y1="34" x2="256" y2="53" stroke="#3E3129" stroke-width="1.4" stroke-linecap="round"/><text x="84" y="112" font-size="10.5" text-anchor="middle" fill="#8A7F76" font-weight="600">first step; keeps adapted</text><text x="84" y="125" font-size="10.5" text-anchor="middle" fill="#8A7F76" font-weight="600">local breeds</text><text x="256" y="112" font-size="10.5" text-anchor="middle" fill="#8A7F76" font-weight="600">exotic bull or AI;</text><text x="256" y="125" font-size="10.5" text-anchor="middle" fill="#8A7F76" font-weight="600">must improve the environment</text><text x="170" y="152" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Systems of mating</text><rect x="6" y="164" width="156" height="34" rx="8" fill="#ECE6F5" stroke="#6A4C9C" stroke-width="1.8"/><text x="84" y="178" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">INbreeding: related</text><text x="84" y="192" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">animals</text><rect x="178" y="164" width="156" height="34" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="256" y="185" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">OUTbreeding: unrelated</text><text x="84" y="223.1" font-size="11" text-anchor="middle" fill="#6A4C9C" font-weight="600">close-breeding</text><text x="84" y="236.6" font-size="11" text-anchor="middle" fill="#6A4C9C" font-weight="600">line-breeding</text><text x="256" y="220.4" font-size="11" text-anchor="middle" fill="#C24E32" font-weight="600">out-crossing, grading up,</text><text x="256" y="233.8" font-size="11" text-anchor="middle" fill="#C24E32" font-weight="600">cross-breeding,</text><text x="256" y="247.3" font-size="11" text-anchor="middle" fill="#C24E32" font-weight="600">species hybridisation</text></svg>
