<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Why wildlife declines</text><rect x="6" y="28" width="160" height="26" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="86" y="44.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Habitat loss</text><text x="86" y="68" font-size="9.5" text-anchor="middle" fill="#8A7F76" font-weight="600">farms, settlements, fragmentation</text><rect x="174" y="28" width="160" height="26" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="254" y="44.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Hunting / overkill</text><text x="254" y="68" font-size="9.5" text-anchor="middle" fill="#8A7F76" font-weight="600">faster than animals breed</text><rect x="6" y="82" width="160" height="26" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="86" y="98.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Illegal trade</text><text x="86" y="122" font-size="9.5" text-anchor="middle" fill="#8A7F76" font-weight="600">pets, &quot;medicine&quot; parts</text><rect x="174" y="82" width="160" height="26" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="254" y="98.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Alien species</text><text x="254" y="122" font-size="9.5" text-anchor="middle" fill="#8A7F76" font-weight="600">mesquite, beles crowd out natives</text><rect x="6" y="136" width="160" height="26" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="86" y="152.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">War</text><text x="86" y="176" font-size="9.5" text-anchor="middle" fill="#8A7F76" font-weight="600">fire, cutting, hunting, flight</text><rect x="174" y="136" width="160" height="26" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="254" y="152.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Cultural beliefs</text><text x="254" y="176" font-size="9.5" text-anchor="middle" fill="#8A7F76" font-weight="600">e.g. killing snakes</text><rect x="6" y="190" width="160" height="26" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.8"/><text x="86" y="206.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Recurrent drought</text><text x="86" y="230" font-size="9.5" text-anchor="middle" fill="#8A7F76" font-weight="600">water sources dry up</text><rect x="174" y="190" width="160" height="26" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.8"/><text x="254" y="206.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">Chain extinction</text><text x="254" y="230" font-size="9.5" text-anchor="middle" fill="#8A7F76" font-weight="600">one loss pulls down another</text></svg>
