<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Measuring slope</text><path d="M30 170 L290 170 L290 70 Z" fill="#F3E9DC" stroke="#3E3129" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M280 170 L280 160 L290 160" fill="none" stroke="#3E3129" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="160" y="188" font-size="11" text-anchor="middle" fill="#2F5F8F" font-weight="800">HI = horizontal interval = 50 m</text><text x="284" y="124" font-size="11" text-anchor="end" fill="#C24E32" font-weight="800">VI = 10 m</text><path d="M67.3 155.6 A40 40 0 0 1 70 170" fill="none" stroke="#B86E12" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="80.1" y="164.9" font-size="12" text-anchor="middle" fill="#B86E12" font-weight="800">θ</text><text x="110" y="82.4" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">% slope = VI ÷ HI × 100</text><text x="110" y="95.8" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">= 10 ÷ 50 × 100 = 20 %</text><text x="110" y="109.3" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">ratio 1 : 5,  θ ≈ 11.3°</text><text x="170" y="212" font-size="10.5" text-anchor="middle" fill="#8A7F76" font-weight="600">0–8 % gentle · 8–30 % hilly · &gt; 30 % steep</text></svg>
