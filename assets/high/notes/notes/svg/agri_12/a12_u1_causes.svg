<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" font-family="HighNunito"><rect x="100" y="6" width="140" height="28" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="170" y="24.4" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Infectious disease</text><rect x="6" y="50" width="160" height="30" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.8"/><text x="86" y="69.2" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">Bacteria</text><text x="86" y="101.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">TB, brucellosis, anthrax</text><rect x="174" y="50" width="160" height="30" rx="8" fill="#ECE6F5" stroke="#6A4C9C" stroke-width="1.8"/><text x="254" y="69.2" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">Viruses</text><text x="254" y="101.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">FMD, rabies</text><rect x="6" y="124" width="160" height="30" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.8"/><text x="86" y="143.2" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">Fungi</text><text x="86" y="175.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">ringworm, moulds</text><rect x="174" y="124" width="160" height="30" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.8"/><text x="254" y="143.2" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">Protozoa</text><text x="254" y="175.7" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">babesiosis (ticks)</text><rect x="6" y="198" width="160" height="30" rx="8" fill="#fff" stroke="#7A4E2D" stroke-width="1.8"/><text x="86" y="217.2" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">Endoparasites</text><text x="86" y="243.3" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">roundworms, tapeworms,</text><text x="86" y="256.1" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">flukes</text><rect x="174" y="198" width="160" height="30" rx="8" fill="#F1EEEA" stroke="#8A7F76" stroke-width="1.8"/><text x="254" y="217.2" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">Ectoparasites</text><text x="254" y="243.3" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">ticks, mites, lice, fleas,</text><text x="254" y="256.1" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">flies</text><text x="170" y="274" font-size="11.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">Prevention is cheaper than cure</text></svg>
