<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 178" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Restraining cattle</text><rect x="6" y="26" width="108" height="30" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="60" y="45" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Nose ring</text><text x="122" y="38.3" font-size="10.5" fill="#3E3129" font-weight="600">iron ring through the nasal</text><text x="122" y="51.1" font-size="10.5" fill="#3E3129" font-weight="600">septum; rope controls a bull</text><rect x="6" y="63" width="108" height="30" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.8"/><text x="60" y="82" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Bull holder</text><text x="122" y="75.3" font-size="10.5" fill="#3E3129" font-weight="600">clamp on the septum when there is</text><text x="122" y="88.1" font-size="10.5" fill="#3E3129" font-weight="600">no ring</text><rect x="6" y="100" width="108" height="30" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.8"/><text x="60" y="119" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Milkman's rope</text><text x="122" y="112.3" font-size="10.5" fill="#3E3129" font-weight="600">ties the hind legs (and tail) so</text><text x="122" y="125.1" font-size="10.5" fill="#3E3129" font-weight="600">the cow cannot kick</text><rect x="6" y="137" width="108" height="30" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.8"/><text x="60" y="156" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Gag</text><text x="122" y="149.3" font-size="10.5" fill="#3E3129" font-weight="600">keeps jaws open: dosing, stomach</text><text x="122" y="162.1" font-size="10.5" fill="#3E3129" font-weight="600">tube</text></svg>
