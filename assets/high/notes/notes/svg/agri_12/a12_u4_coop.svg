<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 270" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Seven co-operative principles</text><circle cx="22" cy="43" r="12" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.4"/><text x="22" y="47" font-size="11" text-anchor="middle" fill="#2F5F8F" font-weight="800">1</text><text x="42" y="47" font-size="11" fill="#3E3129" font-weight="800">Voluntary and open membership</text><circle cx="22" cy="76" r="12" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.4"/><text x="22" y="80" font-size="11" text-anchor="middle" fill="#2A7A6B" font-weight="800">2</text><text x="42" y="80" font-size="11" fill="#3E3129" font-weight="800">Democratic control: one member, one vote</text><circle cx="22" cy="109" r="12" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.4"/><text x="22" y="113" font-size="11" text-anchor="middle" fill="#B86E12" font-weight="800">3</text><text x="42" y="113" font-size="11" fill="#3E3129" font-weight="800">Member economic participation</text><circle cx="22" cy="142" r="12" fill="#ECE6F5" stroke="#6A4C9C" stroke-width="1.4"/><text x="22" y="146" font-size="11" text-anchor="middle" fill="#6A4C9C" font-weight="800">4</text><text x="42" y="146" font-size="11" fill="#3E3129" font-weight="800">Autonomy and independence</text><circle cx="22" cy="175" r="12" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.4"/><text x="22" y="179" font-size="11" text-anchor="middle" fill="#2F5F8F" font-weight="800">5</text><text x="42" y="179" font-size="11" fill="#3E3129" font-weight="800">Education, training, information</text><circle cx="22" cy="208" r="12" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.4"/><text x="22" y="212" font-size="11" text-anchor="middle" fill="#2A7A6B" font-weight="800">6</text><text x="42" y="212" font-size="11" fill="#3E3129" font-weight="800">Co-operation among co-operatives</text><circle cx="22" cy="241" r="12" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.4"/><text x="22" y="245" font-size="11" text-anchor="middle" fill="#B86E12" font-weight="800">7</text><text x="42" y="245" font-size="11" fill="#3E3129" font-weight="800">Concern for community</text></svg>
