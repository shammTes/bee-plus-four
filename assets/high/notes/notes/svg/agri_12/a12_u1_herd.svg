<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 232" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Classes on a dairy farm</text><rect x="8" y="28" width="96" height="40" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.8"/><text x="56" y="52.4" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Calf</text><text x="112" y="45.3" font-size="10.5" fill="#3E3129" font-weight="600">milk from a bucket; weaned at 2</text><text x="112" y="58.1" font-size="10.5" fill="#3E3129" font-weight="600">months / 70–80 kg</text><rect x="8" y="78" width="96" height="40" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.8"/><text x="56" y="102.4" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Heifer</text><text x="112" y="95.3" font-size="10.5" fill="#3E3129" font-weight="600">mature female, not yet calved: the</text><text x="112" y="108.1" font-size="10.5" fill="#3E3129" font-weight="600">replacements</text><rect x="8" y="128" width="96" height="40" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.8"/><text x="56" y="152.4" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Milking cow</text><text x="112" y="145.3" font-size="10.5" fill="#3E3129" font-weight="600">milked 2 × a day, 12 h apart;</text><text x="112" y="158.1" font-size="10.5" fill="#3E3129" font-weight="600">dried off at 7 months pregnant</text><rect x="8" y="178" width="96" height="40" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="56" y="202.4" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Bull</text><text x="112" y="195.3" font-size="10.5" fill="#3E3129" font-weight="600">1 bull for 30–40 cows; change him</text><text x="112" y="208.1" font-size="10.5" fill="#3E3129" font-weight="600">after 2 years</text></svg>
