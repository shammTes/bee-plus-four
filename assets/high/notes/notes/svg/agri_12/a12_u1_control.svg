<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 290" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Controlling an outbreak</text><rect x="6" y="26" width="108" height="30" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.8"/><text x="60" y="45" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Isolation</text><text x="122" y="44.7" font-size="10.5" fill="#3E3129" font-weight="600">separate sick or suspected animals</text><rect x="6" y="63" width="108" height="30" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.8"/><text x="60" y="82" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Quarantine</text><text x="122" y="75.3" font-size="10.5" fill="#3E3129" font-weight="600">hold NEW or exposed animals (e.g.</text><text x="122" y="88.1" font-size="10.5" fill="#3E3129" font-weight="600">14 days)</text><rect x="6" y="100" width="108" height="30" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.8"/><text x="60" y="119" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Disinfection</text><text x="122" y="112.3" font-size="10.5" fill="#3E3129" font-weight="600">clean first, then disinfect for 24</text><text x="122" y="125.1" font-size="10.5" fill="#3E3129" font-weight="600">h</text><rect x="6" y="137" width="108" height="30" rx="8" fill="#ECE6F5" stroke="#6A4C9C" stroke-width="1.8"/><text x="60" y="156" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Destruction</text><text x="122" y="155.7" font-size="10.5" fill="#3E3129" font-weight="600">animals that will not recover</text><rect x="6" y="174" width="108" height="30" rx="8" fill="#fff" stroke="#7A4E2D" stroke-width="1.8"/><text x="60" y="193" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Disposal</text><text x="122" y="192.7" font-size="10.5" fill="#3E3129" font-weight="600">bury deep or burn carcasses</text><rect x="6" y="211" width="108" height="30" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.8"/><text x="60" y="230" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Notification</text><text x="122" y="229.7" font-size="10.5" fill="#3E3129" font-weight="600">tell the veterinary office</text><rect x="6" y="248" width="108" height="30" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.8"/><text x="60" y="267" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">Immunisation</text><text x="122" y="266.7" font-size="10.5" fill="#3E3129" font-weight="600">vaccinate the healthy herd</text></svg>
