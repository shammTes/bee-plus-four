<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 236" font-family="HighNunito"><rect x="6" y="6" width="160" height="224" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.6"/><rect x="174" y="6" width="160" height="224" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.6"/><text x="86" y="26" font-size="12.5" text-anchor="middle" fill="#B86E12" font-weight="800">NATURAL</text><text x="254" y="26" font-size="12.5" text-anchor="middle" fill="#C24E32" font-weight="800">HUMAN-MADE</text><text x="86" y="56" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">intense, erratic rain</text><text x="86" y="86" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">steep slopes</text><text x="86" y="116" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">erodible sandy / silty soils</text><text x="86" y="146" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">drought, strong wind</text><text x="86" y="176" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">shallow soils</text><text x="254" y="56" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">over-cultivation, no fallow</text><text x="254" y="86" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">overgrazing</text><text x="254" y="116" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">deforestation</text><text x="254" y="146" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">dung + residues burnt as fuel</text><text x="254" y="176" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">ploughing up and down slope</text><text x="254" y="206" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">poverty, insecure tenure</text></svg>
