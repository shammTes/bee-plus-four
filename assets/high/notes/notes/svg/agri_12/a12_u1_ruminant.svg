<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 262" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Four-compartment stomach of a cow</text><g data-s="k1 k2 k3 k4 k5"><path d="M150 30 L174 66" fill="none" stroke="#8A5A44" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="144" y="34" font-size="10.5" text-anchor="end" fill="#8A7F76" font-weight="600">oesophagus</text></g><g data-hl="k1"><path d="M30 90 C30 60 160 56 170 80 C182 120 176 196 120 206 C64 214 26 190 28 150 Z" fill="#E7C9A6" stroke="#7A4E2D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="100" y="132" font-size="14" text-anchor="middle" fill="#7A4E2D" font-weight="800">RUMEN</text><text x="100" y="150" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">80 % of adult stomach</text><text x="100" y="164" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="600">microbes ferment fibre</text></g><g data-hl="k2"><circle cx="206" cy="84" r="22" fill="#F0D5B5" stroke="#7A4E2D" stroke-width="2"/><rect x="193" y="72" width="8" height="7" fill="none" stroke="#B88A66" stroke-width="0.8"/><rect x="202" y="72" width="8" height="7" fill="none" stroke="#B88A66" stroke-width="0.8"/><rect x="211" y="72" width="8" height="7" fill="none" stroke="#B88A66" stroke-width="0.8"/><rect x="193" y="80" width="8" height="7" fill="none" stroke="#B88A66" stroke-width="0.8"/><rect x="202" y="80" width="8" height="7" fill="none" stroke="#B88A66" stroke-width="0.8"/><rect x="211" y="80" width="8" height="7" fill="none" stroke="#B88A66" stroke-width="0.8"/><rect x="193" y="88" width="8" height="7" fill="none" stroke="#B88A66" stroke-width="0.8"/><rect x="202" y="88" width="8" height="7" fill="none" stroke="#B88A66" stroke-width="0.8"/><rect x="211" y="88" width="8" height="7" fill="none" stroke="#B88A66" stroke-width="0.8"/><text x="236" y="66" font-size="11.5" fill="#7A4E2D" font-w