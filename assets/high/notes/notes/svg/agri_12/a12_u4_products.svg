<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" font-family="HighNunito"><text x="170" y="16" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Five product–product relationships</text><rect x="4" y="28" width="332" height="40" rx="6" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.2"/><text x="12" y="45" font-size="11.5" fill="#C24E32" font-weight="800">Competitive</text><text x="12" y="60" font-size="9.5" fill="#3E3129" font-weight="600">compete for the same land/labour</text><text x="328" y="52" font-size="9.5" text-anchor="end" fill="#8A7F76" font-weight="600">barley vs wheat</text><rect x="4" y="74" width="332" height="40" rx="6" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.2"/><text x="12" y="91" font-size="11.5" fill="#2F5F8F" font-weight="800">Joint</text><text x="12" y="106" font-size="9.5" fill="#3E3129" font-weight="600">one cannot be made without the other</text><text x="328" y="98" font-size="9.5" text-anchor="end" fill="#8A7F76" font-weight="600">wheat + straw; beef + hide</text><rect x="4" y="120" width="332" height="40" rx="6" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.2"/><text x="12" y="137" font-size="11.5" fill="#2A7A6B" font-weight="800">Complementary</text><text x="12" y="152" font-size="9.5" fill="#3E3129" font-weight="600">more of one raises the other</text><text x="328" y="144" font-size="9.5" text-anchor="end" fill="#8A7F76" font-weight="600">beans before maize</text><rect x="4" y="166" width="332" height="40" rx="6" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.2"/><text x="12" y="183" font-size="11.5" fill="#B86E12" font-weight="800">Supplementary</text><text x="12" y="198" font-size="9.5" fill="#3E3129" font-weight="600">one does not affect the other</text><text x="328" y="190" font-size="9.5" text-anchor="end" fill="#8A7F76" font-weight="600">maize and poultry</text><rect x="4" y="212" width="332" height="40" rx="6" fill="#ECE6F5" stroke="#6A4C9C" stroke-width="1.2"/><text x="12" y="229" font-size="11.5" fill="#6A4C9C" font-weight="800">Antagonistic</text><text x="12" y="244" font-size="9.5" fill="#3E3129" font-weight="600">one harms the other</text><text x="328" y="236" font-size="9.5" text-anchor="end" fill="#8A7F76" font-weight="600">free-roaming goats and vegetables</text></svg>
