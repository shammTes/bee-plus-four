<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Pig: a monogastric (one-stomach) tract</text><rect x="16" y="28" width="120" height="25" rx="6" fill="#F3D1C2" stroke="#7A4E2D" stroke-width="1.2"/><text x="76" y="45" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Mouth</text><text x="144" y="45" font-size="10.5" fill="#3E3129" font-weight="600">teeth chew; saliva starts starch digestion</text><rect x="16" y="59" width="120" height="25" rx="6" fill="#EAC0AE" stroke="#7A4E2D" stroke-width="1.2"/><text x="76" y="76" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Oesophagus</text><text x="144" y="76" font-size="10.5" fill="#3E3129" font-weight="600">muscle waves push food</text><line x1="76" y1="53" x2="76" y2="58" stroke="#3E3129" stroke-width="1.3" stroke-linecap="round"/><path d="M76 58 L74.4 54.3 L77.6 54.3 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="16" y="90" width="120" height="25" rx="6" fill="#E9B8A3" stroke="#7A4E2D" stroke-width="1.2"/><text x="76" y="107" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Stomach</text><text x="144" y="107" font-size="10.5" fill="#3E3129" font-weight="600">acid + enzymes (cardiac / pyloric valves)</text><line x1="76" y1="84" x2="76" y2="89" stroke="#3E3129" stroke-width="1.3" stroke-linecap="round"/><path d="M76 89 L74.4 85.3 L77.6 85.3 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="16" y="121" width="120" height="25" rx="6" fill="#E7A893" stroke="#7A4E2D" stroke-width="1.2"/><text x="76" y="138" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Duodenum</text><text x="144" y="138" font-size="10.5" fill="#3E3129" font-weight="600">bile (liver) + pancreatic juice</text><line x1="76" y1="115" x2="76" y2="120" stroke="#3E3129" stroke-width="1.3" stroke-linecap="round"/><path d="M76 120 L74.4 116.3 L77.6 116.3 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="16" y="152" width="120" height="25" rx="6" fill="#E39C86" stroke="#7A4E2D" stroke-width="1.2"/><text x="76" y="169" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Jejunum + ileum</text><text x="144" y="169" font-size="10.5" fill="#3E3129" font-weight="600">most nutrients absorbed</text><line x1="76" y1="146" x2="76" y2="151" stroke="#3E3129" stroke-width="1.3" stroke-linecap="round"/><path d="M76 151 L74.4 147.3 L77.6 147.3 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="16" y="183" width="120" height="25" rx="6" fill="#D9C3A0" stroke="#7A4E2D" stroke-width="1.2"/><text x="76" y="200" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Large intestine</text><text x="144" y="200" font-size="10.5" fill="#3E3129" font-weight="600">caecum, colon: water absorbed</text><line x1="76" y1="177" x2="76" y2="182" stroke="#3E3129" stroke-width="1.3" stroke-linecap="round"/><path d="M76 182 L74.4 178.3 L77.6 178.3 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="16" y="214" width="120" height="25" rx="6" fill="#CDB794" stroke="#7A4E2D" stroke-width="1.2"/><text x="76" y="231" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="800">Rectum + anus</text><text x="144" y="231" font-size="10.5" fill="#3E3129" font-weight="600">faeces leave the body</text><line x1="76" y1="208" x2="76" y2="213" stroke="#3E3129" stroke-width="1.3" stroke-linecap="round"/><path d="M76 213 L74.4 209.3 L77.6 209.3 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="170" y="252" font-size="11" text-anchor="middle" fill="#2A7A6B" font-weight="800">Like humans: needs grain, little fibre</text></svg>
