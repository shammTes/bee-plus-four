<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Three financial statements</text><rect x="4" y="30" width="332" height="60" rx="6" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.3"/><text x="12" y="49" font-size="12" fill="#2F5F8F" font-weight="800">Balance sheet</text><text x="328" y="49" font-size="9.5" text-anchor="end" fill="#3E3129" font-weight="800">a snapshot on ONE date</text><text x="12" y="72" font-size="10" fill="#3E3129" font-weight="600">what is owned and owed; net worth</text><rect x="4" y="96" width="332" height="60" rx="6" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.3"/><text x="12" y="115" font-size="12" fill="#2A7A6B" font-weight="800">Income statement</text><text x="328" y="115" font-size="9.5" text-anchor="end" fill="#3E3129" font-weight="800">over a PERIOD</text><text x="12" y="138" font-size="10" fill="#3E3129" font-weight="600">revenue − expenses = net income (profit)</text><rect x="4" y="162" width="332" height="60" rx="6" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.3"/><text x="12" y="181" font-size="12" fill="#B86E12" font-weight="800">Cash-flow statement</text><text x="328" y="181" font-size="9.5" text-anchor="end" fill="#3E3129" font-weight="800">month by month, CASH only</text><text x="12" y="204" font-size="10" fill="#3E3129" font-weight="600">cash in − cash out = bank balance; no depreciation</text></svg>
