<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" font-family="HighNunito"><rect x="90" y="6" width="160" height="28" rx="8" fill="#fff" stroke="#7A4E2D" stroke-width="1.8"/><text x="170" y="24.4" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Soil degradation</text><rect x="6" y="54" width="104" height="28" rx="8" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.8"/><text x="58" y="72.2" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">Physical</text><line x1="170" y1="34" x2="58" y2="53" stroke="#8A7F76" stroke-width="1.1" stroke-linecap="round"/><text x="58" y="101.4" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">erosion (water,</text><text x="58" y="113.6" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">wind)</text><text x="58" y="131.4" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">compaction, hard</text><text x="58" y="143.6" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">pans</text><text x="58" y="161.4" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">crusting, poor</text><text x="58" y="173.6" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">structure</text><rect x="118" y="54" width="104" height="28" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.8"/><text x="170" y="72.2" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">Chemical</text><line x1="170" y1="34" x2="170" y2="53" stroke="#8A7F76" stroke-width="1.1" stroke-linecap="round"/><text x="170" y="95.3" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">nutrient +</text><text x="170" y="107.5" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">organic matter</text><text x="170" y="119.7" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">loss</text><text x="170" y="137.5" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">salinisation</text><text x="170" y="161.4" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">nutrients fixed</text><text x="170" y="173.6" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">(alkaline)</text><text x="170" y="197.5" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">laterisation</text><rect x="230" y="54" width="104" height="28" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.8"/><text x="282" y="72.2" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">Biological</text><line x1="170" y1="34" x2="282" y2="53" stroke="#8A7F76" stroke-width="1.1" stroke-linecap="round"/><text x="282" y="101.4" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">organic matter &lt;</text><text x="282" y="113.6" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">1 %</text><text x="282" y="137.5" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">fewer soil fauna</text><text x="282" y="161.4" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">less microbial</text><text x="282" y="173.6" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="600">life</text></svg>
