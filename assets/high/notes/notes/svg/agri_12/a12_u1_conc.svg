<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" font-family="HighNunito"><text x="170" y="16" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">Concentrate for a cow giving 14 L/day</text><line x1="40" y1="190" x2="320" y2="190" stroke="#3E3129" stroke-width="1.4" stroke-linecap="round"/><rect x="60" y="140" width="70" height="50" rx="3" fill="#E8CF96" stroke="#7A4E2D" stroke-width="1.4"/><text x="95" y="158" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">5 L</text><text x="95" y="204" font-size="10.5" text-anchor="middle" fill="#8A7F76" font-weight="600">from roughage</text><rect x="60" y="50" width="70" height="90" rx="3" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.4"/><text x="95" y="95" font-size="12" text-anchor="middle" fill="#2A7A6B" font-weight="800">9 L extra</text><text x="250" y="70" font-size="15" text-anchor="middle" fill="#3E3129" font-weight="800">9 ÷ 1.5 = 6</text><text x="250" y="92" font-size="13" text-anchor="middle" fill="#2A7A6B" font-weight="800">6 kg concentrate</text><text x="250" y="112" font-size="11" text-anchor="middle" fill="#8A7F76" font-weight="600">per day</text><text x="250" y="150" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="600">Rule: 1 kg for every</text><text x="250" y="165" font-size="11" text-anchor="middle" fill="#3E3129" font-weight="600">1.5 L above 5 L</text><line x1="140" y1="95" x2="196" y2="80" stroke="#8A7F76" stroke-width="1.4" stroke-linecap="round"/><path d="M196 80 L191.3 83.7 L190.1 79.2 Z" fill="#8A7F76" stroke="#8A7F76" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></svg>
