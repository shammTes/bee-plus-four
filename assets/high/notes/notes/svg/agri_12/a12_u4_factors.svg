<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 236" font-family="HighNunito"><text x="170" y="16" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">Factors of production on an Eritrean farm</text><rect x="4" y="30" width="332" height="45" rx="6" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.3"/><text x="14" y="49" font-size="12" fill="#2A7A6B" font-weight="800">Land</text><text x="14" y="67.3" font-size="9.5" fill="#3E3129" font-weight="600">fields, grazing, water; owned, rented or village land</text><text x="328" y="49" font-size="9.5" text-anchor="end" fill="#8A7F76" font-weight="600">reward: rent</text><rect x="4" y="81" width="332" height="45" rx="6" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.3"/><text x="14" y="100" font-size="12" fill="#2F5F8F" font-weight="800">Labour</text><text x="14" y="118.3" font-size="9.5" fill="#3E3129" font-weight="600">family, hired (wage), contract, collective (wenfera)</text><text x="328" y="100" font-size="9.5" text-anchor="end" fill="#8A7F76" font-weight="600">reward: wages</text><rect x="4" y="132" width="332" height="45" rx="6" fill="#FCEFD9" stroke="#B86E12" stroke-width="1.3"/><text x="14" y="151" font-size="12" fill="#B86E12" font-weight="800">Capital</text><text x="14" y="169.3" font-size="9.5" fill="#3E3129" font-weight="600">oxen, maresha, pump, store, seed, fertiliser, cash</text><text x="328" y="151" font-size="9.5" text-anchor="end" fill="#8A7F76" font-weight="600">reward: interest</text><rect x="4" y="183" width="332" height="45" rx="6" fill="#ECE6F5" stroke="#6A4C9C" stroke-width="1.3"/><text x="14" y="202" font-size="12" fill="#6A4C9C" font-weight="800">Management</text><text x="14" y="220.3" font-size="9.5" fill="#3E3129" font-weight="600">the farmer who plans, decides and takes the risk</text><text x="328" y="202" font-size="9.5" text-anchor="end" fill="#8A7F76" font-weight="600">reward: profit</text></svg>
