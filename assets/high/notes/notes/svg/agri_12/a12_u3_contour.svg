<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" font-family="HighNunito"><text x="170" y="16" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">Contours on a hill and terraces along them</text><ellipse cx="110" cy="120" rx="92" ry="72" fill="none" stroke="#7A4E2D" stroke-width="1.4"/><text x="110" y="59" font-size="9" text-anchor="middle" fill="#8A7F76" font-weight="600">1900 m</text><ellipse cx="110" cy="120" rx="69" ry="54" fill="none" stroke="#7A4E2D" stroke-width="1.4"/><text x="110" y="77" font-size="9" text-anchor="middle" fill="#8A7F76" font-weight="600">1920 m</text><ellipse cx="110" cy="120" rx="46" ry="36" fill="none" stroke="#7A4E2D" stroke-width="1.4"/><text x="110" y="95" font-size="9" text-anchor="middle" fill="#8A7F76" font-weight="600">1940 m</text><ellipse cx="110" cy="120" rx="23" ry="18" fill="none" stroke="#7A4E2D" stroke-width="1.4"/><text x="110" y="124" font-size="10" text-anchor="middle" fill="#3E3129" font-weight="800">top</text><text x="110" y="214" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">close lines = steep; wide = gentle</text><path d="M210 60 C240 54 300 54 330 60" fill="none" stroke="#2A7A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M210 100 C240 94 300 94 330 100" fill="none" stroke="#2A7A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M210 140 C240 134 300 134 330 140" fill="none" stroke="#2A7A6B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="270" y="172" font-size="10.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">terraces follow contours,</text><text x="270" y="184" font-size="10.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">so water stays level</text><line x1="270" y1="70" x2="270" y2="88" stroke="#2F5F8F" stroke-width="1.4" stroke-linecap="round"/><path d="M270 88 L268.1 83.4 L271.9 83.4 Z" fill="#2F5F8F" stroke="#2F5F8F" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><line x1="270" y1="110" x2="270" y2="128" stroke="#2F5F8F" stroke-width="1.4" stroke-linecap="round"/><path d="M270 128 L268.1 123.4 L271.9 123.4 Z" fill="#2F5F8F" stroke="#2F5F8F" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></svg>
