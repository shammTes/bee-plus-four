<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 214" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">Three ways to castrate</text><rect x="6" y="28" width="106" height="180" rx="8" fill="#FBE6E0" stroke="#C24E32" stroke-width="1.6"/><text x="59" y="46" font-size="11.5" text-anchor="middle" fill="#C24E32" font-weight="800">Open (knife)</text><ellipse cx="50" cy="106" rx="9" ry="13" fill="#E8B9A0" stroke="#3E3129" stroke-width="1.2"/><ellipse cx="68" cy="106" rx="9" ry="13" fill="#E8B9A0" stroke="#3E3129" stroke-width="1.2"/><line x1="50" y1="78" x2="50" y2="94" stroke="#3E3129" stroke-width="1.4" stroke-linecap="round"/><line x1="68" y1="78" x2="68" y2="94" stroke="#3E3129" stroke-width="1.4" stroke-linecap="round"/><line x1="39" y1="122" x2="79" y2="114" stroke="#C24E32" stroke-width="2.2" stroke-linecap="round"/><text x="59" y="147.3" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">cut scrotum,</text><text x="59" y="160.1" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">remove testes</text><text x="59" y="176.9" font-size="10.5" text-anchor="middle" fill="#8A7F76" font-weight="600">sure, but bleeds:</text><text x="59" y="189.7" font-size="10.5" text-anchor="middle" fill="#8A7F76" font-weight="600">fly and infection</text><text x="59" y="202.5" font-size="10.5" text-anchor="middle" fill="#8A7F76" font-weight="600">risk</text><rect x="118" y="28" width="106" height="180" rx="8" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="1.6"/><text x="171" y="46" font-size="11.5" text-anchor="middle" fill="#2F5F8F" font-weight="800">Burdizzo</text><ellipse cx="162" cy="106" rx="9" ry="13" fill="#E8B9A0" stroke="#3E3129" stroke-width="1.2"/><ellipse cx="180" cy="106" rx="9" ry="13" fill="#E8B9A0" stroke="#3E3129" stroke-width="1.2"/><line x1="162" y1="78" x2="162" y2="94" stroke="#3E3129" stroke-width="1.4" stroke-linecap="round"/><line x1="180" y1="78" x2="180" y2="94" stroke="#3E3129" stroke-width="1.4" stroke-linecap="round"/><rect x="145" y="82" width="52" height="6" rx="2" fill="#9CB7DA" stroke="#2F5F8F" stroke-width="1.2"/><text x="171" y="147.3" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">crush the cords</text><text x="171" y="160.1" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">through the skin</text><text x="171" y="183.3" font-size="10.5" text-anchor="middle" fill="#8A7F76" font-weight="600">bloodless; testes</text><text x="171" y="196.1" font-size="10.5" text-anchor="middle" fill="#8A7F76" font-weight="600">shrink</text><rect x="230" y="28" width="106" height="180" rx="8" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="1.6"/><text x="283" y="46" font-size="11.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">Elastrator + ring</text><ellipse cx="274" cy="106" rx="9" ry="13" fill="#E8B9A0" stroke="#3E3129" stroke-width="1.2"/><ellipse cx="292" cy="106" rx="9" ry="13" fill="#E8B9A0" stroke="#3E3129" stroke-width="1.2"/><line x1="274" y1="78" x2="274" y2="94" stroke="#3E3129" stroke-width="1.4" stroke-linecap="round"/><line x1="292" y1="78" x2="292" y2="94" stroke="#3E3129" stroke-width="1.4" stroke-linecap="round"/><ellipse cx="283" cy="92" rx="20" ry="4" fill="none" stroke="#2A7A6B" stroke-width="3"/><text x="283" y="147.3" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">ring above the</text><text x="283" y="160.1" font-size="10.5" text-anchor="middle" fill="#3E3129" font-weight="800">testes cuts blood</text><text x="283" y="183.3" font-size="10.5" text-anchor="middle" fill="#8A7F76" font-weight="600">scrotum dries and</text><text x="283" y="196.1" font-size="10.5" text-anchor="middle" fill="#8A7F76" font-weight="600">drops off</text></svg>
