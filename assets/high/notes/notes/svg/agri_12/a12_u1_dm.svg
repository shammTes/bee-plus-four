<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 168" font-family="HighNunito"><text x="170" y="16" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">3 kg fresh alfalfa, 65 % water</text><rect x="20" y="40" width="195" height="40" rx="4" fill="#9CC3E6" stroke="#3F7FBF" stroke-width="1.2"/><rect x="215" y="40" width="105" height="40" rx="4" fill="#E8CF96" stroke="#7A4E2D" stroke-width="1.2"/><text x="117.5" y="65" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">water 65 % = 1.95 kg</text><text x="267.5" y="59" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">DM 35 %</text><text x="267.5" y="73" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">= 1.05 kg</text><text x="170" y="108" font-size="11.5" text-anchor="middle" fill="#3E3129" font-weight="800">DM = fresh weight × (100 − moisture %) ÷ 100</text><text x="170" y="128" font-size="11.5" text-anchor="middle" fill="#2A7A6B" font-weight="800">= 3 × 35 ÷ 100 = 1.05 kg DM per day</text><text x="170" y="156" font-size="10.5" text-anchor="middle" fill="#8A7F76" font-weight="600">Compare feeds by their DM, not by fresh weight</text></svg>
