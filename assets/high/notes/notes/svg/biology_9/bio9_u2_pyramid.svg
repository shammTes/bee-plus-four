<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 306">
<text x="200" y="18" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25" font-family="sans-serif">The seven ranks — human as the example</text>
<rect x="30" y="46" width="340" height="30" rx="6" fill="#2f6f4e"/>
<text x="200" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="sans-serif">Kingdom: Animalia</text>
<rect x="50" y="80" width="300" height="30" rx="6" fill="#3f8a5f"/>
<text x="200" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="sans-serif">Phylum: Chordata</text>
<rect x="70" y="114" width="260" height="30" rx="6" fill="#5aa173"/>
<text x="200" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="sans-serif">Class: Mammalia</text>
<rect x="90" y="148" width="220" height="30" rx="6" fill="#79b68a"/>
<text x="200" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="sans-serif">Order: Primates</text>
<rect x="110" y="182" width="180" height="30" rx="6" fill="#9ccaa6"/>
<text x="200" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Family: Hominidae</text>
<rect x="130" y="216" width="140" height="30" rx="6" fill="#bfdcc4"/>
<text x="200" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Genus: <tspan font-style="italic">Homo</tspan></text>
<rect x="150" y="250" width="100" height="30" rx="6" fill="#e0efe2"/>
<text x="200" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Species: <tspan font-style="italic">sapiens</tspan></text>
<text x="6" y="40" text-anchor="start" font-size="10" font-weight="normal" fill="#2f6f4e" font-family="sans-serif">biggest group</text>
<text x="394" y="274" text-anchor="end" font-size="10" font-weight="normal" fill="#2f6f4e" font-family="sans-serif">smallest,</text>
<text x="394" y="286" text-anchor="end" font-size="10" font-weight="normal" fill="#2f6f4e" font-family="sans-serif">most alike</text>
<text x="200" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a4b12" font-family="sans-serif">King Philip Came Over For Good Soup</text>
</svg>
