<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 222">
<text x="200" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Plant groups: each step adds a new feature</text>
<rect x="10" y="160" width="380" height="38" rx="6" fill="#c7e3c9" stroke="#2f7a3e" stroke-width="1.5"/>
<text x="20" y="176" text-anchor="start" font-size="12" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Bryophytes</text>
<text x="20" y="191" text-anchor="start" font-size="10" font-weight="normal" fill="#244a2a" font-family="sans-serif">mosses, liverworts</text>
<text x="370" y="184" text-anchor="end" font-size="10" font-weight="normal" fill="#16351c" font-family="sans-serif">no vessels, no seeds</text>
<rect x="30" y="116" width="340" height="38" rx="6" fill="#a9d5ad" stroke="#2f7a3e" stroke-width="1.5"/>
<text x="40" y="132" text-anchor="start" font-size="12" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Pteridophytes</text>
<text x="40" y="147" text-anchor="start" font-size="10" font-weight="normal" fill="#244a2a" font-family="sans-serif">ferns</text>
<text x="350" y="140" text-anchor="end" font-size="10" font-weight="normal" fill="#16351c" font-family="sans-serif">+ vessels (true roots, stems, leaves)</text>
<rect x="50" y="72" width="300" height="38" rx="6" fill="#86c18c" stroke="#2f7a3e" stroke-width="1.5"/>
<text x="60" y="88" text-anchor="start" font-size="12" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Gymnosperms</text>
<text x="60" y="103" text-anchor="start" font-size="10" font-weight="normal" fill="#244a2a" font-family="sans-serif">pine, cycads</text>
<text x="330" y="96" text-anchor="end" font-size="10" font-weight="normal" fill="#16351c" font-family="sans-serif">+ seeds (naked, on cones)</text>
<rect x="70" y="28" width="260" height="38" rx="6" fill="#5ea866" stroke="#2f7a3e" stroke-width="1.5"/>
<text x="80" y="44" text-anchor="start" font-size="12" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Angiosperms</text>
<text x="80" y="59" text-anchor="start" font-size="10" font-weight="normal" fill="#244a2a" font-family="sans-serif">maize, teff, beans</text>
<text x="310" y="52" text-anchor="end" font-size="10" font-weight="normal" fill="#16351c" font-family="sans-serif">+ flowers and fruits</text>
<text x="200" y="214" text-anchor="middle" font-size="10" font-weight="normal" fill="#55665f" font-family="sans-serif">Brave Pupils Get A’s · gametophyte gets smaller at every step</text>
</svg>
