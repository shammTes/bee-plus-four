<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
<text x="200" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Binary fission in a bacterium</text>
<g data-s="f1 f2 f3 f4"><rect x="20" y="40" width="60" height="36" rx="18" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.5"/><path d="M38 58 q6 -8 12 0 q6 8 12 0" fill="none" stroke="#a03a3a" stroke-width="2"/></g>
<text x="50" y="96" text-anchor="middle" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">1 grow</text>
<g data-s="f2 f3 f4"><rect x="110" y="40" width="80" height="36" rx="18" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.5"/><path d="M120 58 q6 -8 12 0 q6 8 12 0" fill="none" stroke="#a03a3a" stroke-width="2"/><path d="M156 58 q6 -8 12 0 q6 8 12 0" fill="none" stroke="#a03a3a" stroke-width="2"/><text x="150" y="96" text-anchor="middle" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">2 copy DNA</text></g>
<g data-s="f3 f4"><rect x="210" y="40" width="80" height="36" rx="18" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.5"/><line x1="250" y1="40" x2="250" y2="76" stroke="#2c6aa0" stroke-width="2"/><path d="M220 58 q6 -8 12 0 q6 8 12 0" fill="none" stroke="#a03a3a" stroke-width="2"/><path d="M256 58 q6 -8 12 0 q6 8 12 0" fill="none" stroke="#a03a3a" stroke-width="2"/><text x="250" y="96" text-anchor="middle" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">3 split</text></g>
<g data-s="f4"><rect x="310" y="30" width="36" height="24" rx="12" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.5"/><rect x="352" y="30" width="36" height="24" rx="12" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.5"/><rect x="310" y="62" width="36" height="24" rx="12" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.5"/><rect x="352" y="62" width="36" height="24" rx="12" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.5"/><text x="349" y="100" text-anchor="middle" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">4 divide again</text><text x="349" y="112" text-anchor="middle" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">every 20–30 min</text></g>
</svg>
