<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 224">
<text x="200" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Kingdom Protista</text>
<rect x="140" y="24" width="120" height="26" rx="8" fill="#f1e8fb" stroke="#6c3fa0" stroke-width="1.5"/>
<text x="200" y="42" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25" font-family="sans-serif">simple eukaryotes</text>
<line x1="200" y1="50" x2="68" y2="66" stroke="#55665f" stroke-width="1.6"/>
<rect x="8" y="66" width="124" height="150" rx="8" fill="#ffffff" stroke="#6c3fa0" stroke-width="1.5"/>
<text x="70" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#6c3fa0" font-family="sans-serif">Protozoa</text>
<text x="70" y="100" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#55665f" font-family="sans-serif">animal-like · ingest food</text>
<text x="70" y="124" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">Sarcodina: pseudopodia</text>
<text x="70" y="146" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">Ciliophora: cilia</text>
<text x="70" y="168" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">Mastigophora: flagella</text>
<text x="70" y="190" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">Sporozoa: none</text>
<line x1="200" y1="50" x2="198" y2="66" stroke="#55665f" stroke-width="1.6"/>
<rect x="138" y="66" width="124" height="150" rx="8" fill="#ffffff" stroke="#6c3fa0" stroke-width="1.5"/>
<text x="200" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#6c3fa0" font-family="sans-serif">Algae</text>
<text x="200" y="100" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#55665f" font-family="sans-serif">plant-like · photosynthesis</text>
<text x="200" y="124" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">simple: diatoms, Euglena</text>
<text x="200" y="146" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">dinoflagellates</text>
<text x="200" y="168" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">complex: red, brown,</text>
<text x="200" y="190" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">green (Spirogyra, Volvox)</text>
<line x1="200" y1="50" x2="328" y2="66" stroke="#55665f" stroke-width="1.6"/>
<rect x="268" y="66" width="124" height="150" rx="8" fill="#ffffff" stroke="#6c3fa0" stroke-width="1.5"/>
<text x="330" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#6c3fa0" font-family="sans-serif">Slime moulds</text>
<text x="330" y="100" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#55665f" font-family="sans-serif">fungus-like · absorb food</text>
<text x="330" y="124" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">acellular: one big</text>
<text x="330" y="146" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">multinucleate mass</text>
<text x="330" y="168" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">cellular: amoebae →</text>
<text x="330" y="190" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">slug → spores</text>
</svg>
