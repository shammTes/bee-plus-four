<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
<rect width="700" height="300" fill="#f4f7fb"/>
<text x="350" y="26" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1c3348">A small dichotomous key</text>
<g font-family="sans-serif" font-size="13" fill="#1c3348">
<rect x="250" y="44" width="200" height="40" rx="8" fill="#d9e6f5" stroke="#345"/>
<text x="350" y="69" text-anchor="middle">1. Does it have a nucleus?</text>
<rect x="40" y="120" width="200" height="44" rx="8" fill="#f8e2c8" stroke="#345"/>
<text x="140" y="146" text-anchor="middle">No: kingdom Monera</text>
<rect x="460" y="120" width="210" height="44" rx="8" fill="#d9e6f5" stroke="#345"/>
<text x="565" y="146" text-anchor="middle">Yes: go to step 2</text>
<rect x="430" y="200" width="250" height="44" rx="8" fill="#d9e6f5" stroke="#345"/>
<text x="555" y="226" text-anchor="middle">2. Is it made of one cell?</text>
<rect x="300" y="250" width="180" height="36" rx="8" fill="#e5f0d4" stroke="#345"/>
<text x="390" y="273" text-anchor="middle">Yes: Protista</text>
<rect x="520" y="250" width="170" height="36" rx="8" fill="#f6dcd4" stroke="#345"/>
<text x="605" y="273" text-anchor="middle">No: go on</text>
</g>
<path d="M350 84 L140 120" stroke="#345" fill="none"/>
<path d="M350 84 L565 120" stroke="#345" fill="none"/>
<path d="M565 164 L555 200" stroke="#345" fill="none"/>
</svg>
