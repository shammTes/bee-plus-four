<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280">
<rect width="640" height="280" fill="#f4f7f2"/>
<text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1b3a2f">Taxonomic ranks</text>
<g font-family="sans-serif" font-size="13" fill="#1b3a2f">
<rect x="40" y="50" width="120" height="36" rx="8" fill="#c9e4d4" stroke="#2f6f4e"/>
<text x="100" y="73" text-anchor="middle">Kingdom</text>
<rect x="180" y="50" width="100" height="36" rx="8" fill="#d7ead0" stroke="#2f6f4e"/>
<text x="230" y="73" text-anchor="middle">Phylum</text>
<rect x="300" y="50" width="90" height="36" rx="8" fill="#e3f0d4" stroke="#2f6f4e"/>
<text x="345" y="73" text-anchor="middle">Class</text>
<rect x="410" y="50" width="90" height="36" rx="8" fill="#eaf3d8" stroke="#2f6f4e"/>
<text x="455" y="73" text-anchor="middle">Order</text>
<rect x="40" y="120" width="100" height="36" rx="8" fill="#f3f6d8" stroke="#2f6f4e"/>
<text x="90" y="143" text-anchor="middle">Family</text>
<rect x="160" y="120" width="100" height="36" rx="8" fill="#f7f3d2" stroke="#2f6f4e"/>
<text x="210" y="143" text-anchor="middle">Genus</text>
<rect x="280" y="120" width="120" height="36" rx="8" fill="#f6e6c8" stroke="#8a5a20"/>
<text x="340" y="143" text-anchor="middle">Species</text>
</g>
<text x="40" y="200" font-family="sans-serif" font-size="14" fill="#333">Human example: Animalia, Chordata, Mammalia, Primates, Hominidae, Homo, sapiens</text>
<text x="40" y="230" font-family="sans-serif" font-size="14" fill="#333">Binomial: Homo sapiens (genus capital, species lower case)</text>
</svg>
