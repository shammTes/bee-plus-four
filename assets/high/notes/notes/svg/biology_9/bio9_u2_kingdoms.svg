<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344">
<text x="180" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Five kingdoms (Whittaker, 1969)</text>
<rect x="4" y="26" width="114" height="142" rx="8" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.5"/>
<rect x="4" y="26" width="114" height="24" rx="8" fill="#2c6aa0"/>
<text x="61" y="43" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff" font-family="sans-serif">Monera</text>
<text x="61" y="70" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">prokaryote</text>
<text x="61" y="91" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">unicellular</text>
<text x="61" y="112" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">wall: not cellulose</text>
<text x="61" y="133" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">auto- or heterotroph</text>
<text x="61" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c6aa0" font-family="sans-serif">bacteria</text>
<rect x="122" y="26" width="114" height="142" rx="8" fill="#f1e8fb" stroke="#6c3fa0" stroke-width="1.5"/>
<rect x="122" y="26" width="114" height="24" rx="8" fill="#6c3fa0"/>
<text x="179" y="43" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff" font-family="sans-serif">Protista</text>
<text x="179" y="70" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">eukaryote</text>
<text x="179" y="91" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">mostly 1 cell</text>
<text x="179" y="112" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">wall: some</text>
<text x="179" y="133" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">auto- or heterotroph</text>
<text x="179" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#6c3fa0" font-family="sans-serif">Amoeba, Euglena</text>
<rect x="240" y="26" width="114" height="142" rx="8" fill="#fbf0e3" stroke="#9a5b16" stroke-width="1.5"/>
<rect x="240" y="26" width="114" height="24" rx="8" fill="#9a5b16"/>
<text x="297" y="43" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff" font-family="sans-serif">Fungi</text>
<text x="297" y="70" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">eukaryote</text>
<text x="297" y="91" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">hyphae; yeast 1 cell</text>
<text x="297" y="112" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">wall: chitin</text>
<text x="297" y="133" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">absorb food</text>
<text x="297" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a5b16" font-family="sans-serif">mushroom, yeast</text>
<rect x="63" y="176" width="114" height="142" rx="8" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1.5"/>
<rect x="63" y="176" width="114" height="24" rx="8" fill="#2f7a3e"/>
<text x="120" y="193" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff" font-family="sans-serif">Plantae</text>
<text x="120" y="220" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">eukaryote</text>
<text x="120" y="241" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">multicellular</text>
<text x="120" y="262" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">wall: cellulose</text>
<text x="120" y="283" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">photosynthesis</text>
<text x="120" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f7a3e" font-family="sans-serif">moss, maize</text>
<rect x="181" y="176" width="114" height="142" rx="8" fill="#fbe6e6" stroke="#a03a3a" stroke-width="1.5"/>
<rect x="181" y="176" width="114" height="24" rx="8" fill="#a03a3a"/>
<text x="238" y="193" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff" font-family="sans-serif">Animalia</text>
<text x="238" y="220" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">eukaryote</text>
<text x="238" y="241" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">multicellular</text>
<text x="238" y="262" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">no wall</text>
<text x="238" y="283" text-anchor="middle" font-size="11" font-weight="normal" fill="#1b2b25" font-family="sans-serif">ingest food</text>
<text x="238" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#a03a3a" font-family="sans-serif">sponge, human</text>
<text x="180" y="336" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#55665f" font-family="sans-serif">simple → complex: Many People Find Plants Amazing</text>
</svg>
