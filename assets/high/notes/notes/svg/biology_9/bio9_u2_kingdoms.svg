<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320">
<rect width="680" height="320" fill="#f7f4ee"/>
<text x="340" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243024">Five kingdoms</text>
<g font-family="sans-serif" font-size="13">
<rect x="20" y="50" width="120" height="110" rx="10" fill="#d9efe4" stroke="#2a6b4f"/>
<text x="80" y="78" text-anchor="middle" font-weight="bold">Monera</text>
<text x="80" y="100" text-anchor="middle">no nucleus</text>
<text x="80" y="120" text-anchor="middle">bacteria</text>
<rect x="150" y="50" width="120" height="110" rx="10" fill="#e5f0d4" stroke="#4e7a32"/>
<text x="210" y="78" text-anchor="middle" font-weight="bold">Protista</text>
<text x="210" y="100" text-anchor="middle">mostly one cell</text>
<text x="210" y="120" text-anchor="middle">has a nucleus</text>
<rect x="280" y="50" width="120" height="110" rx="10" fill="#f3e6c8" stroke="#8a6230"/>
<text x="340" y="78" text-anchor="middle" font-weight="bold">Fungi</text>
<text x="340" y="100" text-anchor="middle">absorb food</text>
<text x="340" y="120" text-anchor="middle">hyphae, spores</text>
<rect x="410" y="50" width="120" height="110" rx="10" fill="#dcecc8" stroke="#3d7a32"/>
<text x="470" y="78" text-anchor="middle" font-weight="bold">Plantae</text>
<text x="470" y="100" text-anchor="middle">make food</text>
<text x="470" y="120" text-anchor="middle">cellulose wall</text>
<rect x="540" y="50" width="120" height="110" rx="10" fill="#f6dcd4" stroke="#8a4034"/>
<text x="600" y="78" text-anchor="middle" font-weight="bold">Animalia</text>
<text x="600" y="100" text-anchor="middle">eat food</text>
<text x="600" y="120" text-anchor="middle">no cell wall</text>
</g>
<text x="30" y="200" font-family="sans-serif" font-size="14" fill="#333">Local pictures: bacteria in yoghurt, Chlamydomonas in a ditch,</text>
<text x="30" y="222" font-family="sans-serif" font-size="14" fill="#333">mushrooms after rain, an olive tree, a coral in the Red Sea.</text>
<text x="30" y="260" font-family="sans-serif" font-size="14" fill="#333">Only Monera are prokaryotes. The other four kingdoms are eukaryotes.</text>
</svg>
