<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
<text x="200" y="16" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Counting the 206 bones of an adult</text>
<rect x="150" y="26" width="100" height="28" rx="8" fill="#f3e0c0" stroke="#8b5a2b" stroke-width="1.5"/><text x="200.0" y="43.9" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25" font-family="sans-serif">206 bones</text>
<g data-hl="ax"><line x1="200" y1="54" x2="100" y2="70" stroke="#55665f" stroke-width="1.6"/><rect x="40" y="70" width="120" height="28" rx="8" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.5"/><text x="100.0" y="87.8" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25" font-family="sans-serif">AXIAL 80</text></g>
<g data-hl="ap"><line x1="200" y1="54" x2="300" y2="70" stroke="#55665f" stroke-width="1.6"/><rect x="240" y="70" width="120" height="28" rx="8" fill="#fbe6e6" stroke="#a03a3a" stroke-width="1.5"/><text x="300.0" y="87.8" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25" font-family="sans-serif">APPENDICULAR 126</text></g>
<g data-hl="ax"><text x="16" y="118" text-anchor="start" font-size="10" font-weight="bold" fill="#2c6aa0" font-family="sans-serif">Skull</text><text x="16" y="129" text-anchor="start" font-size="9.2" font-weight="normal" fill="#1b2b25" font-family="sans-serif">8 cranial + 14 facial = 22</text></g>
<g data-hl="ax"><text x="16" y="142" text-anchor="start" font-size="10" font-weight="bold" fill="#2c6aa0" font-family="sans-serif">Ear ossicles</text><text x="16" y="153" text-anchor="start" font-size="9.2" font-weight="normal" fill="#1b2b25" font-family="sans-serif">3 + 3 = 6</text></g>
<g data-hl="ax"><text x="16" y="166" text-anchor="start" font-size="10" font-weight="bold" fill="#2c6aa0" font-family="sans-serif">Hyoid (neck)</text><text x="16" y="177" text-anchor="start" font-size="9.2" font-weight="normal" fill="#1b2b25" font-family="sans-serif">1</text></g>
<g data-hl="ax"><text x="16" y="190" text-anchor="start" font-size="10" font-weight="bold" fill="#2c6aa0" font-family="sans-serif">Vertebral column</text><text x="16" y="201" text-anchor="start" font-size="9.2" font-weight="normal" fill="#1b2b25" font-family="sans-serif">26 (33 in a child)</text></g>
<g data-hl="ax"><text x="16" y="214" text-anchor="start" font-size="10" font-weight="bold" fill="#2c6aa0" font-family="sans-serif">Sternum</text><text x="16" y="225" text-anchor="start" font-size="9.2" font-weight="normal" fill="#1b2b25" font-family="sans-serif">1</text></g>
<g data-hl="ax"><text x="16" y="238" text-anchor="start" font-size="10" font-weight="bold" fill="#2c6aa0" font-family="sans-serif">Ribs</text><text x="16" y="249" text-anchor="start" font-size="9.2" font-weight="normal" fill="#1b2b25" font-family="sans-serif">12 pairs = 24</text></g>
<g data-hl="ap"><text x="220" y="118" text-anchor="start" font-size="10" font-weight="bold" fill="#a03a3a" font-family="sans-serif">Pectoral girdle</text><text x="220" y="129" text-anchor="start" font-size="9.2" font-weight="normal" fill="#1b2b25" font-family="sans-serif">2 clavicles + 2 scapulae = 4</text></g>
<g data-hl="ap"><text x="220" y="142" text-anchor="start" font-size="10" font-weight="bold" fill="#a03a3a" font-family="sans-serif">Arms</text><text x="220" y="153" text-anchor="start" font-size="9.2" font-weight="normal" fill="#1b2b25" font-family="sans-serif">30 + 30 = 60</text></g>
<g data-hl="ap"><text x="220" y="166" text-anchor="start" font-size="10" font-weight="bold" fill="#a03a3a" font-family="sans-serif">Pelvic girdle</text><text x="220" y="177" text-anchor="start" font-size="9.2" font-weight="normal" fill="#1b2b25" font-family="sans-serif">2 hip bones</text></g>
<g data-hl="ap"><text x="220" y="190" text-anchor="start" font-size="10" font-weight="bold" fill="#a03a3a" font-family="sans-serif">Legs</text><text x="220" y="201" text-anchor="start" font-size="9.2" font-weight="normal" fill="#1b2b25" font-family="sans-serif">30 + 30 = 60</text></g>
<text x="310" y="236" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#2c6aa0" font-family="sans-serif">22+6+1+26+1+24 = 80</text>
<text x="310" y="252" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#a03a3a" font-family="sans-serif">4+60+2+60 = 126</text>
<text x="200" y="272" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#55665f" font-family="sans-serif">each arm: 1+1+1+8+5+14 = 30 · each leg: 1+1+1+1+7+5+14 = 30</text>
</svg>
