<g data-hl="p4"><rect x="10" y="118" width="120" height="50" rx="8" fill="#fff4d6" stroke="#c98a14" stroke-width="1.5"/><text x="70.0" y="134.8" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Seminal vesicles</text><text x="70.0" y="146.3" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">alkaline fluid, sugar,</text><text x="70.0" y="157.8" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">prostaglandins</text><line x1="70" y1="118" x2="316.0" y2="82.0" stroke="#c98a14" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M316.0 82.0 L310.2 85.9 L309.3 79.9 Z" fill="#c98a14"/></g>
<g data-hl="p4"><rect x="140" y="118" width="120" height="50" rx="8" fill="#fff4d6" stroke="#c98a14" stroke-width="1.5"/><text x="200.0" y="134.8" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Prostate gland</text><text x="200.0" y="146.3" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">thin, milky, alkaline:</text><text x="200.0" y="157.8" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">neutralises acid</text><line x1="200" y1="118" x2="330.0" y2="82.0" stroke="#c98a14" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M330.0 82.0 L324.7 86.6 L323.1 80.7 Z" fill="#c98a14"/></g>
<g data-hl="p4"><rect x="270" y="118" width="120" height="50" rx="8" fill="#fff4d6" stroke="#c98a14" stroke-width="1.5"/><text x="330.0" y="134.8" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Cowper's glands</text><text x="330.0" y="146.3" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">mucus that</text><text x="330.0" y="157.8" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">lubricates</text><line x1="330" y1="118" x2="344.0" y2="82.0" stroke="#c98a14" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M344.0 82.0 L344.6 89.0 L338.9 86.8 Z" fill="#c98a14"/></g>
<text x="200" y="192" text-anchor="middle" font-size="10" font-weight="normal" fill="#55665f" font-family="sans-serif">sperm + fluids = SEMEN (fluid gives food, alkali and a medium to swim in)</text>
<text x="200" y="208" text-anchor="middle" font-size="10" font-weight="normal" fill="#55665f" font-family="sans-serif">Scrotum keeps testes 3–5 °C cooler · Penis delivers semen into the vagina</text>
</svg>
