<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 216">
<text x="200" y="16" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Path of sperm and where the fluids join</text>
<g data-hl="p1"><rect x="12" y="40" width="88" height="40" rx="8" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.5"/><text x="56.0" y="57.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Testis</text><text x="56.0" y="69.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">makes sperm</text></g>
<g data-hl="p2"><rect x="108" y="40" width="88" height="40" rx="8" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.5"/><text x="152.0" y="57.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Epididymis</text><text x="152.0" y="69.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">stores, matures</text></g>
<g data-hl="p3"><rect x="204" y="40" width="88" height="40" rx="8" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.5"/><text x="248.0" y="57.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Vas deferens</text><text x="248.0" y="69.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">carries sperm</text></g>
<g data-hl="p5"><rect x="300" y="40" width="88" height="40" rx="8" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.5"/><text x="344.0" y="57.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Urethra</text><text x="344.0" y="69.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">semen out</text></g>
<line x1="100" y1="60" x2="110.0" y2="60.0" stroke="#2c6aa0" stroke-width="1.6"/><path d="M110.0 60.0 L103.7 63.0 L103.7 57.0 Z" fill="#2c6aa0"/>
<line x1="196" y1="60" x2="206.0" y2="60.0" stroke="#2c6aa0" stroke-width="1.6"/><path d="M206.0 60.0 L199.7 63.0 L199.7 57.0 Z" fill="#2c6aa0"/>
