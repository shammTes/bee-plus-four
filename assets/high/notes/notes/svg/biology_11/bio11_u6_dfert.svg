<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 284">
<text x="200" y="16" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Double fertilisation inside the ovule</text>
<g transform="translate(0,24)">
<ellipse cx="150" cy="140" rx="96" ry="104" fill="#f7f0fb" stroke="#6c3fa0" stroke-width="1.6"/>
<ellipse cx="150" cy="140" rx="60" ry="76" fill="#fffdf6" stroke="#c98a14" stroke-width="1.2"/>
<text x="150" y="30" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#6c3fa0" font-family="sans-serif">ovule (integuments outside)</text><text x="150" y="228" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#7a5a00" font-family="sans-serif">embryo sac</text>
<g data-hl="p"><path d="M150 0 L150 52 Q150 62 146 70" fill="none" stroke="#2c6aa0" stroke-width="5" stroke-linecap="round"/><text x="160" y="46" text-anchor="start" font-size="9.5" font-weight="normal" fill="#2c6aa0" font-family="sans-serif">pollen tube via micropyle</text></g>
<g data-hl="e"><circle cx="150" cy="86" r="9" fill="#f6c9c9" stroke="#a03a3a"/><text x="150" y="89" text-anchor="middle" font-size="7.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">egg</text><circle cx="128" cy="80" r="6" fill="#eee" stroke="#999"/><circle cx="172" cy="80" r="6" fill="#eee" stroke="#999"/><text x="118" y="66" text-anchor="end" font-size="8.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">synergids</text></g>
<g data-hl="pn"><circle cx="140" cy="140" r="7" fill="#f6e08a" stroke="#c98a14"/><circle cx="160" cy="140" r="7" fill="#f6e08a" stroke="#c98a14"/><text x="150" y="160" text-anchor="middle" font-size="9" font-weight="normal" fill="#1b2b25" font-family="sans-serif">2 polar nuclei</text></g>
<circle cx="136" cy="206" r="5" fill="#ddd" stroke="#999"/><circle cx="150" cy="206" r="5" fill="#ddd" stroke="#999"/><circle cx="164" cy="206" r="5" fill="#ddd" stroke="#999"/><text x="150" y="196" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">antipodals (3)</text>
<g data-hl="e"><rect x="262" y="52" width="132" height="50" rx="8" fill="#fbe6e6" stroke="#a03a3a" stroke-width="1.5"/><text x="328.0" y="68.8" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">male nucleus 1 + egg</text><text x="328.0" y="80.3" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">→ ZYGOTE (2n)</text><text x="328.0" y="91.8" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">→ embryo</text><line x1="262" y1="78" x2="162.0" y2="86.0" stroke="#a03a3a" stroke-width="1.2"/><path d="M162.0 86.0 L168.0 82.5 L168.5 88.5 Z" fill="#a03a3a"/></g>
<g data-hl="pn"><rect x="262" y="118" width="132" height="50" rx="8" fill="#fff4d6" stroke="#c98a14" stroke-width="1.5"/><text x="328.0" y="134.8" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">male nucleus 2 + 2 polar</text><text x="328.0" y="146.3" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">→ ENDOSPERM (3n)</text><text x="328.0" y="157.8" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">→ food store</text><line x1="262" y1="142" x2="170.0" y2="140.0" stroke="#c98a14" stroke-width="1.2"/><path d="M170.0 140.0 L176.4 137.1 L176.2 143.2 Z" fill="#c98a14"/></g>
<text x="328" y="196" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25" font-family="sans-serif">then: ovule → seed</text><text x="328" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25" font-family="sans-serif">ovary → fruit</text>
<text x="200" y="252" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#55665f" font-family="sans-serif">two fusions at once = double fertilisation (flowering plants only)</text>
</g>
</svg>
