<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 172">
<text x="200" y="16" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">The 28-day menstrual cycle (ovulation about day 14)</text>
<g data-hl="m"><rect x="20.0" y="40" width="53.3" height="30" rx="4" fill="#f2b8a0" stroke="#55665f" stroke-width="1"/><text x="46.7" y="59" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">menstrual</text></g>
<g data-hl="f"><rect x="73.3" y="40" width="120.0" height="30" rx="4" fill="#f6e08a" stroke="#55665f" stroke-width="1"/><text x="133.3" y="59" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">proliferative / follicular</text></g>
<g data-hl="l"><rect x="193.3" y="40" width="186.7" height="30" rx="4" fill="#bfe3c7" stroke="#55665f" stroke-width="1"/><text x="286.7" y="59" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">secretory / luteal</text></g>
<line x1="20.0" y1="70" x2="20.0" y2="76" stroke="#55665f" stroke-width="1"/><text x="20.0" y="88" text-anchor="middle" font-size="9" font-weight="normal" fill="#1b2b25" font-family="sans-serif">day 1</text>
<line x1="73.3" y1="70" x2="73.3" y2="76" stroke="#55665f" stroke-width="1"/><text x="73.3" y="88" text-anchor="middle" font-size="9" font-weight="normal" fill="#1b2b25" font-family="sans-serif">day 5</text>
<line x1="193.3" y1="70" x2="193.3" y2="76" stroke="#55665f" stroke-width="1"/><text x="193.3" y="88" text-anchor="middle" font-size="9" font-weight="normal" fill="#1b2b25" font-family="sans-serif">day 14</text>
<line x1="286.7" y1="70" x2="286.7" y2="76" stroke="#55665f" stroke-width="1"/><text x="286.7" y="88" text-anchor="middle" font-size="9" font-weight="normal" fill="#1b2b25" font-family="sans-serif">day 21</text>
<line x1="380.0" y1="70" x2="380.0" y2="76" stroke="#55665f" stroke-width="1"/><text x="380.0" y="88" text-anchor="middle" font-size="9" font-weight="normal" fill="#1b2b25" font-family="sans-serif">day 28</text>
<g data-hl="o"><circle cx="193.3" cy="40" r="6" fill="#6c3fa0"/><text x="193.3" y="32" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6c3fa0" font-family="sans-serif">ovulation (LH surge)</text></g>
<text x="20" y="112" text-anchor="start" font-size="10" font-weight="bold" fill="#1b2b25" font-family="sans-serif">ovary</text><text x="78" y="112" text-anchor="start" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">follicle grows → oestrogen</text><text x="380" y="112" text-anchor="end" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">corpus luteum → progesterone</text>
<text x="20" y="134" text-anchor="start" font-size="10" font-weight="bold" fill="#1b2b25" font-family="sans-serif">uterus</text><text x="78" y="134" text-anchor="start" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">lining shed, then rebuilt</text><text x="380" y="134" text-anchor="end" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">lining thick, glands secrete</text>
<text x="200" y="160" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#a03a3a" font-family="sans-serif">no pregnancy → corpus luteum dies → progesterone falls → lining shed (day 1)</text>
</svg>
