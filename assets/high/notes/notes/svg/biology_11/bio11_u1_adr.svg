<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 256">
<text x="190" y="16" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Adrenal gland: two glands in one</text>
<path d="M40 120 C40 70 110 70 110 120 C110 170 40 170 40 120 Z" fill="#f3d9c9" stroke="#8b5a2b" stroke-width="1.5"/>
<text x="75" y="128" text-anchor="middle" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">kidney</text>
<path d="M48 82 Q75 40 104 82 Q75 70 48 82 Z" fill="#f6e08a" stroke="#b08a12" stroke-width="1.5"/>
<text x="75" y="46" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25" font-family="sans-serif">adrenal</text>
<line x1="112" y1="70" x2="170.0" y2="70.0" stroke="#55665f" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M170.0 70.0 L163.7 73.0 L163.7 67.0 Z" fill="#55665f"/>
<g data-hl="cx"><circle cx="250" cy="110" r="70" fill="#f6e08a" stroke="#b08a12" stroke-width="1.6"/><text x="250" y="56" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5a00" font-family="sans-serif">CORTEX (outer)</text></g>
<g data-hl="md"><circle cx="250" cy="116" r="34" fill="#f2b8a0" stroke="#a03a3a" stroke-width="1.6"/><text x="250" y="113" text-anchor="middle" font-size="10" font-weight="bold" fill="#a03a3a" font-family="sans-serif">MEDULLA</text><text x="250" y="126" text-anchor="middle" font-size="9" font-weight="normal" fill="#1b2b25" font-family="sans-serif">(inner)</text></g>
<g data-hl="cx"><text x="250" y="200" text-anchor="middle" font-size="10" font-weight="normal" fill="#7a5a00" font-family="sans-serif">cortex: steroids — cortisol, aldosterone, sex steroids</text><text x="250" y="214" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#7a5a00" font-family="sans-serif">controlled by ACTH (cortisol) and Na⁺/K⁺ level (aldosterone)</text></g>
<g data-hl="md"><text x="250" y="232" text-anchor="middle" font-size="10" font-weight="normal" fill="#a03a3a" font-family="sans-serif">medulla: amines — adrenaline, noradrenaline</text><text x="250" y="246" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#a03a3a" font-family="sans-serif">controlled by nerve impulses (fight or flight)</text></g>
</svg>
