<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 288">
<text x="190" y="16" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Sex hormones: negative feedback</text>
<g data-hl="k1"><rect x="110" y="28" width="160" height="34" rx="8" fill="#efe7fb" stroke="#6c3fa0" stroke-width="1.5"/><text x="190.0" y="42.4" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Hypothalamus</text><text x="190.0" y="54.9" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">senses the blood level</text></g>
<g data-hl="k1"><line x1="190" y1="62" x2="190.0" y2="86.0" stroke="#6c3fa0" stroke-width="1.6"/><path d="M190.0 86.0 L187.0 79.7 L193.0 79.7 Z" fill="#6c3fa0"/><text x="198" y="78" text-anchor="start" font-size="10" font-weight="normal" fill="#6c3fa0" font-family="sans-serif">GnRH</text></g>
<g data-hl="k2"><rect x="110" y="88" width="160" height="34" rx="8" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.5"/><text x="190.0" y="102.4" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Anterior pituitary</text><text x="190.0" y="114.9" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">releases the tropic hormone</text></g>
<g data-hl="k2"><line x1="190" y1="122" x2="190.0" y2="146.0" stroke="#2c6aa0" stroke-width="1.6"/><path d="M190.0 146.0 L187.0 139.7 L193.0 139.7 Z" fill="#2c6aa0"/><text x="198" y="138" text-anchor="start" font-size="10" font-weight="normal" fill="#2c6aa0" font-family="sans-serif">FSH + LH</text></g>
<g data-hl="k3"><rect x="110" y="148" width="160" height="34" rx="8" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1.5"/><text x="190.0" y="162.4" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Testis / ovary</text><text x="190.0" y="174.9" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">makes its own hormone</text></g>
<g data-hl="k3"><line x1="190" y1="182" x2="190.0" y2="206.0" stroke="#2f7a3e" stroke-width="1.6"/><path d="M190.0 206.0 L187.0 199.7 L193.0 199.7 Z" fill="#2f7a3e"/><text x="198" y="198" text-anchor="start" font-size="10" font-weight="normal" fill="#2f7a3e" font-family="sans-serif">testosterone / oestrogen</text></g>
<g data-hl="k4"><rect x="110" y="208" width="160" height="34" rx="8" fill="#fff4d6" stroke="#c98a14" stroke-width="1.5"/><text x="190.0" y="222.4" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Target cells</text><text x="190.0" y="234.9" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">sex characters, gametes</text></g>
<g data-hl="k5"><path d="M110 225 C40 225 40 105 108 105" fill="none" stroke="#a03a3a" stroke-width="1.6" stroke-dasharray="4 3"/><line x1="100" y1="105" x2="109.0" y2="105.0" stroke="#a03a3a" stroke-width="1.6"/><path d="M109.0 105.0 L102.7 108.0 L102.7 102.0 Z" fill="#a03a3a"/><path d="M110 232 C18 232 18 45 108 45" fill="none" stroke="#a03a3a" stroke-width="1.6" stroke-dasharray="4 3"/><line x1="100" y1="45" x2="109.0" y2="45.0" stroke="#a03a3a" stroke-width="1.6"/><path d="M109.0 45.0 L102.7 48.0 L102.7 42.0 Z" fill="#a03a3a"/><text x="30" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#a03a3a" font-family="sans-serif">−</text><text x="190" y="262" text-anchor="middle" font-size="10" font-weight="normal" fill="#a03a3a" font-family="sans-serif">high sex hormone → less GnRH, FSH, LH</text></g>
<text x="190" y="280" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#55665f" font-family="sans-serif">dashed red = high hormone level switches the top glands OFF</text>
</svg>
