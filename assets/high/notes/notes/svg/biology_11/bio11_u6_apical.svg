<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 222">
<text x="200" y="16" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Apical dominance: the tip keeps side buds asleep</text>
<g data-hl="a"><line x1="100" y1="170" x2="100" y2="50" stroke="#2f7a3e" stroke-width="6"/><line x1="100" y1="140" x2="106" y2="135.8" stroke="#2f7a3e" stroke-width="3"/><line x1="100" y1="140" x2="94" y2="135.8" stroke="#2f7a3e" stroke-width="3"/><line x1="100" y1="115" x2="106" y2="110.8" stroke="#2f7a3e" stroke-width="3"/><line x1="100" y1="115" x2="94" y2="110.8" stroke="#2f7a3e" stroke-width="3"/><line x1="100" y1="90" x2="106" y2="85.8" stroke="#2f7a3e" stroke-width="3"/><line x1="100" y1="90" x2="94" y2="85.8" stroke="#2f7a3e" stroke-width="3"/><circle cx="100" cy="46" r="7" fill="#e0a800"/><text x="112" y="40" text-anchor="start" font-size="9.5" font-weight="normal" fill="#a03a3a" font-family="sans-serif">tip: auxin ↓</text><rect x="70" y="170" width="60" height="14" rx="3" fill="#c9a27a" stroke="#8b5a2b" stroke-width="1"/><text x="100" y="200" text-anchor="middle" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">intact: tall, few branches</text></g>
<g data-hl="b"><line x1="300" y1="170" x2="300" y2="80" stroke="#2f7a3e" stroke-width="6"/><line x1="300" y1="140" x2="330" y2="119.0" stroke="#2f7a3e" stroke-width="3"/><line x1="300" y1="140" x2="270" y2="119.0" stroke="#2f7a3e" stroke-width="3"/><line x1="300" y1="115" x2="330" y2="94.0" stroke="#2f7a3e" stroke-width="3"/><line x1="300" y1="115" x2="270" y2="94.0" stroke="#2f7a3e" stroke-width="3"/><line x1="300" y1="90" x2="330" y2="69.0" stroke="#2f7a3e" stroke-width="3"/><line x1="300" y1="90" x2="270" y2="69.0" stroke="#2f7a3e" stroke-width="3"/><text x="300" y="50" text-anchor="middle" font-size="10" font-weight="bold" fill="#a03a3a" font-family="sans-serif">✂ tip removed</text><rect x="270" y="170" width="60" height="14" rx="3" fill="#c9a27a" stroke="#8b5a2b" stroke-width="1"/><text x="300" y="200" text-anchor="middle" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">decapitated: side buds grow</text><text x="300" y="213" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">(bushy — like pruning)</text></g>
</svg>
