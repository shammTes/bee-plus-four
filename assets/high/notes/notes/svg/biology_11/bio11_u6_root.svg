<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 296">
<text x="190" y="16" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Root tip (long section): four regions</text>
<g data-hl="cap"><path d="M60 238 L120 238 Q120 266 90 268 Q60 266 60 238 Z" fill="#f2d7b0" stroke="#8b5a2b" stroke-width="1.5"/><line x1="146" y1="250.0" x2="160" y2="250.0" stroke="#8b5a2b" stroke-width="1"/><text x="164" y="248.0" text-anchor="start" font-size="10.5" font-weight="bold" fill="#8b5a2b" font-family="sans-serif">ROOT CAP</text><text x="164" y="261.0" text-anchor="start" font-size="9.2" font-weight="normal" fill="#1b2b25" font-family="sans-serif">protects the tip; cells worn away</text></g>
<g data-hl="div"><rect x="64" y="196" width="52" height="42" rx="2" fill="#fbe6e6" stroke="#a03a3a" stroke-width="1.5"/><line x1="64" y1="204.4" x2="116" y2="204.4" stroke="#a03a3a" stroke-width="0.6"/><line x1="64" y1="212.8" x2="116" y2="212.8" stroke="#a03a3a" stroke-width="0.6"/><line x1="64" y1="221.2" x2="116" y2="221.2" stroke="#a03a3a" stroke-width="0.6"/><line x1="64" y1="229.6" x2="116" y2="229.6" stroke="#a03a3a" stroke-width="0.6"/><line x1="146" y1="217.0" x2="160" y2="217.0" stroke="#a03a3a" stroke-width="1"/><text x="164" y="215.0" text-anchor="start" font-size="10.5" font-weight="bold" fill="#a03a3a" font-family="sans-serif">CELL DIVISION</text><text x="164" y="228.0" text-anchor="start" font-size="9.2" font-weight="normal" fill="#1b2b25" font-family="sans-serif">small cube cells, big nuclei, mitosis</text></g>
<g data-hl="elo"><rect x="64" y="128" width="52" height="68" rx="2" fill="#fff4d6" stroke="#c98a14" stroke-width="1.5"/><line x1="64" y1="145.0" x2="116" y2="145.0" stroke="#c98a14" stroke-width="0.6"/><line x1="64" y1="162.0" x2="116" y2="162.0" stroke="#c98a14" stroke-width="0.6"/><line x1="64" y1="179.0" x2="116" y2="179.0" stroke="#c98a14" stroke-width="0.6"/><line x1="146" y1="162.0" x2="160" y2="162.0" stroke="#c98a14" stroke-width="1"/><text x="164" y="160.0" text-anchor="start" font-size="10.5" font-weight="bold" fill="#c98a14" font-family="sans-serif">ELONGATION</text><text x="164" y="173.0" text-anchor="start" font-size="9.2" font-weight="normal" fill="#1b2b25" font-family="sans-serif">cells take in water, vacuoles join, cells lengthen</text></g>
<g data-hl="mat"><rect x="64" y="34" width="52" height="94" rx="2" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1.5"/><line x1="64" y1="52.8" x2="116" y2="52.8" stroke="#2f7a3e" stroke-width="0.6"/><line x1="64" y1="71.6" x2="116" y2="71.6" stroke="#2f7a3e" stroke-width="0.6"/><line x1="64" y1="90.4" x2="116" y2="90.4" stroke="#2f7a3e" stroke-width="0.6"/><line x1="64" y1="109.2" x2="116" y2="109.2" stroke="#2f7a3e" stroke-width="0.6"/><line x1="64" y1="46" x2="38" y2="40" stroke="#2f7a3e" stroke-width="1.4"/><line x1="116" y1="46" x2="142" y2="40" stroke="#2f7a3e" stroke-width="1.4"/><line x1="64" y1="60" x2="38" y2="54" stroke="#2f7a3e" stroke-width="1.4"/><line x1="116" y1="60" x2="142" y2="54" stroke="#2f7a3e" stroke-width="1.4"/><line x1="64" y1="74" x2="38" y2="68" stroke="#2f7a3e" stroke-width="1.4"/><line x1="116" y1="74" x2="142" y2="68" stroke="#2f7a3e" stroke-width="1.4"/><line x1="64" y1="88" x2="38" y2="82" stroke="#2f7a3e" stroke-width="1.4"/><line x1="116" y1="88" x2="142" y2="82" stroke="#2f7a3e" stroke-width="1.4"/><line x1="64" y1="102" x2="38" y2="96" stroke="#2f7a3e" stroke-width="1.4"/><line x1="116" y1="102" x2="142" y2="96" stroke="#2f7a3e" stroke-width="1.4"/><line x1="64" y1="116" x2="38" y2="110" stroke="#2f7a3e" stroke-width="1.4"/><line x1="116" y1="116" x2="142" y2="110" stroke="#2f7a3e" stroke-width="1.4"/><line x1="146" y1="81.0" x2="160" y2="81.0" stroke="#2f7a3e" stroke-width="1"/><text x="164" y="79.0" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2f7a3e" font-family="sans-serif">MATURATION (root hairs)</text><text x="164" y="92.0" text-anchor="start" font-size="9.2" font-weight="normal" fill="#1b2b25" font-family="sans-serif">cells differentiate; root hairs absorb</text></g>
<text x="190" y="288" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#55665f" font-family="sans-serif">growth in length happens only in the bottom few millimetres</text>
</svg>
