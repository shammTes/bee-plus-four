<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 274">
<text x="200" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Blood glucose: insulin and glucagon pull in opposite directions</text>
<rect x="130" y="120" width="140" height="40" rx="8" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1.5"/><text x="200.0" y="137.4" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">NORMAL</text><text x="200.0" y="149.9" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">about 100 mg / 100 cm³</text>
<g data-hl="hi"><rect x="20" y="34" width="150" height="34" rx="8" fill="#fbe6e6" stroke="#a03a3a" stroke-width="1.5"/><text x="95.0" y="48.4" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Glucose HIGH</text><text x="95.0" y="60.9" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">after a meal</text><line x1="95" y1="68" x2="95.0" y2="84.0" stroke="#a03a3a" stroke-width="1.6"/><path d="M95.0 84.0 L92.0 77.7 L98.0 77.7 Z" fill="#a03a3a"/><rect x="20" y="84" width="150" height="30" rx="8" fill="#fff" stroke="#a03a3a" stroke-width="1.5"/><text x="95.0" y="102.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25" font-family="sans-serif">β-cells → INSULIN</text><line x1="170" y1="99" x2="228.0" y2="99.0" stroke="#a03a3a" stroke-width="1.6"/><path d="M228.0 99.0 L221.7 102.0 L221.7 96.0 Z" fill="#a03a3a"/><rect x="230" y="34" width="160" height="80" rx="8" fill="#fff" stroke="#a03a3a" stroke-width="1.5"/><text x="310.0" y="60.1" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Liver + muscle</text><text x="310.0" y="71.6" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">take glucose in;</text><text x="310.0" y="83.1" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">glucose → glycogen;</text><text x="310.0" y="94.6" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">cells respire more</text><line x1="300" y1="114" x2="250.0" y2="124.0" stroke="#a03a3a" stroke-width="1.6"/><path d="M250.0 124.0 L255.6 119.8 L256.8 125.7 Z" fill="#a03a3a"/><text x="330" y="130" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#a03a3a" font-family="sans-serif">level falls</text></g>
<g data-hl="lo"><rect x="20" y="212" width="150" height="34" rx="8" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.5"/><text x="95.0" y="226.4" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Glucose LOW</text><text x="95.0" y="238.9" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">fasting, exercise</text><line x1="95" y1="212" x2="95.0" y2="196.0" stroke="#2c6aa0" stroke-width="1.6"/><path d="M95.0 196.0 L98.0 202.3 L92.0 202.3 Z" fill="#2c6aa0"/><rect x="20" y="166" width="150" height="30" rx="8" fill="#fff" stroke="#2c6aa0" stroke-width="1.5"/><text x="95.0" y="184.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25" font-family="sans-serif">α-cells → GLUCAGON</text><line x1="170" y1="181" x2="228.0" y2="181.0" stroke="#2c6aa0" stroke-width="1.6"/><path d="M228.0 181.0 L221.7 184.0 L221.7 178.0 Z" fill="#2c6aa0"/><rect x="230" y="166" width="160" height="80" rx="8" fill="#fff" stroke="#2c6aa0" stroke-width="1.5"/><text x="310.0" y="192.1" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Liver</text><text x="310.0" y="203.6" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">glycogen → glucose;</text><text x="310.0" y="215.1" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">glucose released</text><text x="310.0" y="226.6" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">into the blood</text><line x1="300" y1="166" x2="250.0" y2="158.0" stroke="#2c6aa0" stroke-width="1.6"/><path d="M250.0 158.0 L256.7 156.0 L255.7 162.0 Z" fill="#2c6aa0"/><text x="330" y="156" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#2c6aa0" font-family="sans-serif">level rises</text></g>
<text x="200" y="266" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#55665f" font-family="sans-serif">Insulin puts glucose IN store · glucaGON = glucose GONE, bring it back</text>
</svg>
