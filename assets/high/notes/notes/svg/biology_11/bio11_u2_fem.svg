<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 288">
<text x="200" y="16" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Female reproductive organs (front view, simplified)</text>
<g data-hl="ut"><path d="M160 70 L240 70 Q244 140 214 170 L186 170 Q156 140 160 70 Z" fill="#fbe6e6" stroke="#a03a3a" stroke-width="1.6"/><path d="M176 82 L224 82 Q224 136 206 156 L194 156 Q176 136 176 82 Z" fill="#f6c9c9" stroke="none"/><text x="200" y="110" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">uterus</text><text x="200" y="124" text-anchor="middle" font-size="9" font-weight="normal" fill="#1b2b25" font-family="sans-serif">lining =</text><text x="200" y="135" text-anchor="middle" font-size="9" font-weight="normal" fill="#1b2b25" font-family="sans-serif">endometrium</text></g>
<g data-hl="tb"><path d="M160 76 C130 60 100 60 78 78" fill="none" stroke="#c98a14" stroke-width="5"/><path d="M240 76 C270 60 300 60 322 78" fill="none" stroke="#c98a14" stroke-width="5"/><line x1="78" y1="78" x2="66" y2="92" stroke="#c98a14" stroke-width="2"/><line x1="78" y1="78" x2="71" y2="96" stroke="#c98a14" stroke-width="2"/><line x1="78" y1="78" x2="76" y2="92" stroke="#c98a14" stroke-width="2"/><line x1="78" y1="78" x2="81" y2="96" stroke="#c98a14" stroke-width="2"/><line x1="78" y1="78" x2="86" y2="92" stroke="#c98a14" stroke-width="2"/><line x1="322" y1="78" x2="314" y2="92" stroke="#c98a14" stroke-width="2"/><line x1="322" y1="78" x2="319" y2="96" stroke="#c98a14" stroke-width="2"/><line x1="322" y1="78" x2="324" y2="92" stroke="#c98a14" stroke-width="2"/><line x1="322" y1="78" x2="329" y2="96" stroke="#c98a14" stroke-width="2"/><line x1="322" y1="78" x2="334" y2="92" stroke="#c98a14" stroke-width="2"/><text x="120" y="52" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#7a5a00" font-family="sans-serif">fallopian tube (oviduct)</text><text x="396" y="52" text-anchor="end" font-size="9" font-weight="normal" fill="#7a5a00" font-family="sans-serif">funnel with fimbriae</text></g>
<g data-hl="ov"><ellipse cx="88" cy="112" rx="22" ry="14" fill="#efe7fb" stroke="#6c3fa0" stroke-width="1.6"/><ellipse cx="312" cy="112" rx="22" ry="14" fill="#efe7fb" stroke="#6c3fa0" stroke-width="1.6"/><text x="88" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#6c3fa0" font-family="sans-serif">ovary</text><text x="88" y="155" text-anchor="middle" font-size="9" font-weight="normal" fill="#6c3fa0" font-family="sans-serif">ova + hormones</text><line x1="110" y1="112" x2="166" y2="104" stroke="#6c3fa0" stroke-width="1" stroke-dasharray="3 3"/><text x="140" y="98" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#6c3fa0" font-family="sans-serif">ligament</text></g>
<g data-hl="cx"><rect x="188" y="170" width="24" height="14" rx="4" fill="#f2b8a0" stroke="#a03a3a" stroke-width="1.5"/><text x="250" y="181" text-anchor="start" font-size="9.5" font-weight="normal" fill="#a03a3a" font-family="sans-serif">← cervix (neck)</text></g>
<g data-hl="vg"><path d="M190 184 L184 246 L216 246 L210 184 Z" fill="#fde9ef" stroke="#a03a3a" stroke-width="1.4"/><text x="250" y="220" text-anchor="start" font-size="9.5" font-weight="normal" fill="#a03a3a" font-family="sans-serif">← vagina (10–15 cm)</text><text x="200" y="262" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#55665f" font-family="sans-serif">vulva (outside): labia, clitoris, openings</text></g>
<text x="200" y="280" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#55665f" font-family="sans-serif">egg route: ovary → funnel → tube (fertilised here) → uterus (implants)</text>
</svg>
