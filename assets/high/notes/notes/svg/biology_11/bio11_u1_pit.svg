<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 294">
<text x="200" y="16" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Hypothalamus and the two lobes of the pituitary</text>
<rect x="80" y="26" width="240" height="40" rx="8" fill="#efe7fb" stroke="#6c3fa0" stroke-width="1.5"/>
<text x="200" y="42" text-anchor="middle" font-size="11" font-weight="bold" fill="#6c3fa0" font-family="sans-serif">HYPOTHALAMUS</text>
<text x="200" y="57" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">makes releasing hormones + ADH, oxytocin</text>
<path d="M190 66 L186 96 L214 96 L210 66 Z" fill="#f1e8fb" stroke="#6c3fa0" stroke-width="1.2"/>
<g data-hl="ant"><ellipse cx="160" cy="122" rx="54" ry="30" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1.6"/><text x="160" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2c6aa0" font-family="sans-serif">ANTERIOR</text><text x="160" y="131" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">makes 6 hormones</text><line x1="176" y1="70" x2="160.0" y2="92.0" stroke="#2c6aa0" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M160.0 92.0 L161.2 85.1 L166.2 88.7 Z" fill="#2c6aa0"/><text x="118" y="82" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#2c6aa0" font-family="sans-serif">blood vessels</text></g>
<g data-hl="post"><ellipse cx="250" cy="122" rx="40" ry="28" fill="#fbe6e6" stroke="#a03a3a" stroke-width="1.6"/><text x="250" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a03a3a" font-family="sans-serif">POSTERIOR</text><text x="250" y="131" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">stores 2</text><line x1="210" y1="70" x2="244.0" y2="94.0" stroke="#a03a3a" stroke-width="1.2"/><path d="M244.0 94.0 L237.1 92.9 L240.6 87.9 Z" fill="#a03a3a"/><text x="282" y="82" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#a03a3a" font-family="sans-serif">nerve fibres</text></g>
<g data-hl="ant"><text x="18" y="172" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2c6aa0" font-family="sans-serif">GH</text><text x="80" y="172" text-anchor="start" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">→ bones, muscles</text><text x="18" y="189" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2c6aa0" font-family="sans-serif">TSH</text><text x="80" y="189" text-anchor="start" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">→ thyroid</text><text x="18" y="206" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2c6aa0" font-family="sans-serif">ACTH</text><text x="80" y="206" text-anchor="start" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">→ adrenal cortex</text><text x="18" y="223" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2c6aa0" font-family="sans-serif">Prolactin</text><text x="80" y="223" text-anchor="start" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">→ breasts</text><text x="18" y="240" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2c6aa0" font-family="sans-serif">FSH</text><text x="80" y="240" text-anchor="start" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">→ ovary / testis</text><text x="18" y="257" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2c6aa0" font-family="sans-serif">LH</text><text x="80" y="257" text-anchor="start" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">→ ovary / testis</text></g>
<g data-hl="post"><text x="222" y="172" text-anchor="start" font-size="10.5" font-weight="bold" fill="#a03a3a" font-family="sans-serif">ADH</text><text x="284" y="172" text-anchor="start" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">→ kidney tubules</text><text x="222" y="189" text-anchor="start" font-size="10.5" font-weight="bold" fill="#a03a3a" font-family="sans-serif">Oxytocin</text><text x="284" y="189" text-anchor="start" font-size="10" font-weight="normal" fill="#1b2b25" font-family="sans-serif">→ uterus, breasts</text></g>
<text x="200" y="286" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#55665f" font-family="sans-serif">anterior: “FLAT PG” · posterior: “ADH + OXY” (made in the hypothalamus)</text>
</svg>
