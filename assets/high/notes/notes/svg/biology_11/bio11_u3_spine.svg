<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 305">
<text x="190" y="16" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2b25" font-family="sans-serif">Vertebral column: 33 vertebrae in five regions</text>
<g data-hl="c"><rect x="40" y="30.0" width="40" height="5.4" rx="2" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1"/><rect x="40" y="36.4" width="40" height="5.4" rx="2" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1"/><rect x="40" y="42.8" width="40" height="5.4" rx="2" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1"/><rect x="40" y="49.2" width="40" height="5.4" rx="2" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1"/><rect x="40" y="55.6" width="40" height="5.4" rx="2" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1"/><rect x="40" y="62.0" width="40" height="5.4" rx="2" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1"/><rect x="40" y="68.4" width="40" height="5.4" rx="2" fill="#e6f0fb" stroke="#2c6aa0" stroke-width="1"/><text x="92" y="50.4" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2c6aa0" font-family="sans-serif">Cervical: 7</text><text x="92" y="63.4" text-anchor="start" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">neck; atlas (C1) nods, axis (C2) turns</text></g>
<g data-hl="th"><rect x="40" y="80.8" width="40" height="5.4" rx="2" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1"/><rect x="40" y="87.2" width="40" height="5.4" rx="2" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1"/><rect x="40" y="93.6" width="40" height="5.4" rx="2" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1"/><rect x="40" y="100.0" width="40" height="5.4" rx="2" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1"/><rect x="40" y="106.4" width="40" height="5.4" rx="2" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1"/><rect x="40" y="112.8" width="40" height="5.4" rx="2" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1"/><rect x="40" y="119.2" width="40" height="5.4" rx="2" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1"/><rect x="40" y="125.6" width="40" height="5.4" rx="2" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1"/><rect x="40" y="132.0" width="40" height="5.4" rx="2" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1"/><rect x="40" y="138.4" width="40" height="5.4" rx="2" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1"/><rect x="40" y="144.8" width="40" height="5.4" rx="2" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1"/><rect x="40" y="151.2" width="40" height="5.4" rx="2" fill="#e5f5e7" stroke="#2f7a3e" stroke-width="1"/><text x="92" y="117.2" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2f7a3e" font-family="sans-serif">Thoracic: 12</text><text x="92" y="130.2" text-anchor="start" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">chest; each carries a pair of ribs</text></g>
<g data-hl="lu"><rect x="40" y="163.6" width="40" height="5.4" rx="2" fill="#fff4d6" stroke="#c98a14" stroke-width="1"/><rect x="40" y="170.0" width="40" height="5.4" rx="2" fill="#fff4d6" stroke="#c98a14" stroke-width="1"/><rect x="40" y="176.4" width="40" height="5.4" rx="2" fill="#fff4d6" stroke="#c98a14" stroke-width="1"/><rect x="40" y="182.8" width="40" height="5.4" rx="2" fill="#fff4d6" stroke="#c98a14" stroke-width="1"/><rect x="40" y="189.2" width="40" height="5.4" rx="2" fill="#fff4d6" stroke="#c98a14" stroke-width="1"/><text x="92" y="177.6" text-anchor="start" font-size="10.5" font-weight="bold" fill="#c98a14" font-family="sans-serif">Lumbar: 5</text><text x="92" y="190.6" text-anchor="start" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">lower back; biggest, carry most weight</text></g>
<g data-hl="s"><rect x="40" y="201.6" width="40" height="5.4" rx="2" fill="#fbe6e6" stroke="#a03a3a" stroke-width="1"/><rect x="40" y="208.0" width="40" height="5.4" rx="2" fill="#fbe6e6" stroke="#a03a3a" stroke-width="1"/><rect x="40" y="214.4" width="40" height="5.4" rx="2" fill="#fbe6e6" stroke="#a03a3a" stroke-width="1"/><rect x="40" y="220.8" width="40" height="5.4" rx="2" fill="#fbe6e6" stroke="#a03a3a" stroke-width="1"/><rect x="40" y="227.2" width="40" height="5.4" rx="2" fill="#fbe6e6" stroke="#a03a3a" stroke-width="1"/><text x="92" y="215.6" text-anchor="start" font-size="10.5" font-weight="bold" fill="#a03a3a" font-family="sans-serif">Sacral: 5</text><text x="92" y="228.6" text-anchor="start" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">fused → 1 sacrum; joins the hip girdle</text></g>
<g data-hl="co"><rect x="40" y="239.6" width="40" height="5.4" rx="2" fill="#efe7fb" stroke="#6c3fa0" stroke-width="1"/><rect x="40" y="246.0" width="40" height="5.4" rx="2" fill="#efe7fb" stroke="#6c3fa0" stroke-width="1"/><rect x="40" y="252.4" width="40" height="5.4" rx="2" fill="#efe7fb" stroke="#6c3fa0" stroke-width="1"/><rect x="40" y="258.8" width="40" height="5.4" rx="2" fill="#efe7fb" stroke="#6c3fa0" stroke-width="1"/><text x="92" y="250.4" text-anchor="start" font-size="10.5" font-weight="bold" fill="#6c3fa0" font-family="sans-serif">Caudal (coccygeal): 4</text><text x="92" y="263.4" text-anchor="start" font-size="9.5" font-weight="normal" fill="#1b2b25" font-family="sans-serif">fused → 1 coccyx (vestigial tail)</text></g>
<text x="190" y="283.20000000000005" text-anchor="middle" font-size="10" font-weight="normal" fill="#55665f" font-family="sans-serif">child 7+12+5+5+4 = 33 · adult 7+12+5+1+1 = 26 bones</text>
<text x="190" y="297.20000000000005" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#55665f" font-family="sans-serif">discs of cartilage between vertebrae absorb shock</text>
</svg>
