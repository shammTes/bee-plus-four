<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 258">
<text font-family="HighNunito" x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25">The carbon cycle</text>
<rect x="120" y="120" width="100" height="40" rx="6" fill="#eef5ff" stroke="#8fb2d6" stroke-width="1.4"/><text font-family="HighNunito" x="170" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">CO₂ in air</text><text font-family="HighNunito" x="170" y="151" text-anchor="middle" font-size="8.5" fill="#55665f">≈ 0.04 % by volume</text>
<rect x="10" y="30" width="96" height="36" rx="6" fill="#eef8f1" stroke="#8fc4a2" stroke-width="1.4"/><text font-family="HighNunito" x="58" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">Green plants</text><rect x="234" y="30" width="96" height="36" rx="6" fill="#fff7e6" stroke="#e0b860" stroke-width="1.4"/><text font-family="HighNunito" x="282" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">Animals</text>
<rect x="10" y="214" width="96" height="36" rx="6" fill="#f2eee9" stroke="#b9a58f" stroke-width="1.4"/><text font-family="HighNunito" x="58" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">Fossil fuels</text><text font-family="HighNunito" x="58" y="243" text-anchor="middle" font-size="8.5" fill="#55665f">coal, oil, gas</text><rect x="234" y="214" width="96" height="36" rx="6" fill="#e7f3fb" stroke="#8fb2d6" stroke-width="1.4"/><text font-family="HighNunito" x="282" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">Oceans, rocks</text><text font-family="HighNunito" x="282" y="243" text-anchor="middle" font-size="8.5" fill="#55665f">H₂CO₃, CaCO₃</text>
<line x1="106" y1="48" x2="229.8" y2="48" stroke="#1b2b25" stroke-width="1.2"/><polygon points="234,48 228.5,50.4 228.5,45.6" fill="#1b2b25"/><text font-family="HighNunito" x="170" y="42" text-anchor="middle" font-size="8.5" fill="#55665f">eating (food)</text>
<g data-hl="photo"><line x1="140" y1="120" x2="83.7" y2="71.2" stroke="#2f6f4e" stroke-width="2"/><polygon points="80,68 86.7,70 83,74.3" fill="#2f6f4e"/>
<text font-family="HighNunito" x="56" y="96" font-size="9" fill="#2f6f4e">photosynthesis</text>
<text font-family="HighNunito" x="56" y="107" font-size="8.5" fill="#2f6f4e">(removes CO₂)</text></g>
<g data-hl="resp"><line x1="70" y1="68" x2="121" y2="119" stroke="#c0392b" stroke-width="1.6"/><polygon points="124,122 118.4,119.9 121.9,116.4" fill="#c0392b"/>
<line x1="268" y1="68" x2="213.1" y2="119.1" stroke="#c0392b" stroke-width="1.6"/><polygon points="210,122 212.3,116.5 215.7,120.1" fill="#c0392b"/>
<text font-family="HighNunito" x="282" y="96" text-anchor="end" font-size="9" fill="#c0392b">respiration</text>
<text font-family="HighNunito" x="282" y="107" text-anchor="end" font-size="8.5" fill="#c0392b">(adds CO₂)</text>
<line x1="40" y1="68" x2="40" y2="207.8" stroke="#7a8a84" stroke-width="1.2" stroke-dasharray="3 3"/><polygon points="40,212 37.6,206.5 42.4,206.5" fill="#7a8a84"/>
<text font-family="HighNunito" x="46" y="150" font-size="8" fill="#55665f">dead plants and</text>
<text font-family="HighNunito" x="46" y="160" font-size="8" fill="#55665f">animals buried for</text>
<text font-family="HighNunito" x="46" y="170" font-size="8" fill="#55665f">millions of years</text></g>
<g data-hl="burn"><line x1="106" y1="220" x2="147" y2="165.9" stroke="#e67e22" stroke-width="2"/><polygon points="150,162 148.4,168.8 143.9,165.4" fill="#e67e22"/>
<text font-family="HighNunito" x="132" y="200" font-size="9" fill="#e67e22">burning</text>
<text font-family="HighNunito" x="132" y="211" font-size="8.5" fill="#e67e22">(combustion)</text></g>
<g data-hl="sea"><line x1="212" y1="162" x2="253.2" y2="208.8" stroke="#2f6fa5" stroke-width="1.6"/><polygon points="256,212 250.5,209.5 254.2,206.3" fill="#2f6fa5"/>
<line x1="270" y1="212" x2="224.8" y2="163.1" stroke="#2f6fa5" stroke-width="1.2" stroke-dasharray="4 3"/><polygon points="222,160 227.5,162.4 223.9,165.7" fill="#2f6fa5"/>
<text font-family="HighNunito" x="236" y="184" text-anchor="end" font-size="8.5" fill="#2f6fa5">dissolves</text>
<text font-family="HighNunito" x="300" y="196" text-anchor="end" font-size="8.5" fill="#2f6fa5">released</text></g>
</svg>
