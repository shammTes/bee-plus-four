<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" font-family="sans-serif">
<text x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25">Contact process for sulphuric acid</text>
<g data-hl="burn"><rect x="4" y="40" width="68" height="40" rx="6" fill="#fff1e6" stroke="#e0a060" stroke-width="1.4"/><text x="38" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">Burner</text><text x="38" y="71" text-anchor="middle" font-size="8.5" fill="#55665f">S + O₂ → SO₂</text>
<text x="38" y="96" text-anchor="middle" font-size="8.5" fill="#55665f">sulphur + dry air</text>
<line x1="72" y1="60" x2="83.8" y2="60" stroke="#1b2b25" stroke-width="1.4"/><polygon points="88,60 82.5,62.4 82.5,57.6" fill="#1b2b25"/>
<rect x="88" y="40" width="58" height="40" rx="6" fill="#f4f8f6" stroke="#9fb5ab" stroke-width="1.4"/><text x="117" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">Purifier</text><text x="117" y="71" text-anchor="middle" font-size="8.5" fill="#55665f">dust, H₂O out</text></g>
<g data-hl="conv"><line x1="146" y1="60" x2="157.8" y2="60" stroke="#1b2b25" stroke-width="1.4"/><polygon points="162,60 156.5,62.4 156.5,57.6" fill="#1b2b25"/>
<rect x="162" y="30" width="78" height="60" rx="6" fill="#eef5ff" stroke="#8fb2d6" stroke-width="1.4"/><text x="201" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">Converter</text><text x="201" y="71" text-anchor="middle" font-size="8.5" fill="#55665f">V₂O₅ catalyst</text>
<text x="201" y="102" text-anchor="middle" font-size="8.5" fill="#2f6fa5">≈ 450 °C, 1–2 atm</text>
<text x="201" y="114" text-anchor="middle" font-size="9" font-weight="bold" fill="#2f6fa5">2SO₂ + O₂ ⇌ 2SO₃</text>
<text x="201" y="126" text-anchor="middle" font-size="8.5" fill="#2f6fa5">ΔH = −197 kJ</text></g>
<g data-hl="abs"><line x1="240" y1="60" x2="251.8" y2="60" stroke="#1b2b25" stroke-width="1.4"/><polygon points="256,60 250.5,62.4 250.5,57.6" fill="#1b2b25"/>
<rect x="256" y="24" width="80" height="72" rx="6" fill="#fdecec" stroke="#e09a9a" stroke-width="1.4"/><text x="296" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">Absorber</text><text x="296" y="71" text-anchor="middle" font-size="8.5" fill="#55665f">in 98 % H₂SO₄</text>
<text x="296" y="108" text-anchor="middle" font-size="8.5" fill="#c0392b">SO₃ + H₂SO₄ → H₂S₂O₇</text>
<text x="296" y="120" text-anchor="middle" font-size="8.5" fill="#c0392b">(oleum)</text></g>
<g data-hl="dil"><line x1="296" y1="128" x2="296" y2="155.8" stroke="#1b2b25" stroke-width="1.4"/><polygon points="296,160 293.6,154.5 298.4,154.5" fill="#1b2b25"/>
<rect x="220" y="160" width="116" height="44" rx="6" fill="#eef8f1" stroke="#8fc4a2" stroke-width="1.4"/><text x="278" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">Diluter</text><text x="278" y="193" text-anchor="middle" font-size="8.5" fill="#55665f">water added slowly</text>
<text x="278" y="220" text-anchor="middle" font-size="8.5" fill="#2f6f4e">H₂S₂O₇ + H₂O → 2H₂SO₄</text>
<line x1="220" y1="182" x2="154.9" y2="182" stroke="#2f6f4e" stroke-width="1.6"/><polygon points="150,182 156.4,179.1 156.4,184.9" fill="#2f6f4e"/>
<text x="84" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f6f4e">98 % H₂SO₄</text>
<text x="84" y="192" text-anchor="middle" font-size="8.5" fill="#55665f">(part returns to absorber)</text></g>
<text x="110" y="240" text-anchor="middle" font-size="8.5" fill="#c0392b">Never SO₃ straight into water: a fine acid mist forms.</text>
</svg>
