<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 214" font-family="sans-serif">
<text x="170" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25">Ideal gas vs real gas (van der Waals)</text>
<rect x="30" y="36" width="170" height="130" rx="4" fill="#ffffff" stroke="#55665f" stroke-width="2"/>
<g data-s="i"><circle cx="60" cy="60" r="2" fill="#2f6fa5"/><circle cx="120" cy="54" r="2" fill="#2f6fa5"/><circle cx="170" cy="70" r="2" fill="#2f6fa5"/><circle cx="80" cy="110" r="2" fill="#2f6fa5"/><circle cx="140" cy="100" r="2" fill="#2f6fa5"/><circle cx="180" cy="130" r="2" fill="#2f6fa5"/><circle cx="60" cy="150" r="2" fill="#2f6fa5"/><circle cx="120" cy="146" r="2" fill="#2f6fa5"/>
<text x="276" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">ideal model:</text>
<text x="276" y="86" text-anchor="middle" font-size="9" fill="#55665f">particles are points</text>
<text x="276" y="100" text-anchor="middle" font-size="9" fill="#55665f">no attractions</text>
<text x="276" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f6fa5">PV = nRT</text></g>
<g data-s="v"><circle cx="60" cy="60" r="11" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/><circle cx="120" cy="54" r="11" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/><circle cx="170" cy="70" r="11" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/><circle cx="80" cy="110" r="11" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/><circle cx="140" cy="100" r="11" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/><circle cx="180" cy="130" r="11" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/><circle cx="60" cy="150" r="11" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/><circle cx="120" cy="146" r="11" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/>
<text x="276" y="64" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">real particles</text>
<text x="276" y="80" text-anchor="middle" font-size="9" fill="#55665f">take up space</text>
<text x="276" y="94" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67e22">free volume = V − nb</text>
<text x="276" y="112" text-anchor="middle" font-size="9" fill="#55665f">matters at HIGH P</text>
<text x="276" y="124" text-anchor="middle" font-size="9" fill="#55665f">(little empty space)</text></g>
<g data-s="p"><circle cx="60" cy="60" r="6" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/><circle cx="120" cy="54" r="6" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/><circle cx="170" cy="70" r="6" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/><circle cx="80" cy="110" r="6" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/><circle cx="140" cy="100" r="6" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/><circle cx="180" cy="130" r="6" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/><circle cx="60" cy="150" r="6" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/><circle cx="120" cy="146" r="6" fill="#cfe0f2" stroke="#6c8fb3" stroke-width="1"/>
<circle cx="190" cy="100" r="6" fill="#f6d58b" stroke="#c98a14" stroke-width="1.5"/>
<line x1="186" y1="100" x2="163.5" y2="100" stroke="#c0392b" stroke-width="1.4"/><polygon points="160,100 164.6,98 164.6,102" fill="#c0392b"/>
<line x1="188" y1="104" x2="174.2" y2="121.3" stroke="#c0392b" stroke-width="1.4"/><polygon points="172,124 173.3,119.2 176.4,121.7" fill="#c0392b"/>
<line x1="188" y1="96" x2="176" y2="78.9" stroke="#c0392b" stroke-width="1.4"/><polygon points="174,76 178.3,78.6 174.9,80.9" fill="#c0392b"/>
<text x="276" y="64" text-anchor="middle" font-size="9" fill="#55665f">neighbours pull a</text>
<text x="276" y="76" text-anchor="middle" font-size="9" fill="#55665f">particle back from</text>
<text x="276" y="88" text-anchor="middle" font-size="9" fill="#55665f">the wall → lower P</text>
<text x="276" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">P + an²/V²</text>
<text x="276" y="124" text-anchor="middle" font-size="9" fill="#55665f">matters at LOW T</text></g>
<rect x="20" y="176" width="300" height="30" rx="6" fill="#f7f3fb" stroke="#ddd0ea" stroke-width="1"/>
<text x="170" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#7d3c98">(P + an²/V²)(V − nb) = nRT</text>
</svg>
