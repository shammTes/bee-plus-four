<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220">
<rect width="640" height="220" fill="#f6f3fb"/>
<text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#2c2440">Boyle: pressure up, volume down</text>
<rect x="60" y="70" width="200" height="90" fill="#d9d2ee" stroke="#3a3158"/>
<text x="160" y="110" text-anchor="middle" font-family="sans-serif" font-size="14">P = 1, V = 4</text>
<text x="160" y="132" text-anchor="middle" font-family="sans-serif" font-size="14">P times V = 4</text>
<rect x="380" y="90" width="100" height="70" fill="#c4b6e6" stroke="#3a3158"/>
<text x="430" y="120" text-anchor="middle" font-family="sans-serif" font-size="14">P = 2</text>
<text x="430" y="142" text-anchor="middle" font-family="sans-serif" font-size="14">V = 2</text>
<text x="320" y="200" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Temperature stays the same. The product P times V does not change.</text>
</svg>
