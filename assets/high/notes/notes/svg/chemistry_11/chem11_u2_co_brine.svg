<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 266" font-family="sans-serif">
<text x="170" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">NaCl(aq), inert electrodes: which ion is discharged?</text>
<path d="M56 70 L60 74 L60 190 L280 190 L280 74 L284 70" fill="none" stroke="#55665f" stroke-width="2"/>
<rect x="62" y="100" width="216" height="89" fill="#cfe8f5"/>
<rect x="96" y="50" width="16" height="120" fill="#5d6d68"/><rect x="228" y="50" width="16" height="120" fill="#5d6d68"/>
<line x1="104" y1="50" x2="104" y2="34" stroke="#1b2b25" stroke-width="1.4"/><line x1="104" y1="34" x2="236" y2="34" stroke="#1b2b25" stroke-width="1.4"/><line x1="236" y1="34" x2="236" y2="50" stroke="#1b2b25" stroke-width="1.4"/>
<rect x="150" y="26" width="40" height="16" fill="#ffffff" stroke="#1b2b25" stroke-width="1.2"/><line x1="166" y1="29" x2="166" y2="39" stroke="#1b2b25" stroke-width="2"/><line x1="174" y1="31" x2="174" y2="37" stroke="#1b2b25" stroke-width="1.2"/><text x="170" y="22" text-anchor="middle" font-size="8.5" fill="#55665f">d.c.</text>
<text x="104" y="206" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f6fa5">−  cathode</text><text x="236" y="206" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#c0392b">anode  +</text>
<text x="170" y="120" text-anchor="middle" font-size="10" fill="#55665f">Na⁺  H⁺</text><text x="170" y="136" text-anchor="middle" font-size="10" fill="#55665f">Cl⁻  OH⁻</text><line x1="150" y1="150" x2="121.5" y2="150" stroke="#2f6fa5" stroke-width="1.2"/><polygon points="118,150 122.6,148 122.6,152" fill="#2f6fa5"/><line x1="190" y1="150" x2="218.5" y2="150" stroke="#c0392b" stroke-width="1.2"/><polygon points="222,150 217.4,152 217.4,148" fill="#c0392b"/>
<g data-s="dilute"><circle cx="108" cy="150" r="3" fill="#ffffff" stroke="#55665f" stroke-width="1"/>
<circle cx="108" cy="136" r="3" fill="#ffffff" stroke="#55665f" stroke-width="1"/>
<circle cx="108" cy="122" r="3" fill="#ffffff" stroke="#55665f" stroke-width="1"/>
<circle cx="232" cy="150" r="3" fill="#ffffff" stroke="#55665f" stroke-width="1"/>
<circle cx="232" cy="136" r="3" fill="#ffffff" stroke="#55665f" stroke-width="1"/>
<circle cx="232" cy="122" r="3" fill="#ffffff" stroke="#55665f" stroke-width="1"/>
<text x="104" y="224" text-anchor="middle" font-size="9" fill="#2f6fa5">H₂ (H⁺ discharged)</text>
<text x="244" y="224" text-anchor="middle" font-size="9" fill="#c0392b">O₂ (OH⁻ discharged)</text>
<text x="170" y="244" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b2b25">dilute: OH⁻ is easier to discharge → O₂</text>
<text x="170" y="258" text-anchor="middle" font-size="9" fill="#55665f">solution left: more concentrated NaCl</text></g>
<g data-s="conc"><circle cx="108" cy="150" r="3" fill="#ffffff" stroke="#55665f" stroke-width="1"/>
<circle cx="108" cy="136" r="3" fill="#ffffff" stroke="#55665f" stroke-width="1"/>
<circle cx="108" cy="122" r="3" fill="#ffffff" stroke="#55665f" stroke-width="1"/>
<circle cx="232" cy="150" r="3" fill="#ffffff" stroke="#55665f" stroke-width="1"/>
<circle cx="232" cy="136" r="3" fill="#ffffff" stroke="#55665f" stroke-width="1"/>
<circle cx="232" cy="122" r="3" fill="#ffffff" stroke="#55665f" stroke-width="1"/>
<text x="104" y="224" text-anchor="middle" font-size="9" fill="#2f6fa5">H₂ (H⁺ discharged)</text>
<text x="244" y="224" text-anchor="middle" font-size="9" fill="#c0392b">Cl₂ (Cl⁻ discharged)</text>
<text x="170" y="244" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b2b25">concentrated (brine): far more Cl⁻ → Cl₂ wins</text>
<text x="170" y="258" text-anchor="middle" font-size="9" fill="#55665f">solution left: NaOH(aq) — industrial NaOH</text></g>
</svg>
