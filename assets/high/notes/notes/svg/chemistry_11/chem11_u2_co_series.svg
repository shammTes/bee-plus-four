<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 248">
<text font-family="HighNunito" x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25">Faraday’s second law: two cells in series</text>
<g data-hl="ag"><path d="M36 70 L40 74 L40 170 L150 170 L150 74 L154 70" fill="none" stroke="#55665f" stroke-width="2"/>
<rect x="42" y="96" width="106" height="73" fill="#e8eef2"/>
<rect x="60" y="56" width="10" height="96" fill="#5d6d68"/>
<rect x="120" y="56" width="10" height="96" fill="#5d6d68"/>
<text font-family="HighNunito" x="95" y="190" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b2b25">AgNO₃(aq)</text>
<text font-family="HighNunito" x="95" y="204" text-anchor="middle" font-size="9" fill="#2f6fa5">Ag<tspan font-family="HighSymbols">⁺</tspan> + e<tspan font-family="HighSymbols">⁻</tspan><tspan dx="2.6" font-family="HighSymbols2">→</tspan> Ag</text>
<text font-family="HighNunito" x="95" y="218" text-anchor="middle" font-size="8.5" fill="#55665f">1 mol e<tspan font-family="HighSymbols">⁻</tspan><tspan dx="2.6" font-family="HighSymbols2">→</tspan> 1 mol Ag (108 g)</text></g>
<g data-hl="ni"><path d="M186 70 L190 74 L190 170 L300 170 L300 74 L304 70" fill="none" stroke="#55665f" stroke-width="2"/>
<rect x="192" y="96" width="106" height="73" fill="#cdeccf"/>
<rect x="210" y="56" width="10" height="96" fill="#5d6d68"/>
<rect x="270" y="56" width="10" height="96" fill="#5d6d68"/>
<text font-family="HighNunito" x="245" y="190" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b2b25">Ni(NO₃)₂(aq)</text>
<text font-family="HighNunito" x="245" y="204" text-anchor="middle" font-size="9" fill="#2f6fa5">Ni²<tspan font-family="HighSymbols">⁺</tspan> + 2e<tspan font-family="HighSymbols">⁻</tspan><tspan dx="2.6" font-family="HighSymbols2">→</tspan> Ni</text>
<text font-family="HighNunito" x="245" y="218" text-anchor="middle" font-size="8.5" fill="#55665f">1 mol e<tspan font-family="HighSymbols">⁻</tspan><tspan dx="2.6" font-family="HighSymbols2">→</tspan> ½ mol Ni (29.5 g)</text></g>
<g data-hl="q"><line x1="65" y1="56" x2="65" y2="36" stroke="#1b2b25" stroke-width="1.4"/>
<line x1="65" y1="36" x2="150" y2="36" stroke="#1b2b25" stroke-width="1.4"/>
<rect x="150" y="28" width="40" height="16" fill="#ffffff" stroke="#1b2b25" stroke-width="1.2"/>
<line x1="190" y1="36" x2="275" y2="36" stroke="#1b2b25" stroke-width="1.4"/>
<line x1="275" y1="36" x2="275" y2="56" stroke="#1b2b25" stroke-width="1.4"/>
<line x1="125" y1="56" x2="125" y2="46" stroke="#1b2b25" stroke-width="1.4"/>
<line x1="125" y1="46" x2="210" y2="46" stroke="#1b2b25" stroke-width="1.4"/>
<line x1="210" y1="46" x2="210" y2="56" stroke="#1b2b25" stroke-width="1.4"/>
<text font-family="HighNunito" x="170" y="24" text-anchor="middle" font-size="9" fill="#55665f">same current, same time<tspan dx="2.6" font-family="HighSymbols2">→</tspan> same charge Q</text>
<text font-family="HighNunito" x="170" y="240" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b2b25">mass₁ : mass₂ = equivalent mass₁ : equivalent mass₂</text></g>
</svg>
