<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 268" font-family="sans-serif">
<text x="180" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25">Building the ideal gas equation</text>
<g data-hl="b"><rect x="8" y="30" width="108" height="42" rx="8" fill="#e3f1f8" stroke="#7a8a84" stroke-width="1.2"/>
<text x="62" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Boyle: V ∝ 1/P</text>
<text x="62" y="62" text-anchor="middle" font-size="9" fill="#55665f">n, T fixed</text></g>
<g data-hl="c"><rect x="126" y="30" width="108" height="42" rx="8" fill="#fde6df" stroke="#7a8a84" stroke-width="1.2"/>
<text x="180" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Charles: V ∝ T</text>
<text x="180" y="62" text-anchor="middle" font-size="9" fill="#55665f">n, P fixed</text></g>
<g data-hl="a"><rect x="244" y="30" width="108" height="42" rx="8" fill="#dff0e4" stroke="#7a8a84" stroke-width="1.2"/>
<text x="298" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Avogadro: V ∝ n</text>
<text x="298" y="62" text-anchor="middle" font-size="9" fill="#55665f">P, T fixed</text></g>
<line x1="62" y1="72" x2="146.5" y2="96.8" stroke="#1b2b25" stroke-width="1.4"/><polygon points="150.5,98 144.6,98.8 145.9,94.1" fill="#1b2b25"/>
<line x1="180" y1="72" x2="180" y2="93.8" stroke="#1b2b25" stroke-width="1.4"/><polygon points="180,98 177.6,92.5 182.4,92.5" fill="#1b2b25"/>
<line x1="298" y1="72" x2="213.5" y2="96.8" stroke="#1b2b25" stroke-width="1.4"/><polygon points="209.5,98 214.1,94.1 215.4,98.8" fill="#1b2b25"/>
<g data-hl="comb"><rect x="110" y="100" width="140" height="40" rx="8" fill="#fff4d6" stroke="#7a8a84" stroke-width="1.2"/>
<text x="180" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">V ∝ nT / P</text>
<text x="180" y="132" text-anchor="middle" font-size="9" fill="#55665f">all three together</text></g>
<line x1="180" y1="140" x2="180" y2="153.8" stroke="#1b2b25" stroke-width="1.4"/><polygon points="180,158 177.6,152.5 182.4,152.5" fill="#1b2b25"/>
<g data-hl="pv"><rect x="90" y="160" width="180" height="42" rx="8" fill="#efe4f7" stroke="#7a8a84" stroke-width="1.2"/>
<text x="180" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">PV = nRT</text>
<text x="180" y="192" text-anchor="middle" font-size="9" fill="#55665f">R = 8.314 J/(mol·K) = 0.0821 L·atm/(mol·K)</text></g>
<line x1="180" y1="202" x2="180" y2="213.8" stroke="#1b2b25" stroke-width="1.4"/><polygon points="180,218 177.6,212.5 182.4,212.5" fill="#1b2b25"/>
<g data-hl="d"><rect x="70" y="220" width="220" height="42" rx="8" fill="#f3f3f3" stroke="#7a8a84" stroke-width="1.2"/>
<text x="180" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">n = m/M, d = m/V  →  PM = dRT</text>
<text x="180" y="252" text-anchor="middle" font-size="9" fill="#55665f">density of a gas from P, T and M</text></g>
</svg>
