<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 414" font-family="sans-serif">
<text x="180" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25">Activity (reactivity) series of metals</text>
<rect x="40" y="30" width="96" height="18" rx="4" fill="#dbe8f5"/>
<text x="58" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">K</text><text x="76" y="44" font-size="9" fill="#55665f">potassium</text>
<rect x="40" y="50" width="96" height="18" rx="4" fill="#dbe8f5"/>
<text x="58" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Na</text><text x="76" y="64" font-size="9" fill="#55665f">sodium</text>
<rect x="40" y="70" width="96" height="18" rx="4" fill="#dbe8f5"/>
<text x="58" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Ca</text><text x="76" y="84" font-size="9" fill="#55665f">calcium</text>
<rect x="40" y="90" width="96" height="18" rx="4" fill="#dbe8f5"/>
<text x="58" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Mg</text><text x="76" y="104" font-size="9" fill="#55665f">magnesium</text>
<rect x="40" y="110" width="96" height="18" rx="4" fill="#dbe8f5"/>
<text x="58" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Al</text><text x="76" y="124" font-size="9" fill="#55665f">aluminium</text>
<rect x="40" y="130" width="96" height="18" rx="4" fill="#eef2f0"/>
<text x="58" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#55665f">(C)</text><text x="76" y="144" font-size="9" fill="#55665f">carbon</text>
<rect x="40" y="150" width="96" height="18" rx="4" fill="#dbe8f5"/>
<text x="58" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Zn</text><text x="76" y="164" font-size="9" fill="#55665f">zinc</text>
<rect x="40" y="170" width="96" height="18" rx="4" fill="#dbe8f5"/>
<text x="58" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Fe</text><text x="76" y="184" font-size="9" fill="#55665f">iron</text>
<rect x="40" y="190" width="96" height="18" rx="4" fill="#dbe8f5"/>
<text x="58" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Sn</text><text x="76" y="204" font-size="9" fill="#55665f">tin</text>
<rect x="40" y="210" width="96" height="18" rx="4" fill="#dbe8f5"/>
<text x="58" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Pb</text><text x="76" y="224" font-size="9" fill="#55665f">lead</text>
<rect x="40" y="230" width="96" height="18" rx="4" fill="#eef2f0"/>
<text x="58" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#55665f">(H)</text><text x="76" y="244" font-size="9" fill="#55665f">hydrogen</text>
<rect x="40" y="250" width="96" height="18" rx="4" fill="#dbe8f5"/>
<text x="58" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Cu</text><text x="76" y="264" font-size="9" fill="#55665f">copper</text>
<rect x="40" y="270" width="96" height="18" rx="4" fill="#dbe8f5"/>
<text x="58" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Hg</text><text x="76" y="284" font-size="9" fill="#55665f">mercury</text>
<rect x="40" y="290" width="96" height="18" rx="4" fill="#dbe8f5"/>
<text x="58" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Ag</text><text x="76" y="304" font-size="9" fill="#55665f">silver</text>
<rect x="40" y="310" width="96" height="18" rx="4" fill="#dbe8f5"/>
<text x="58" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Au</text><text x="76" y="324" font-size="9" fill="#55665f">gold</text>
<rect x="40" y="330" width="96" height="18" rx="4" fill="#dbe8f5"/>
<text x="58" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">Pt</text><text x="76" y="344" font-size="9" fill="#55665f">platinum</text>
<line x1="22" y1="346" x2="22" y2="38.9" stroke="#c0392b" stroke-width="2"/><polygon points="22,34 24.9,40.4 19.1,40.4" fill="#c0392b"/><text x="14" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b" transform="rotate(-90 14 180)">more reactive</text>
<g data-hl="water"><path d="M142 31 L148 31 L148 87 L142 87" fill="none" stroke="#2f6fa5" stroke-width="1.6"/><text x="154" y="58.5" font-size="9" fill="#2f6fa5">react with cold water</text><text x="154" y="69.5" font-size="9" fill="#2f6fa5">→ hydroxide + H₂</text>
<path d="M142 91 L148 91 L148 187 L142 187" fill="none" stroke="#2f6fa5" stroke-width="1.6"/><text x="154" y="138.5" font-size="9" fill="#2f6fa5">react with steam</text><text x="154" y="149.5" font-size="9" fill="#2f6fa5">→ oxide + H₂</text>
<path d="M142 191 L148 191 L148 347 L142 347" fill="none" stroke="#2f6fa5" stroke-width="1.6"/><text x="154" y="268.5" font-size="9" fill="#2f6fa5">no reaction with</text><text x="154" y="279.5" font-size="9" fill="#2f6fa5">water or steam</text></g>
<g data-hl="acid"><path d="M262 31 L268 31 L268 227 L262 227" fill="none" stroke="#c0392b" stroke-width="1.6"/><text x="274" y="123" font-size="9" fill="#c0392b">above H: give</text><text x="274" y="134" font-size="9" fill="#c0392b">H₂ with dilute</text><text x="274" y="145" font-size="9" fill="#c0392b">acids</text>
<path d="M262 251 L268 251 L268 347 L262 347" fill="none" stroke="#c0392b" stroke-width="1.6"/><text x="274" y="293" font-size="9" fill="#c0392b">below H: no</text><text x="274" y="304" font-size="9" fill="#c0392b">H₂ with dilute</text><text x="274" y="315" font-size="9" fill="#c0392b">acids</text></g>
<g data-hl="extract"><rect x="150" y="354" width="200" height="54" rx="6" fill="#fffaf0" stroke="#c98a14" stroke-width="1"/>
<text x="158" y="368" font-size="9" font-weight="bold" fill="#7a4b12">extraction:</text>
<text x="158" y="380" font-size="9" fill="#7a4b12">K → Al: electrolysis of molten compound</text>
<text x="158" y="391" font-size="9" fill="#7a4b12">Zn → Cu: reduce oxide with C or CO</text>
<text x="158" y="402" font-size="9" fill="#7a4b12">Ag, Au, Pt: found native (uncombined)</text></g>
<text x="88" y="368" text-anchor="middle" font-size="9" fill="#55665f">a metal displaces any</text><text x="88" y="380" text-anchor="middle" font-size="9" fill="#55665f">metal BELOW it from</text><text x="88" y="392" text-anchor="middle" font-size="9" fill="#55665f">a solution of its salt</text>
</svg>
