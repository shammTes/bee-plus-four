<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 272">
<text font-family="HighNunito" x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25">Frasch process: three pipes, one inside another</text>
<rect x="0" y="70" width="340" height="200" fill="#efe7d6"/><rect x="0" y="70" width="340" height="4" fill="#8c7a5b"/><text font-family="HighNunito" x="330" y="88" text-anchor="end" font-size="8.5" fill="#8c7a5b">clay, sand, rock</text>
<rect x="0" y="210" width="340" height="60" fill="#f6e27a"/><text font-family="HighNunito" x="330" y="262" text-anchor="end" font-size="8.5" fill="#8a6d00">sulphur deposit (deep underground)</text>
<g data-hl="water"><rect x="130" y="30" width="80" height="210" fill="#d6ecfa" stroke="#55665f" stroke-width="1.4"/>
<text font-family="HighNunito" x="110" y="50" text-anchor="end" font-size="9" fill="#2f6fa5">superheated water</text>
<text font-family="HighNunito" x="110" y="61" text-anchor="end" font-size="8.5" fill="#2f6fa5">≈ 170 °C, under pressure</text>
<line x1="116" y1="44" x2="131.8" y2="44" stroke="#2f6fa5" stroke-width="1.4"/><polygon points="136,44 130.5,46.4 130.5,41.6" fill="#2f6fa5"/>
<line x1="138" y1="120" x2="138" y2="195.8" stroke="#2f6fa5" stroke-width="1.6"/><polygon points="138,200 135.6,194.5 140.4,194.5" fill="#2f6fa5"/>
<line x1="202" y1="120" x2="202" y2="195.8" stroke="#2f6fa5" stroke-width="1.6"/><polygon points="202,200 199.6,194.5 204.4,194.5" fill="#2f6fa5"/>
<text font-family="HighNunito" x="64" y="236" text-anchor="middle" font-size="9" fill="#2f6fa5">hot water melts S</text>
<text font-family="HighNunito" x="64" y="247" text-anchor="middle" font-size="8.5" fill="#2f6fa5">(m.p. ≈ 115 °C)</text></g>
<g data-hl="up"><rect x="148" y="30" width="44" height="216" fill="#fff3b0" stroke="#b59a1c" stroke-width="1.2"/>
<text font-family="HighNunito" x="232" y="40" font-size="9" fill="#8a6d00">molten sulphur + water</text>
<text font-family="HighNunito" x="232" y="51" font-size="8.5" fill="#8a6d00">+ air froth comes up</text>
<line x1="170" y1="200" x2="170" y2="38.9" stroke="#b8860b" stroke-width="1.8"/><polygon points="170,34 172.9,40.4 167.1,40.4" fill="#b8860b"/>
<line x1="192" y1="44" x2="223.8" y2="44" stroke="#b8860b" stroke-width="1.2"/><polygon points="228,44 222.5,46.4 222.5,41.6" fill="#b8860b"/>
<text font-family="HighNunito" x="232" y="62" font-size="8.5" fill="#8a6d00"><tspan font-family="HighSymbols2">→</tspan> cooled: ≈ 99.5 % pure S</text></g>
<g data-hl="air"><rect x="164" y="18" width="12" height="236" fill="#ffffff" stroke="#55665f" stroke-width="1.2"/>
<text font-family="HighNunito" x="170" y="26" text-anchor="middle" font-size="8" fill="#1b2b25"></text>
<text font-family="HighNunito" x="236" y="120" font-size="9" fill="#c0392b">hot compressed air</text>
<text font-family="HighNunito" x="236" y="131" font-size="8.5" fill="#c0392b">(smallest, inner pipe)</text>
<line x1="234" y1="124" x2="176" y2="124" stroke="#7a8a84" stroke-width="1"/>
<line x1="170" y1="150" x2="170" y2="247.8" stroke="#c0392b" stroke-width="1.4"/><polygon points="170,252 167.6,246.5 172.4,246.5" fill="#c0392b"/></g>
</svg>
