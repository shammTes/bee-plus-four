<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 248">
<text font-family="HighNunito" x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25">Electroplating a spoon with silver</text>
<path d="M56 70 L60 74 L60 190 L280 190 L280 74 L284 70" fill="none" stroke="#55665f" stroke-width="2"/><rect x="62" y="100" width="216" height="89" fill="#e8eef2"/>
<line x1="104" y1="50" x2="104" y2="34" stroke="#1b2b25" stroke-width="1.4"/><line x1="104" y1="34" x2="236" y2="34" stroke="#1b2b25" stroke-width="1.4"/><line x1="236" y1="34" x2="236" y2="50" stroke="#1b2b25" stroke-width="1.4"/><rect x="150" y="26" width="40" height="16" fill="#ffffff" stroke="#1b2b25" stroke-width="1.2"/><line x1="166" y1="29" x2="166" y2="39" stroke="#1b2b25" stroke-width="2"/><line x1="174" y1="31" x2="174" y2="37" stroke="#1b2b25" stroke-width="1.2"/><text font-family="HighNunito" x="146" y="30" text-anchor="end" font-size="10" fill="#2f6fa5">−</text><text font-family="HighNunito" x="194" y="30" font-size="10" fill="#c0392b">+</text>
<g data-hl="cathode"><path d="M104 50 L104 120" fill="none" stroke="#8a9a94" stroke-width="5"/><path d="M104 120 C86 124 86 168 104 172 C122 168 122 124 104 120 Z" fill="#c9d1d4" stroke="#8a9a94" stroke-width="1.4"/>
<text font-family="HighNunito" x="104" y="206" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f6fa5">cathode (−): the spoon</text>
<text font-family="HighNunito" x="104" y="219" text-anchor="middle" font-size="8.5" fill="#2f6fa5">Ag<tspan font-family="HighSymbols">⁺</tspan> + e<tspan font-family="HighSymbols">⁻</tspan><tspan dx="2.6" font-family="HighSymbols2">→</tspan> Ag (silver layer)</text></g>
<g data-hl="anode"><rect x="228" y="50" width="16" height="120" fill="#d5dbe0" stroke="#9aa5ab" stroke-width="1"/>
<text font-family="HighNunito" x="236" y="206" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#c0392b">anode (+): pure silver</text>
<text font-family="HighNunito" x="236" y="219" text-anchor="middle" font-size="8.5" fill="#c0392b">Ag<tspan dx="2.6" font-family="HighSymbols2">→</tspan> Ag<tspan font-family="HighSymbols">⁺</tspan> + e<tspan font-family="HighSymbols">⁻</tspan> (dissolves)</text></g>
<g data-hl="ions"><text font-family="HighNunito" x="170" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#55665f">Ag<tspan font-family="HighSymbols">⁺</tspan>(aq)</text>
<line x1="212" y1="146" x2="134.2" y2="146" stroke="#55665f" stroke-width="1.4"/><polygon points="130,146 135.5,143.6 135.5,148.4" fill="#55665f"/>
<text font-family="HighNunito" x="170" y="164" text-anchor="middle" font-size="8.5" fill="#55665f">electrolyte: AgNO₃(aq)</text>
<text font-family="HighNunito" x="170" y="240" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b2b25">Ag<tspan font-family="HighSymbols">⁺</tspan> leaving the solution = Ag<tspan font-family="HighSymbols">⁺</tspan> entering it<tspan dx="2.6" font-family="HighSymbols2">→</tspan> concentration stays the same</text></g>
</svg>
