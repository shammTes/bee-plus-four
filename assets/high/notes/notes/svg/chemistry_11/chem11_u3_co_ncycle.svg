<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 298">
<text font-family="HighNunito" x="10" y="14" font-size="12" font-weight="bold" fill="#1b2b25">The nitrogen cycle</text>
<rect x="110" y="26" width="120" height="34" rx="6" fill="#eef5ff" stroke="#8fb2d6" stroke-width="1.4"/><text font-family="HighNunito" x="170" y="47" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">N₂ in air (78 %)</text>
<rect x="10" y="140" width="100" height="36" rx="6" fill="#eef8f1" stroke="#8fc4a2" stroke-width="1.4"/><text font-family="HighNunito" x="60" y="162" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">Plant proteins</text><rect x="10" y="236" width="100" height="36" rx="6" fill="#fff7e6" stroke="#e0b860" stroke-width="1.4"/><text font-family="HighNunito" x="60" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">Animal proteins</text>
<rect x="124" y="236" width="92" height="36" rx="6" fill="#f2eee9" stroke="#b9a58f" stroke-width="1.4"/><text font-family="HighNunito" x="170" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">NH₃ / NH₄<tspan font-family="HighSymbols">⁺</tspan></text><text font-family="HighNunito" x="170" y="265" text-anchor="middle" font-size="8.5" fill="#55665f">in soil</text><rect x="262" y="140" width="100" height="36" rx="6" fill="#f2eee9" stroke="#b9a58f" stroke-width="1.4"/><text font-family="HighNunito" x="312" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">Nitrates NO₃<tspan font-family="HighSymbols">⁻</tspan></text><text font-family="HighNunito" x="312" y="169" text-anchor="middle" font-size="8.5" fill="#55665f">in soil</text>
<g data-hl="fix"><line x1="140" y1="60" x2="66.9" y2="135" stroke="#2f6f4e" stroke-width="1.6"/><polygon points="64,138 66.1,132.4 69.6,135.8" fill="#2f6f4e"/>
<text font-family="HighNunito" x="88" y="92" text-anchor="end" font-size="8.5" fill="#2f6f4e">fixing bacteria</text>
<text font-family="HighNunito" x="88" y="103" text-anchor="end" font-size="8" fill="#2f6f4e">(legume roots)</text>
<line x1="222" y1="60" x2="297" y2="135" stroke="#e67e22" stroke-width="1.6"/><polygon points="300,138 294.4,135.9 297.9,132.4" fill="#e67e22"/>
<text font-family="HighNunito" x="272" y="84" font-size="8" fill="#e67e22">lightning:</text>
<text font-family="HighNunito" x="272" y="95" font-size="8" fill="#e67e22">N₂ + O₂<tspan dx="2.6" font-family="HighSymbols2">→</tspan> 2NO</text>
<text font-family="HighNunito" x="272" y="106" font-size="8" fill="#e67e22"><tspan font-family="HighSymbols2">→</tspan> HNO₃ in rain</text>
<line x1="170" y1="60" x2="170" y2="229.8" stroke="#7a8a84" stroke-width="1.2" stroke-dasharray="4 3"/><polygon points="170,234 167.6,228.5 172.4,228.5" fill="#7a8a84"/>
<text font-family="HighNunito" x="164" y="196" text-anchor="end" font-size="8" fill="#55665f">Haber process</text>
<text font-family="HighNunito" x="164" y="206" text-anchor="end" font-size="8" fill="#55665f">N₂ + 3H₂<tspan dx="2.6" font-family="HighSymbols2">⇌</tspan> 2NH₃</text>
<text font-family="HighNunito" x="164" y="216" text-anchor="end" font-size="8" fill="#55665f">(fertilisers)</text></g>
<g data-hl="nitrify"><line x1="216" y1="250" x2="287" y2="180.9" stroke="#2f6fa5" stroke-width="1.6"/><polygon points="290,178 287.8,183.6 284.4,180.1" fill="#2f6fa5"/>
<text font-family="HighNunito" x="262" y="226" font-size="8.5" fill="#2f6fa5">nitrifying bacteria</text>
<text font-family="HighNunito" x="262" y="237" font-size="8" fill="#2f6fa5">NH₄<tspan font-family="HighSymbols">⁺</tspan><tspan dx="2.6" font-family="HighSymbols2">→</tspan> NO₂<tspan font-family="HighSymbols">⁻</tspan><tspan dx="2.6" font-family="HighSymbols2">→</tspan> NO₃<tspan font-family="HighSymbols">⁻</tspan></text>
<line x1="110" y1="254" x2="118.5" y2="254" stroke="#1b2b25" stroke-width="1.2"/><polygon points="122,254 117.4,256 117.4,252" fill="#1b2b25"/>
<line x1="60" y1="176" x2="60" y2="229.8" stroke="#1b2b25" stroke-width="1.2"/><polygon points="60,234 57.6,228.5 62.4,228.5" fill="#1b2b25"/>
<text font-family="HighNunito" x="64" y="210" font-size="8.5" fill="#55665f">eating</text>
<text font-family="HighNunito" x="116" y="290" text-anchor="middle" font-size="8.5" fill="#55665f">death, waste<tspan dx="2.6" font-family="HighSymbols2">→</tspan> decomposers<tspan dx="2.6" font-family="HighSymbols2">→</tspan> ammonia</text></g>
<g data-hl="plants"><line x1="262" y1="158" x2="116.9" y2="158" stroke="#2f6f4e" stroke-width="1.8"/><polygon points="112,158 118.4,155.1 118.4,160.9" fill="#2f6f4e"/>
<text font-family="HighNunito" x="222" y="152" text-anchor="middle" font-size="8.5" fill="#2f6f4e">roots absorb NO₃<tspan font-family="HighSymbols">⁻</tspan></text></g>
<g data-hl="denit"><path d="M350 140 L350 22 L246 22" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<line x1="250" y1="22" x2="236.1" y2="31.3" stroke="#c0392b" stroke-width="1.8"/><polygon points="232,34 235.7,28.1 238.9,32.8" fill="#c0392b"/>
<text font-family="HighNunito" x="254" y="36" font-size="8.5" fill="#c0392b">denitrifying bacteria:</text>
<text font-family="HighNunito" x="254" y="47" font-size="8.5" fill="#c0392b">NO₃<tspan font-family="HighSymbols">⁻</tspan><tspan dx="2.6" font-family="HighSymbols2">→</tspan> N₂ (back to air)</text></g>
</svg>
