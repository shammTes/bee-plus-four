<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 248">
<text font-family="HighNunito" x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25">Purifying (refining) copper by electrolysis</text>
<path d="M56 70 L60 74 L60 190 L280 190 L280 74 L284 70" fill="none" stroke="#55665f" stroke-width="2"/><rect x="62" y="100" width="216" height="89" fill="#bcd9f7"/>
<line x1="104" y1="50" x2="104" y2="34" stroke="#1b2b25" stroke-width="1.4"/><line x1="104" y1="34" x2="236" y2="34" stroke="#1b2b25" stroke-width="1.4"/><line x1="236" y1="34" x2="236" y2="50" stroke="#1b2b25" stroke-width="1.4"/><rect x="150" y="26" width="40" height="16" fill="#ffffff" stroke="#1b2b25" stroke-width="1.2"/><line x1="166" y1="29" x2="166" y2="39" stroke="#1b2b25" stroke-width="2"/><line x1="174" y1="31" x2="174" y2="37" stroke="#1b2b25" stroke-width="1.2"/><text font-family="HighNunito" x="146" y="30" text-anchor="end" font-size="10" fill="#2f6fa5">−</text><text font-family="HighNunito" x="194" y="30" font-size="10" fill="#c0392b">+</text>
<g data-hl="cathode"><rect x="98" y="50" width="12" height="120" fill="#c9824e"/>
<text font-family="HighNunito" x="104" y="206" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f6fa5">cathode (−): thin pure Cu</text>
<text font-family="HighNunito" x="104" y="219" text-anchor="middle" font-size="8.5" fill="#2f6fa5">Cu²<tspan font-family="HighSymbols">⁺</tspan> + 2e<tspan font-family="HighSymbols">⁻</tspan><tspan dx="2.6" font-family="HighSymbols2">→</tspan> Cu (grows)</text></g>
<g data-hl="anode"><rect x="222" y="50" width="28" height="120" fill="#9c6a3f"/>
<circle cx="230" cy="80" r="2" fill="#555"/>
<circle cx="242" cy="110" r="2" fill="#555"/>
<circle cx="232" cy="140" r="2" fill="#555"/>
<text font-family="HighNunito" x="236" y="206" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#c0392b">anode (+): impure Cu</text>
<text font-family="HighNunito" x="236" y="219" text-anchor="middle" font-size="8.5" fill="#c0392b">Cu<tspan dx="2.6" font-family="HighSymbols2">→</tspan> Cu²<tspan font-family="HighSymbols">⁺</tspan> + 2e<tspan font-family="HighSymbols">⁻</tspan> (thins)</text></g>
<g data-hl="mud"><path d="M200 188 Q236 178 272 188 Z" fill="#6b5b4b" stroke="#6b5b4b" stroke-width="1"/>
<text font-family="HighNunito" x="300" y="160" text-anchor="end" font-size="8.5" fill="#6b5b4b">anode mud:</text>
<text font-family="HighNunito" x="300" y="171" text-anchor="end" font-size="8.5" fill="#6b5b4b">Ag, Au, Pt</text>
<text font-family="HighNunito" x="170" y="240" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b2b25">electrolyte CuSO₄(aq) + H₂SO₄; impurities fall or stay dissolved</text></g>
<text font-family="HighNunito" x="170" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#55665f">Cu²<tspan font-family="HighSymbols">⁺</tspan></text><line x1="212" y1="146" x2="128.2" y2="146" stroke="#55665f" stroke-width="1.4"/><polygon points="124,146 129.5,143.6 129.5,148.4" fill="#55665f"/>
</svg>
