<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" font-family="sans-serif">
<text x="170" y="14" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b2b25">CuSO₄(aq): the anode material changes the anode product</text>
<path d="M56 70 L60 74 L60 190 L280 190 L280 74 L284 70" fill="none" stroke="#55665f" stroke-width="2"/><rect x="62" y="100" width="216" height="89" fill="#bcd9f7"/>
<line x1="104" y1="50" x2="104" y2="34" stroke="#1b2b25" stroke-width="1.4"/><line x1="104" y1="34" x2="236" y2="34" stroke="#1b2b25" stroke-width="1.4"/><line x1="236" y1="34" x2="236" y2="50" stroke="#1b2b25" stroke-width="1.4"/><rect x="150" y="26" width="40" height="16" fill="#ffffff" stroke="#1b2b25" stroke-width="1.2"/><line x1="166" y1="29" x2="166" y2="39" stroke="#1b2b25" stroke-width="2"/><line x1="174" y1="31" x2="174" y2="37" stroke="#1b2b25" stroke-width="1.2"/>
<rect x="96" y="50" width="16" height="120" fill="#b87333"/><rect x="94" y="110" width="2" height="60" fill="#8e4b1d"/><rect x="112" y="110" width="2" height="60" fill="#8e4b1d"/>
<text x="104" y="206" text-anchor="middle" font-size="9" fill="#2f6fa5">− cathode: Cu²⁺ + 2e⁻ → Cu</text><text x="104" y="218" text-anchor="middle" font-size="8.5" fill="#55665f">(pink-brown copper coats it)</text>
<g data-s="inert"><rect x="228" y="50" width="16" height="120" fill="#5d6d68"/>
<circle cx="232" cy="150" r="3" fill="#ffffff" stroke="#55665f" stroke-width="1"/>
<circle cx="232" cy="136" r="3" fill="#ffffff" stroke="#55665f" stroke-width="1"/>
<circle cx="232" cy="122" r="3" fill="#ffffff" stroke="#55665f" stroke-width="1"/>
<text x="250" y="206" text-anchor="middle" font-size="9" fill="#c0392b">graphite/Pt anode: O₂ given off</text>
<text x="250" y="218" text-anchor="middle" font-size="8.5" fill="#c0392b">4OH⁻ → 2H₂O + O₂ + 4e⁻</text>
<text x="170" y="240" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b2b25">blue colour fades (Cu²⁺ used up); solution turns acidic (H₂SO₄)</text></g>
<g data-s="copper"><rect x="228" y="50" width="16" height="120" fill="#b87333"/>
<rect x="230" y="140" width="12" height="30" fill="#d39a6a"/>
<text x="250" y="206" text-anchor="middle" font-size="9" fill="#c0392b">copper anode dissolves:</text>
<text x="250" y="218" text-anchor="middle" font-size="8.5" fill="#c0392b">Cu → Cu²⁺ + 2e⁻ (no gas)</text>
<text x="170" y="240" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b2b25">blue colour stays: Cu²⁺ made at anode = Cu²⁺ used at cathode</text></g>
</svg>
