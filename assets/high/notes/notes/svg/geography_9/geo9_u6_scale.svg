<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180">
<rect width="640" height="180" fill="#f3f7f4"/>
<text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1d3b2a">Scale 1:50 000</text>
<line x1="80" y1="80" x2="280" y2="80" stroke="#1d3b2a" stroke-width="3"/>
<line x1="80" y1="72" x2="80" y2="88" stroke="#1d3b2a" stroke-width="3"/>
<line x1="280" y1="72" x2="280" y2="88" stroke="#1d3b2a" stroke-width="3"/>
<text x="180" y="70" text-anchor="middle" font-family="sans-serif" font-size="14">1 cm on the map</text>
<text x="180" y="110" text-anchor="middle" font-family="sans-serif" font-size="14">= 500 m on the ground</text>
<text x="320" y="150" text-anchor="middle" font-family="sans-serif" font-size="14">4 cm on this map = 2 km</text>
</svg>
