<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 528" font-family="sans-serif">
<text x="180.0" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Darwin's natural selection</text>
<rect x="40.0" y="44" width="280" height="70" rx="10" fill="#e8f0e3" stroke="#4f7a4a" stroke-width="2"/>
<text x="180.0" y="66" text-anchor="middle" font-size="14" fill="#222">Overproduction: many</text>
<text x="180.0" y="84" text-anchor="middle" font-size="14" fill="#222">more offspring than can</text>
<text x="180.0" y="102" text-anchor="middle" font-size="14" fill="#222">survive</text>
<line x1="180.0" y1="116" x2="180.0" y2="137" stroke="#555" stroke-width="2"/>
<polygon points="174.0,135 186.0,135 180.0,145" fill="#555"/>
<rect x="40.0" y="148" width="280" height="70" rx="10" fill="#e8f0e3" stroke="#4f7a4a" stroke-width="2"/>
<text x="180.0" y="170" text-anchor="middle" font-size="14" fill="#222">Variation: members of a</text>
<text x="180.0" y="188" text-anchor="middle" font-size="14" fill="#222">species are not</text>
<text x="180.0" y="206" text-anchor="middle" font-size="14" fill="#222">identical</text>
<line x1="180.0" y1="220" x2="180.0" y2="241" stroke="#555" stroke-width="2"/>
<polygon points="174.0,239 186.0,239 180.0,249" fill="#555"/>
<rect x="40.0" y="252" width="280" height="70" rx="10" fill="#e8f0e3" stroke="#4f7a4a" stroke-width="2"/>
<text x="180.0" y="274" text-anchor="middle" font-size="14" fill="#222">Struggle for existence:</text>
<text x="180.0" y="292" text-anchor="middle" font-size="14" fill="#222">competition for food,</text>
<text x="180.0" y="310" text-anchor="middle" font-size="14" fill="#222">space, water</text>
<line x1="180.0" y1="324" x2="180.0" y2="345" stroke="#555" stroke-width="2"/>
<polygon points="174.0,343 186.0,343 180.0,353" fill="#555"/>
<rect x="40.0" y="356" width="280" height="52" rx="10" fill="#e8f0e3" stroke="#4f7a4a" stroke-width="2"/>
<text x="180.0" y="378" text-anchor="middle" font-size="14" fill="#222">Survival of the fittest:</text>
<text x="180.0" y="396" text-anchor="middle" font-size="14" fill="#222">the best-adapted survive</text>
<line x1="180.0" y1="410" x2="180.0" y2="431" stroke="#555" stroke-width="2"/>
<polygon points="174.0,429 186.0,429 180.0,439" fill="#555"/>
<rect x="40.0" y="442" width="280" height="70" rx="10" fill="#e8f0e3" stroke="#4f7a4a" stroke-width="2"/>
<text x="180.0" y="464" text-anchor="middle" font-size="14" fill="#222">Inheritance: favourable</text>
<text x="180.0" y="482" text-anchor="middle" font-size="14" fill="#222">variations pass to</text>
<text x="180.0" y="500" text-anchor="middle" font-size="14" fill="#222">offspring</text>
</svg>