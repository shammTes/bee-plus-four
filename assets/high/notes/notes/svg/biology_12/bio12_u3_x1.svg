<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 370" font-family="sans-serif">
<text x="180.0" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">A food chain: energy flows one way</text>
<rect x="40.0" y="44" width="280" height="52" rx="10" fill="#e8f0e3" stroke="#4f7a4a" stroke-width="2"/>
<text x="180.0" y="66" text-anchor="middle" font-size="14" fill="#222">Producer (green plant) —</text>
<text x="180.0" y="84" text-anchor="middle" font-size="14" fill="#222">makes its own food</text>
<line x1="180.0" y1="98" x2="180.0" y2="119" stroke="#555" stroke-width="2"/>
<polygon points="174.0,117 186.0,117 180.0,127" fill="#555"/>
<rect x="40.0" y="130" width="280" height="52" rx="10" fill="#e8f0e3" stroke="#4f7a4a" stroke-width="2"/>
<text x="180.0" y="152" text-anchor="middle" font-size="14" fill="#222">Primary consumer</text>
<text x="180.0" y="170" text-anchor="middle" font-size="14" fill="#222">(herbivore)</text>
<line x1="180.0" y1="184" x2="180.0" y2="205" stroke="#555" stroke-width="2"/>
<polygon points="174.0,203 186.0,203 180.0,213" fill="#555"/>
<rect x="40.0" y="216" width="280" height="52" rx="10" fill="#e8f0e3" stroke="#4f7a4a" stroke-width="2"/>
<text x="180.0" y="238" text-anchor="middle" font-size="14" fill="#222">Secondary consumer</text>
<text x="180.0" y="256" text-anchor="middle" font-size="14" fill="#222">(carnivore)</text>
<line x1="180.0" y1="270" x2="180.0" y2="291" stroke="#555" stroke-width="2"/>
<polygon points="174.0,289 186.0,289 180.0,299" fill="#555"/>
<rect x="40.0" y="302" width="280" height="52" rx="10" fill="#e8f0e3" stroke="#4f7a4a" stroke-width="2"/>
<text x="180.0" y="324" text-anchor="middle" font-size="14" fill="#222">Decomposers break down</text>
<text x="180.0" y="342" text-anchor="middle" font-size="14" fill="#222">dead bodies</text>
</svg>