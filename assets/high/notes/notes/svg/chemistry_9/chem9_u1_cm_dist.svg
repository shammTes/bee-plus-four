<text x="250" y="148" text-anchor="middle" font-size="9" fill="#2f6fa5">cold water in</text>
<line x1="258" y1="134" x2="248.7" y2="126.2" stroke="#2f6fa5" stroke-width="1.2"/><polygon points="246,124 250.8,125.4 248.2,128.5" fill="#2f6fa5"/>
<line x1="118" y1="64" x2="111.7" y2="53" stroke="#2f6fa5" stroke-width="1.2"/><polygon points="110,50 114,53 110.5,55" fill="#2f6fa5"/>
<text x="160" y="108" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f6fa5">condenser</text></g>
<g data-hl="h"><circle cx="70" cy="120" r="30" fill="#f4f8f6" stroke="#55665f" stroke-width="2"/><path d="M43 124 A27 27 0 0 0 97 124 Z" fill="#9fd0ec"/><rect x="63" y="58" width="14" height="34" fill="#f4f8f6" stroke="#55665f" stroke-width="2"/>
