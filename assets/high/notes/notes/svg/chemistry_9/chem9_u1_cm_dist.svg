<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" font-family="sans-serif">
<text x="170" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b25">Simple distillation: pure water from salt water</text>
