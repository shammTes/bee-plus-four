<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 272">
<text font-family="HighNunito" x="170" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25">Balancing an equation: the flow chart</text>
<g data-hl="skel"><rect x="70" y="30" width="200" height="40" rx="6" fill="#eef5ff" stroke="#9fb5ab" stroke-width="1.4"/><text font-family="HighNunito" x="170" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">1. Write the skeleton</text><text font-family="HighNunito" x="170" y="61" text-anchor="middle" font-size="8.5" fill="#55665f">correct formulas, never change them</text></g>
<line x1="170" y1="71" x2="170" y2="80.8" stroke="#1b2b25" stroke-width="1.4"/><polygon points="170,85 167.6,79.5 172.4,79.5" fill="#1b2b25"/>
<g data-hl="count"><rect x="70" y="86" width="200" height="40" rx="6" fill="#f4f8f6" stroke="#9fb5ab" stroke-width="1.4"/><text font-family="HighNunito" x="170" y="104" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">2. Count atoms</text><text font-family="HighNunito" x="170" y="117" text-anchor="middle" font-size="8.5" fill="#55665f">each element, left and right</text></g>
<line x1="170" y1="127" x2="170" y2="136.8" stroke="#1b2b25" stroke-width="1.4"/><polygon points="170,141 167.6,135.5 172.4,135.5" fill="#1b2b25"/>
<g data-hl="coef"><rect x="70" y="142" width="200" height="40" rx="6" fill="#eef5ff" stroke="#9fb5ab" stroke-width="1.4"/><text font-family="HighNunito" x="170" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">3. Add coefficients</text><text font-family="HighNunito" x="170" y="173" text-anchor="middle" font-size="8.5" fill="#55665f">big numbers in front only</text></g>
<line x1="170" y1="183" x2="170" y2="192.8" stroke="#1b2b25" stroke-width="1.4"/><polygon points="170,197 167.6,191.5 172.4,191.5" fill="#1b2b25"/>
<g data-hl="check"><rect x="70" y="198" width="200" height="40" rx="6" fill="#f4f8f6" stroke="#9fb5ab" stroke-width="1.4"/><text font-family="HighNunito" x="170" y="216" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b2b25">4. Check and reduce</text><text font-family="HighNunito" x="170" y="229" text-anchor="middle" font-size="8.5" fill="#55665f">equal counts, lowest ratio</text></g>
<path d="M270 160 C318 160 318 76 270 76" fill="none" stroke="#e67e22" stroke-width="1.4" stroke-dasharray="4 3"/><text font-family="HighNunito" x="322" y="122" text-anchor="end" font-size="8.5" fill="#e67e22">not equal?</text><text font-family="HighNunito" x="322" y="133" text-anchor="end" font-size="8.5" fill="#e67e22">adjust again</text>
<text font-family="HighNunito" x="170" y="262" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f6f4e">N₂ + 3H₂<tspan dx="2.6" font-family="HighSymbols2">→</tspan> 2NH₃ : N 2 = 2, H 6 = 6 (balanced)</text>
</svg>
