<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 212">
<text font-family="HighNunito" x="170" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25">Counting charges: sodium atom vs sodium ion</text>
<g data-s="atom"><circle cx="110" cy="112" r="22" fill="#fde3dc" stroke="#c0392b" stroke-width="1.2"/>
<text font-family="HighNunito" x="110" y="110" text-anchor="middle" font-size="9" font-weight="bold" fill="#c0392b">11 p<tspan font-family="HighSymbols">⁺</tspan></text>
<text font-family="HighNunito" x="110" y="121" text-anchor="middle" font-size="8.5" fill="#55665f">12 n</text>
<circle cx="110" cy="112" r="36" fill="none" stroke="#b8c7c0" stroke-width="1"/>
<circle cx="110" cy="112" r="54" fill="none" stroke="#b8c7c0" stroke-width="1"/>
<circle cx="110" cy="112" r="72" fill="none" stroke="#b8c7c0" stroke-width="1"/>
<circle cx="110" cy="76" r="4.2" fill="#2f6fa5"/>
<circle cx="110" cy="148" r="4.2" fill="#2f6fa5"/>
<circle cx="110" cy="58" r="4.2" fill="#2f6fa5"/>
<circle cx="148.2" cy="73.8" r="4.2" fill="#2f6fa5"/>
<circle cx="164" cy="112" r="4.2" fill="#2f6fa5"/>
<circle cx="148.2" cy="150.2" r="4.2" fill="#2f6fa5"/>
<circle cx="110" cy="166" r="4.2" fill="#2f6fa5"/>
<circle cx="71.8" cy="150.2" r="4.2" fill="#2f6fa5"/>
<circle cx="56" cy="112" r="4.2" fill="#2f6fa5"/>
<circle cx="71.8" cy="73.8" r="4.2" fill="#2f6fa5"/>
<circle cx="110" cy="40" r="4.2" fill="#2f6fa5"/>
<text font-family="HighNunito" x="266" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25">Na atom</text>
<text font-family="HighNunito" x="266" y="82" text-anchor="middle" font-size="10" fill="#c0392b">protons: +11</text>
<text font-family="HighNunito" x="266" y="98" text-anchor="middle" font-size="10" fill="#2f6fa5">electrons: −11</text>
<line x1="222" y1="106" x2="310" y2="106" stroke="#1b2b25" stroke-width="1"/>
<text font-family="HighNunito" x="266" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2b25">total: 0</text>
<text font-family="HighNunito" x="266" y="138" text-anchor="middle" font-size="9.5" fill="#2f6f4e">electrically neutral</text>
<text font-family="HighNunito" x="266" y="160" text-anchor="middle" font-size="10" fill="#55665f">2, 8, 1</text></g>
<g data-s="ion"><circle cx="110" cy="112" r="22" fill="#fde3dc" stroke="#c0392b" stroke-width="1.2"/>
<text font-family="HighNunito" x="110" y="110" text-anchor="middle" font-size="9" font-weight="bold" fill="#c0392b">11 p<tspan font-family="HighSymbols">⁺</tspan></text>
<text font-family="HighNunito" x="110" y="121" text-anchor="middle" font-size="8.5" fill="#55665f">12 n</text>
<circle cx="110" cy="112" r="36" fill="none" stroke="#b8c7c0" stroke-width="1"/>
<circle cx="110" cy="112" r="54" fill="none" stroke="#b8c7c0" stroke-width="1"/>
<circle cx="110" cy="112" r="72" fill="none" stroke="#b8c7c0" stroke-width="1"/>
<circle cx="110" cy="76" r="4.2" fill="#2f6fa5"/>
<circle cx="110" cy="148" r="4.2" fill="#2f6fa5"/>
<circle cx="110" cy="58" r="4.2" fill="#2f6fa5"/>
<circle cx="148.2" cy="73.8" r="4.2" fill="#2f6fa5"/>
<circle cx="164" cy="112" r="4.2" fill="#2f6fa5"/>
<circle cx="148.2" cy="150.2" r="4.2" fill="#2f6fa5"/>
<circle cx="110" cy="166" r="4.2" fill="#2f6fa5"/>
<circle cx="71.8" cy="150.2" r="4.2" fill="#2f6fa5"/>
<circle cx="56" cy="112" r="4.2" fill="#2f6fa5"/>
<circle cx="71.8" cy="73.8" r="4.2" fill="#2f6fa5"/>
<circle cx="206" cy="48" r="4.2" fill="#2f6fa5"/>
<line x1="172" y1="72" x2="197.2" y2="54" stroke="#2f6fa5" stroke-width="1.2"/><polygon points="200,52 197.5,56.3 195.1,53" fill="#2f6fa5"/>
<text font-family="HighNunito" x="206" y="38" text-anchor="middle" font-size="8.5" fill="#2f6fa5">e<tspan font-family="HighSymbols">⁻</tspan> lost</text>
<text font-family="HighNunito" x="266" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b2b25">Na<tspan font-family="HighSymbols">⁺</tspan> ion</text>
<text font-family="HighNunito" x="266" y="82" text-anchor="middle" font-size="10" fill="#c0392b">protons: +11</text>
<text font-family="HighNunito" x="266" y="98" text-anchor="middle" font-size="10" fill="#2f6fa5">electrons: −10</text>
<line x1="222" y1="106" x2="310" y2="106" stroke="#1b2b25" stroke-width="1"/>
<text font-family="HighNunito" x="266" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">total: +1</text>
<text font-family="HighNunito" x="266" y="138" text-anchor="middle" font-size="9.5" fill="#c0392b">not neutral: an ion</text>
<text font-family="HighNunito" x="266" y="160" text-anchor="middle" font-size="10" fill="#55665f">2, 8</text></g>
<text font-family="HighNunito" x="170" y="204" text-anchor="middle" font-size="9.5" fill="#55665f">Protons never change in a chemical reaction; only electrons move.</text>
</svg>
