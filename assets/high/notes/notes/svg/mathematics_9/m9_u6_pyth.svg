<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" font-family="HighNunito"><g data-s="k2 k3"><rect x="46" y="86" width="54" height="54" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="2"/><text x="73" y="118" font-size="13" text-anchor="middle" fill="#2F5F8F" font-weight="800">3² = 9</text><rect x="100" y="140" width="72" height="72" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="2"/><text x="136" y="182" font-size="14" text-anchor="middle" fill="#2A7A6B" font-weight="800">4² = 16</text></g><g data-s="k3"><path d="M100 86 L172 140 L226 68 L154 14 Z" fill="#FBE6E0" stroke="#C24E32" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="163" y="64" font-size="15" text-anchor="middle" fill="#C24E32" font-weight="800">5² = 25</text></g><path d="M100 140 L100 86 L172 140 Z" fill="none" stroke="#3E3129" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M100 131 L109 131 L109 140" fill="none" stroke="#3E3129" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><g data-s="k1"><text x="274" y="110" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">legs 3 and 4,</text><text x="274" y="128" font-size="13" text-anchor="middle" fill="#C24E32" font-weight="800">hypotenuse 5</text></g><g data-s="k2"><text x="274" y="110" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">squares on legs:</text><text x="274" y="128" font-size="14" text-anchor="middle" fill="#2A7A6B" font-weight="800">9 + 16 = 25</text></g><g data-s="k3"><text x="274" y="110" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">square on the</text><text x="274" y="128" font-size="13" text-anchor="middle" fill="#C24E32" font-weight="800">hypotenuse = 25</text><text x="274" y="156" font-size="15" text-anchor="middle" fill="#C24E32" font-weight="800">3² + 4² = 5²</text></g></svg>
