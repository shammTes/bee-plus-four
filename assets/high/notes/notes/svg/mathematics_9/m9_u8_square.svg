<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 200" font-family="HighNunito"><g data-s="k2 k3"><rect x="20" y="20" width="110" height="110" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="2"/><text x="75" y="81" font-size="18" text-anchor="middle" fill="#2F5F8F" font-weight="800">a²</text><rect x="130" y="20" width="50" height="110" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="2"/><text x="155" y="81" font-size="15" text-anchor="middle" fill="#2A7A6B" font-weight="800">ab</text><rect x="20" y="130" width="110" height="50" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="2"/><text x="75" y="161" font-size="15" text-anchor="middle" fill="#2A7A6B" font-weight="800">ab</text><rect x="130" y="130" width="50" height="50" fill="#FCEFD9" stroke="#B86E12" stroke-width="2"/><text x="155" y="161" font-size="15" text-anchor="middle" fill="#B86E12" font-weight="800">b²</text></g><g data-s="k1"><rect x="20" y="20" width="160" height="160" fill="#F1EEEA" stroke="#3E3129" stroke-width="2.6"/><text x="100" y="106" font-size="17" text-anchor="middle" fill="#3E3129" font-weight="800">(a + b)²</text></g><text x="75" y="14" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">a</text><text x="155" y="14" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">b</text><text x="190" y="75" font-size="13" fill="#3E3129" font-weight="800">a</text><text x="190" y="155" font-size="13" fill="#3E3129" font-weight="800">b</text><g data-s="k3"><text x="262" y="90" font-size="15" text-anchor="middle" fill="#3E3129" font-weight="800">(a + b)²</text><text x="262" y="114" font-size="14" text-anchor="middle" fill="#C24E32" font-weight="800">= a² + 2ab + b²</text><text x="262" y="140" font-size="12.5" text-anchor="middle" fill="#8A7F76" font-weight="800">NOT a² + b²</text></g></svg>
