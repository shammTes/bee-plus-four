<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 205" font-family="HighNunito"><g data-s="k1 k2 k3"><rect x="40" y="30" width="110" height="110" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="2"/><text x="95" y="90" font-size="15" text-anchor="middle" fill="#2F5F8F" font-weight="800">x²</text></g><g data-s="k1 k2 k3"><rect x="150" y="30" width="42" height="110" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="2"/><text x="171" y="90" font-size="13" text-anchor="middle" fill="#2A7A6B" font-weight="800">3x</text><rect x="40" y="140" width="110" height="42" fill="#DFF1EC" stroke="#2A7A6B" stroke-width="2"/><text x="95" y="166" font-size="13" text-anchor="middle" fill="#2A7A6B" font-weight="800">3x</text></g><g data-s="k2 k3" data-hl="k2"><rect x="150" y="140" width="42" height="42" fill="#FCEFD9" stroke="#B86E12" stroke-width="2.4"/><text x="171" y="166" font-size="14" text-anchor="middle" fill="#B86E12" font-weight="800">9</text></g><g data-s="k1" data-hl="k1"><rect x="150" y="140" width="42" height="42" fill="none" stroke="#B86E12" stroke-width="2" stroke-dasharray="6 4"/><text x="171" y="166" font-size="14" text-anchor="middle" fill="#B86E12" font-weight="800">?</text></g><text x="95" y="22" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">x</text><text x="171" y="22" font-size="13" text-anchor="middle" fill="#3E3129" font-weight="800">3</text><text x="30" y="89" font-size="13" text-anchor="end" fill="#3E3129" font-weight="800">x</text><text x="30" y="165" font-size="13" text-anchor="end" fill="#3E3129" font-weight="800">3</text><g data-s="k1"><text x="264" y="70" font-size="14" text-anchor="middle" fill="#3E3129" font-weight="800">x² + 6x</text><text x="264" y="92" font-size="12" text-anchor="middle" fill="#8A7F76" font-weight="800">is not a square</text></g><g data-s="k2"><text x="264" y="70" font-size="14" text-anchor="middle" fill="#B86E12" font-weight="800">add (6 ÷ 2)² = 9</text></g><g data-s="k3"><text x="264" y="70" font-size="14" text-anchor="middle" fill="#3E3129" font-weight="800">x² + 6x + 9</text><text x="264" y="92" font-size="14" text-anchor="middle" fill="#2A7A6B" font-weight="800">= (x + 3)²</text></g></svg>
