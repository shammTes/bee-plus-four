<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 210" font-family="HighNunito"><text x="70" y="54" font-size="17" fill="#3E3129" font-weight="800">3x² − 7x + 4</text><line x1="64" y1="36" x2="64" y2="64" stroke="#3E3129" stroke-width="2" stroke-linecap="round"/><line x1="64" y1="36" x2="200" y2="36" stroke="#3E3129" stroke-width="2" stroke-linecap="round"/><text x="58" y="54" font-size="17" text-anchor="end" fill="#2F5F8F" font-weight="800">x − 1</text><g data-s="k1 k2 k3" data-hl="k1"><text x="120" y="26" font-size="16" fill="#C24E32" font-weight="800">3x</text></g><g data-s="k3" data-hl="k3"><text x="162" y="26" font-size="16" fill="#C24E32" font-weight="800">− 4</text></g><g data-s="k2 k3" data-hl="k2"><text x="70" y="86" font-size="17" fill="#6A4C9C" font-weight="800">3x² − 3x</text><line x1="70" y1="94" x2="188" y2="94" stroke="#3E3129" stroke-width="1.4" stroke-linecap="round"/><text x="104" y="116" font-size="17" fill="#3E3129" font-weight="800">− 4x + 4</text><text x="10" y="86" font-size="11.5" fill="#8A7F76" font-weight="800">subtract</text></g><g data-s="k3" data-hl="k3"><text x="104" y="148" font-size="17" fill="#6A4C9C" font-weight="800">− 4x + 4</text><line x1="104" y1="156" x2="188" y2="156" stroke="#3E3129" stroke-width="1.4" stroke-linecap="round"/><text x="170" y="180" font-size="17" text-anchor="middle" fill="#2A7A6B" font-weight="800">0</text><text x="190" y="180" font-size="11.5" fill="#8A7F76" font-weight="800">remainder</text></g><text x="230" y="26" font-size="12" fill="#8A7F76" font-weight="800">quotient</text><text x="230" y="54" font-size="12" fill="#8A7F76" font-weight="800">dividend</text><text x="165" y="204" font-size="12" text-anchor="middle" fill="#8A7F76" font-weight="800">dividend = divisor × quotient + remainder</text></svg>
