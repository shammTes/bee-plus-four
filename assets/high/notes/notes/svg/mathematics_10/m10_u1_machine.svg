<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" font-family="HighNunito"><rect x="105" y="22" width="110" height="62" rx="10" fill="#E3EDF7" stroke="#2F5F8F" stroke-width="2.2"/><text x="160" y="50" font-size="20" text-anchor="middle" fill="#2F5F8F" font-weight="800" font-style="italic">f</text><text x="160" y="72" font-size="11" text-anchor="middle" fill="#2F5F8F" font-weight="600">machine</text><line x1="18" y1="53" x2="101" y2="53" stroke="#3E3129" stroke-width="2.2" stroke-linecap="round"/><path d="M101 53 L92.7 56.5 L92.7 49.5 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><line x1="219" y1="53" x2="302" y2="53" stroke="#3E3129" stroke-width="2.2" stroke-linecap="round"/><path d="M302 53 L293.7 56.5 L293.7 49.5 Z" fill="#3E3129" stroke="#3E3129" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="58" y="44" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">input x</text><text x="262" y="44" font-size="12.5" text-anchor="middle" fill="#3E3129" font-weight="800">output</text><text x="58" y="72" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">from the domain</text><text x="262" y="72" font-size="10" text-anchor="middle" fill="#8A7F76" font-weight="600">in the range</text><text x="160" y="108" font-size="12" text-anchor="middle" fill="#3E3129" font-weight="800">rule: subtract x from 4, then take the square root</text><text x="160" y="125" font-size="12" text-anchor="middle" fill="#2F5F8F" font-weight="800">f(x) = √(4 − x)</text></svg>
