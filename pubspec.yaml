name: four
description: Bee Plus 4 — offline G9–G12 study app (student / seller / master).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  crypto: ^3.0.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  pdfrx: ^1.0.82
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/content/phet/
    - assets/content/textbooks/
    - assets/content/illustrated_pdf/
  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
